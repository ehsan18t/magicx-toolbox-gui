<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/icons/Toolbox.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MagicX Toolbox</title>

    <script>
      (function () {
        // Mirrors theme.svelte.ts: the stored theme is JSON, and anything else follows the system.
        let theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        try {
          const stored = JSON.parse(localStorage.getItem("theme"));
          if (stored === "light" || stored === "dark") theme = stored;
        } catch {
          // Unreadable storage follows the system.
        }
        document.documentElement.setAttribute("data-theme", theme);

        // Mirrors app.css's --swatch-* colours: the saved accent applies before first paint.
        const schemes = {
          purple: "#8b5cf6",
          blue: "#3b82f6",
          green: "#10b981",
          orange: "#f97316",
          pink: "#ec4899",
          red: "#ef4444",
          cyan: "#06b6d4",
        };
        try {
          const scheme = JSON.parse(localStorage.getItem("magicx-color-scheme"));
          if (schemes[scheme]) {
            document.documentElement.setAttribute("data-scheme", scheme);
            document.documentElement.style.setProperty("--loader-accent", schemes[scheme]);
          }
        } catch {
          // Unreadable storage keeps the default accent.
        }
      })();
    </script>

    <style>
      /* Literal colours: app.css and its tokens load after this. */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0f1c;
        z-index: 9999;
      }
      [data-theme="light"] #initial-loader {
        background: #eef1f6;
      }
      /* Added once app.css has loaded, so the motion token resolves. */
      #initial-loader.fade-out {
        pointer-events: none;
        animation: var(--animate-fade-out);
      }
      .initial-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #1c2438;
        border-top-color: var(--loader-accent, #8b5cf6);
        border-radius: 50%;
        animation: initial-spin 1s linear infinite;
      }
      [data-theme="light"] .initial-spinner {
        border-color: #dbe2ec;
        border-top-color: var(--loader-accent, #8b5cf6);
      }
      /* main.ts shows it when the interface fails to start, so app.css may never load. */
      .startup-error {
        max-width: 28rem;
        padding: 1.5rem;
        font:
          14px/1.5 "Segoe UI",
          system-ui,
          sans-serif;
        --startup-text: #e5e9f0;
        color: var(--startup-text);
        text-align: center;
        overflow-wrap: anywhere;
      }
      [data-theme="light"] .startup-error {
        --startup-text: #1c2438;
      }
      .startup-error h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
      }
      .startup-error p {
        margin: 0 0 0.75rem;
      }
      .startup-error button {
        margin-top: 0.5rem;
        padding: 0.4rem 1.5rem;
        font: inherit;
        color: #fff;
        background: var(--loader-accent, #8b5cf6);
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      .startup-error button:focus-visible {
        outline: 2px solid var(--startup-text);
        outline-offset: 3px;
      }
      @keyframes initial-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="overflow-hidden">
    <div id="initial-loader">
      <div class="initial-spinner"></div>
    </div>
    <div id="app" class="contents"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
