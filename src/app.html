<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icons/Toolbox.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MagicX Toolbox</title>

    <script>
      (function () {
        // Hardcoded theme config to avoid "ReferenceError: __APP_CONFIG__ is not defined"
        // if Vite replacement fails in HTML.
        const config = {
          default: "dark",
          storageKey: "theme",
          followSystem: true,
        };

        const storedTheme = localStorage.getItem(config.storageKey);

        if (storedTheme) {
          document.documentElement.setAttribute("data-theme", storedTheme);
        } else if (config.followSystem) {
          const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", systemPrefersDark ? "dark" : "light");
        } else {
          document.documentElement.setAttribute("data-theme", config.default);
        }

        // Mirrors COLOR_SCHEMES in colorScheme.svelte.ts: the saved accent applies before first paint.
        const schemes = {
          purple: "#8b5cf6",
          blue: "#3b82f6",
          green: "#10b981",
          orange: "#f97316",
          pink: "#ec4899",
          red: "#ef4444",
          cyan: "#06b6d4",
        };
        try {
          const scheme = JSON.parse(localStorage.getItem("magicx-color-scheme"));
          if (schemes[scheme]) {
            document.documentElement.setAttribute("data-scheme", scheme);
            document.documentElement.style.setProperty("--loader-accent", schemes[scheme]);
          }
        } catch {
          // Unreadable storage keeps the default accent.
        }
      })();
    </script>

    <style>
      /* Initial loading spinner - uses hardcoded colors since CSS vars aren't loaded yet */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Dark theme default */
        background: #0a0f1c;
        z-index: 9999;
        transition: opacity 0.2s ease-out;
      }
      /* Light theme support */
      [data-theme="light"] #initial-loader {
        background: #eef1f6;
      }
      #initial-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .initial-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #1c2438;
        border-top-color: var(--loader-accent, #8b5cf6);
        border-radius: 50%;
        animation: initial-spin 0.8s linear infinite;
      }
      [data-theme="light"] .initial-spinner {
        border-color: #dbe2ec;
        border-top-color: var(--loader-accent, #8b5cf6);
      }
      @keyframes initial-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- SvelteKit injects app.css here to make sure other CSS loading does not get blocked by SvelteKit head content -->
    %sveltekit.head%
  </head>
  <body class="overflow-hidden" data-sveltekit-preload-data="hover">
    <!-- Initial loader shown before JS loads - hidden by Svelte when ready -->
    <div id="initial-loader">
      <div class="initial-spinner"></div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
