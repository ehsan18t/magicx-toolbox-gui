    options:
      - label: "Disabled"
        values: { enable_windows_backup: 0 }
      - label: "Enabled"
        values: { enable_windows_backup: absent }

  - id: disable_online_tips
    name: "Disable Settings app online tips"
    description: "Stop the Settings app fetching help and tip content from Microsoft."
    info: |
      **Stops the Settings app downloading help and tips from Microsoft; it shows only the help built into Windows.**

      ## Notes
      - The built-in help can be out of date, and fixes Microsoft publishes later do not appear.
      - Applies to every account. Takes effect immediately.

      ## Related
      - **Turn off Windows tips and suggestions** stops tip notifications, a different feature.
      - **Turn off suggested content in Settings** removes the promotional cards in Settings.

      ## Sources
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
