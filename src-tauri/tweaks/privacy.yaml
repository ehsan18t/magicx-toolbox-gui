    options:
      - label: "Off"
        values: { track_progs: 0 }
      - label: "On"
        values: { track_progs: absent }

  - id: disable_lockscreen_spotlight_ads
    name: "Turn off lock screen ads and fun facts"
    description: "Strip the ads, tips, and fun facts off the Spotlight lock screen while keeping the pictures."
    info: |
      **Keeps the Windows Spotlight pictures on your lock screen but removes the ads, tips and fun facts shown over them.**

      ## Drawbacks
      - The captions saying where a photo was taken go too.

      ## Notes
      - Only matters when your lock screen uses Windows Spotlight. Takes effect at the next lock screen.
      - Major Windows updates are widely reported to turn these back on.

      ## Related
      - **Turn off all Windows Spotlight features** (Debloat) removes Spotlight entirely, pictures included.

      ## Sources
      - [Facts, Tips, and Tricks on Lock Screen in Windows 11](https://www.elevenforum.com/t/enable-or-disable-facts-tips-and-tricks-on-lock-screen-in-windows-11.7079/)
      - [Win11Debloat](https://github.com/Raphire/Win11Debloat)
    risk_level: low
    elevation: user
    reversible: true
    effects:
