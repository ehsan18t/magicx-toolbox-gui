category:
  id: privacy
  name: "Privacy & Telemetry"
  icon: "mdi:shield-lock"
  description: "Windows telemetry, diagnostic data, advertising, and content-suggestion controls. Group-policy and per-user privacy settings, reversible from snapshots."

# Several tweaks here author a single option deliberately. An option is a state we drive the machine
# to, so every literal in one has to be sourced. Where a state is unresolved or consent-derived (a
# scheduled task's <Enabled> element, a service start type, a value that only materialises when the
# user answers a prompt), authoring a second option would mean inventing a literal and driving the
# machine to a state it may never have been in. One option leaves the way back to Restore Snapshot.
tweaks:
  - id: disable_diagnostic_data
    name: "Limit diagnostic data to the Required level"
    description: "Cap Windows diagnostic data at the Required level instead of the full optional level."
    info: |
      **Caps Windows diagnostic data at the Required level for every account, so optional data such as app usage and inking samples is no longer sent, and Settings can no longer raise it.**

      ## Drawbacks
      - The diagnostic data switch in Settings is greyed out until you revert.

      ## Caveats
      - Required diagnostic data is still sent: this is a cap, not an off switch, and the telemetry service keeps running.
      - Windows Insider builds raise the level again regardless of this setting.

      ## Notes
      - User's choice removes the policy, so the Settings switch works again.
      - Takes effect immediately.

      ## Related
      - **Disable User Experiences and Telemetry (DiagTrack)** (Services) stops the service that sends the data.

      ## Recommendation
      Worth applying on any personal PC. Hold off while Microsoft support is helping you with an update or crash problem.

      ## Sources
      - [Policy CSP - System](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-system)
      - [Configure Windows diagnostic data in your organization](https://learn.microsoft.com/en-us/windows/privacy/configure-windows-diagnostic-data-in-your-organization)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: allow_telemetry
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', name: AllowTelemetry, type: REG_DWORD }
    options:
      - label: "Required only"
        values: { allow_telemetry: 1 }
      - label: "User's choice"
        values: { allow_telemetry: absent }

  - id: disable_ceip_tasks
    name: "Disable the Customer Experience Improvement Program"
    description: "Opt out of the Customer Experience Improvement Program and disable its upload tasks."
    info: |
      **Opts this PC out of the Customer Experience Improvement Program, an older Microsoft data program, and disables its scheduled upload tasks.**

      ## Mechanism
      - Sets the opt-out policy and disables the program's Consolidator and USB tasks, the older kernel task where it exists, and the Sqm-Tasks collector that gathers TPM and Secure Boot data.

      ## Caveats
      - This is not a control for modern Windows telemetry, which is sent by a different service.
      - On a PC that never joined the program, the tasks already do nothing, so only the opt-out policy matters.

      ## Notes
      - A feature update may turn the tasks back on; the opt-out policy stays.
      - Reverting restores each task's previous state; it does not force them on.

      ## Related
      - **Disable Autochk Proxy task** (Services) covers another uploader for this program.
      - **Limit diagnostic data to the Required level** is the control for modern diagnostic data.

      ## Sources
      - [CEIPEnable (Microsoft)](https://learn.microsoft.com/en-us/windows/win32/devnotes/ceipenable)
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: ceip_enable
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\SQMClient\Windows', name: CEIPEnable, type: REG_DWORD }
      - id: task_consolidator
        task: { path: '\Microsoft\Windows\Customer Experience Improvement Program\Consolidator' }
      - id: task_usbceip
        task: { path: '\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip' }
      - id: task_kernelceip
        task: { path: '\Microsoft\Windows\Customer Experience Improvement Program\KernelCeipTask' }
        optional: true
        if_missing: disabled
      - id: task_sqm_pi
        task: { path: '\Microsoft\Windows\PI\Sqm-Tasks' }
        optional: true
        if_missing: disabled
    options:
      - label: "Disabled"
        values:
          ceip_enable: 0
          task_consolidator: disabled
          task_usbceip: disabled
          task_kernelceip: disabled
          task_sqm_pi: disabled

  - id: disable_compat_appraiser
    name: "Disable Compatibility Appraiser tasks"
    description: "Stop the Application Experience appraiser and inventory telemetry tasks and their policies."
    info: |
      **Stops the Compatibility Appraiser (CompatTelRunner.exe), which regularly scans your installed apps to report upgrade readiness to Microsoft, and turns off its app inventory collection.**

      ## Caveats
      - Windows Update uses this data to hold back feature updates that would break an app or driver, so such problems are less likely to be caught first.
      - Feature updates turn the tasks back on; the switch then shows System Default until you apply it again.
      - The compatibility database update task in the same folder is left alone: it keeps app compatibility fixes current and is not telemetry.

      ## Notes
      - The often-reported CPU and disk savings have not been measured by Microsoft or any benchmark.
      - Do not delete CompatTelRunner.exe yourself: Windows restores it, and removing it has broken updates.

      ## Related
      - **Disable app and device inventory collectors** covers the newer 24H2 collectors.

      ## Recommendation
      Apply it on a PC you keep on its current Windows version. Hold off before a feature upgrade, when these checks work in your favour.

      ## Sources
      - [DISA STIG V-253385: Application Compatibility Program Inventory](https://www.stigviewer.com/stigs/microsoft_windows_11/2022-06-24/finding/V-253385)
      - [Configure Windows diagnostic data in your organization](https://learn.microsoft.com/en-us/windows/privacy/configure-windows-diagnostic-data-in-your-organization)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: ait_enable
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', name: AITEnable, type: REG_DWORD }
      - id: disable_inventory
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', name: DisableInventory, type: REG_DWORD }
      - id: task_appraiser
        task: { path: '\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser' }
      - id: task_appraiser_exp
        task: { path: '\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser Exp' }
        optional: true
        if_missing: disabled
      # ProgramDataUpdater does not exist on 26100; it survives only for the Windows 10 surface.
      - id: task_progdata
        task: { path: '\Microsoft\Windows\Application Experience\ProgramDataUpdater' }
        optional: true
        if_missing: disabled
      - id: task_startup
        task: { path: '\Microsoft\Windows\Application Experience\StartupAppTask' }
      # Runs the appraiser's scheduled telemetry pass. PcaPatchDbTask in the same folder is left alone:
      # it updates the compatibility shim database, which is not telemetry.
      - id: task_marebackup
        task: { path: '\Microsoft\Windows\Application Experience\MareBackup' }
        optional: true
        if_missing: disabled
    options:
      - label: "Disabled"
        values:
          ait_enable: 0
          disable_inventory: 1
          task_appraiser: disabled
          task_appraiser_exp: disabled
          task_progdata: disabled
          task_startup: disabled
          task_marebackup: disabled

  - id: disable_feedback_notifications
    name: "Turn off feedback request notifications"
    description: "Stop Windows from prompting you with periodic feedback surveys."
    info: |
      **Stops Windows showing Feedback Hub survey prompts, for every account.**

      ## Notes
      - Only the prompts stop: diagnostic data is unchanged, and you can still open Feedback Hub yourself.
      - Takes effect immediately.

      ## Related
      - **Set feedback prompt frequency to Never** does the same for one account and adds nothing while this is applied.

      ## Sources
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: feedback_notif
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', name: DoNotShowFeedbackNotifications, type: REG_DWORD }
    options:
      - label: "Off"
        values: { feedback_notif: 1 }
      - label: "On"
        values: { feedback_notif: absent }

  - id: disable_feedback_frequency
    name: "Set feedback prompt frequency to Never"
    description: "Set the per-user Windows feedback prompt schedule to never."
    info: |
      **Sets how often Windows asks your account for feedback to Never, the same as the Feedback frequency choice in Settings.**

      ## Notes
      - Only your account changes, and Settings can change it back.
      - Automatic returns to Windows' own schedule.

      ## Related
      - **Turn off feedback request notifications** does this for every account and locks it; with it applied, this adds nothing.

      ## Sources
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: num_siuf
        registry: { key: 'HKCU\Software\Microsoft\Siuf\Rules', name: NumberOfSIUFInPeriod, type: REG_DWORD }
      - id: period_ns
        registry: { key: 'HKCU\Software\Microsoft\Siuf\Rules', name: PeriodInNanoSeconds, type: REG_DWORD }
    options:
      # Microsoft's documented mapping for "Never" is the pair (0, 0); 0 with the period deleted is not
      # one of the five states it publishes.
      - label: "Never"
        values: { num_siuf: 0, period_ns: 0 }
      - label: "Automatic"
        values: { num_siuf: absent, period_ns: absent }

  - id: disable_onesettings_downloads
    name: "Block OneSettings config downloads"
    description: "Stop Windows downloading configuration from Microsoft's OneSettings service."
    info: |
      **Stops Windows downloading configuration and feature settings from Microsoft's OneSettings service between updates.**

      ## Caveats
      - Microsoft warns that apps using this service "may stop working".
      - Configuration-only fixes Microsoft delivers this way will not reach this PC.

      ## Notes
      - Not a telemetry control: the amount of diagnostic data sent is unchanged.

      ## Recommendation
      Skip it on a PC where Store or Microsoft 365 apps must be reliable.

      ## Sources
      - [Policy CSP - System](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-system)
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
    risk_level: low
    elevation: admin
    reversible: true
    windows: { build: ">=22000" }
    effects:
      - id: onesettings
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', name: DisableOneSettingsDownloads, type: REG_DWORD }
    options:
      - label: "Blocked"
        values: { onesettings: 1 }
      - label: "Allowed"
        values: { onesettings: absent }

  - id: disable_device_name_in_telemetry
    name: "Exclude the device name from telemetry"
    description: "Pin the device-name exclusion so diagnostic data never carries your computer name."
    info: |
      **Records, as a policy, that your computer name is never included in Windows diagnostic data. Windows already leaves it out by default, so nothing visible changes.**

      ## Notes
      - Not configured removes the policy; the name is still left out, because that is Windows' default.
      - A policy pushed later by an organisation (Intune or a domain) still wins.

      ## Related
      - **Limit diagnostic data to the Required level** actually reduces what is sent.

      ## Sources
      - [Policy CSP - System](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-system)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      # The policy is named AllowDeviceNameInDiagnosticData but its valueName is AllowDeviceNameInTelemetry.
      # "Correcting" the spelling produces a silently ignored write.
      - id: device_name
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection', name: AllowDeviceNameInTelemetry, type: REG_DWORD }
    options:
      - label: "Excluded"
        values: { device_name: 0 }
      - label: "Not configured"
        values: { device_name: absent }

  - id: disable_activity_history
    name: "Disable Activity History and Timeline"
    description: "Stop Windows collecting and publishing your activity history."
    info: |
      **Stops Windows recording a history of what you do on this PC, and stops it publishing or uploading that history to your account, for every account.**

      ## Notes
      - On Windows 11, Timeline and cloud upload of activity history are already gone, so the change is small. On Windows 10, Timeline stops working.
      - History already stored is not deleted; clear it in Settings > Privacy & security > Activity history.
      - The Settings switches are locked while this is applied. Takes effect immediately.

      ## Sources
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
      - [Policy CSP - Privacy](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-privacy)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: enable_feed
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System', name: EnableActivityFeed, type: REG_DWORD }
      - id: publish_activities
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System', name: PublishUserActivities, type: REG_DWORD }
      - id: upload_activities
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System', name: UploadUserActivities, type: REG_DWORD }
    options:
      - label: "Disabled"
        values: { enable_feed: 0, publish_activities: 0, upload_activities: 0 }
      - label: "Enabled"
        values: { enable_feed: absent, publish_activities: absent, upload_activities: absent }

  - id: disable_cloud_clipboard
    name: "Disable the cross-device cloud clipboard"
    description: "Stop clipboard contents syncing to the Microsoft cloud and other devices."
    info: |
      **Stops what you copy being uploaded to Microsoft's cloud to sync with your other devices. Clipboard history (Win+V) on this PC keeps working.**

      ## Drawbacks
      - Copying on this PC and pasting on another device signed into the same account stops working, including clipboard sharing with a phone through Phone Link.

      ## Notes
      - Applies to every account. Takes effect immediately.

      ## Sources
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
      - [Policy CSP - System](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-system)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: cross_device_clip
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System', name: AllowCrossDeviceClipboard, type: REG_DWORD }
    options:
      - label: "Disabled"
        values: { cross_device_clip: 0 }
      - label: "Enabled"
        values: { cross_device_clip: absent }

  - id: disable_online_speech_recognition
    name: "Turn off online speech recognition"
    description: "Turn off cloud speech processing for your account."
    info: |
      **Stops your voice being sent to Microsoft's cloud speech service. Dictation and voice typing fall back to recognition on the device.**

      ## Drawbacks
      - Dictation is less accurate and supports fewer languages.
      - Voice features in apps that rely on Microsoft's cloud speech stop responding.

      ## Notes
      - Only your account changes.
      - On removes the setting so Windows asks you again, rather than recording consent you never gave.

      ## Related
      - **Disable inking and typing personalization** also turns online speech off for every account and locks it.
      - **Block voice activation and wake words** covers apps listening for a wake word.

      ## Sources
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
      - [Policy CSP - Privacy](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-privacy)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: speech_accepted
        registry: { key: 'HKCU\Software\Microsoft\Speech_OneCore\Settings\OnlineSpeechPrivacy', name: HasAccepted, type: REG_DWORD }
    options:
      - label: "Off"
        values: { speech_accepted: 0 }
      # The value is consent-derived and absent until the user answers. Writing 1 here would fabricate a
      # cloud-speech consent that was never granted, so the stock state is deletion.
      - label: "On"
        values: { speech_accepted: absent }

  - id: disable_inking_typing_personalization
    name: "Disable inking and typing personalization"
    description: "Stop Windows harvesting your typing and handwriting to build a personal language model."
    info: |
      **Stops Windows collecting samples of your typing and handwriting to build a personal dictionary and language model. It also turns online speech recognition off for every account.**

      ## Drawbacks
      - Autocorrect, text suggestions and handwriting recognition stop learning from you.
      - Cloud dictation stops working for every account on the PC.

      ## Notes
      - What Windows has already learned is not erased.
      - Two of the values it writes (the consent flag and contact name collection) are documented by the community, not by Microsoft.

      ## Related
      - **Turn off online speech recognition** is the per-account version of the speech part.

      ## Recommendation
      Skip it if you rely on pen input getting better over time, or if anyone on the PC uses dictation.

      ## Sources
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
      - [Policy CSP - Privacy](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-privacy)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: accepted_privacy
        registry: { key: 'HKCU\Software\Microsoft\Personalization\Settings', name: AcceptedPrivacyPolicy, type: REG_DWORD }
      - id: restrict_text
        registry: { key: 'HKCU\Software\Microsoft\InputPersonalization', name: RestrictImplicitTextCollection, type: REG_DWORD }
      - id: restrict_ink
        registry: { key: 'HKCU\Software\Microsoft\InputPersonalization', name: RestrictImplicitInkCollection, type: REG_DWORD }
      - id: harvest_contacts
        registry: { key: 'HKCU\Software\Microsoft\InputPersonalization\TrainedDataStore', name: HarvestContacts, type: REG_DWORD }
      # Globalization.admx "Allow users to enable online speech recognition services". The key is right
      # for that policy; it is a speech lock, not an inking control.
      - id: allow_input_policy
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\InputPersonalization', name: AllowInputPersonalization, type: REG_DWORD }
    options:
      - label: "Disabled"
        values:
          accepted_privacy: 0
          restrict_text: 1
          restrict_ink: 1
          harvest_contacts: 0
          allow_input_policy: 0

  - id: disable_advertising_id
    name: "Turn off the advertising ID"
    description: "Turn off the advertising ID that Store apps use to track you across sessions."
    info: |
      **Turns off the advertising ID that apps use to recognise you across apps and sessions for targeted ads, and locks the switch in Settings.**

      ## Notes
      - Ads still appear; they are just less targeted.
      - A few Store apps that expect the ID may behave oddly.
      - Covers every account, including accounts created later.

      ## Sources
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
      - [Policy CSP - Privacy](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-privacy)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: adv_policy
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo', name: DisabledByGroupPolicy, type: REG_DWORD }
      - id: adv_machine_enabled
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AdvertisingInfo', name: Enabled, type: REG_DWORD }
      - id: adv_enabled
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo', name: Enabled, type: REG_DWORD }
    options:
      - label: "Disabled"
        values: { adv_policy: 1, adv_machine_enabled: 0, adv_enabled: 0 }

  - id: disable_tailored_experiences
    name: "Turn off tailored experiences"
    description: "Stop Windows using your diagnostic data to target tips, ads, and recommendations."
    info: |
      **Stops Windows using your diagnostic data to choose the tips, ads and recommendations it shows your account. The suggestions become generic rather than stopping.**

      ## Notes
      - Only your account changes; apply it on each account that wants it.
      - Has nothing left to do if Windows Spotlight is fully turned off.
      - Takes effect immediately.

      ## Related
      - **Turn off all Windows Spotlight features** (Debloat) turns off the content this tweak personalises.

      ## Sources
      - [Policy CSP - Experience](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-experience)
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: tailored_user
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Privacy', name: TailoredExperiencesWithDiagnosticDataEnabled, type: REG_DWORD }
      # CloudContent.admx declares this policy class="User", so HKCU is the only hive Group Policy refreshes.
      - id: tailored_policy
        registry: { key: 'HKCU\Software\Policies\Microsoft\Windows\CloudContent', name: DisableTailoredExperiencesWithDiagnosticData, type: REG_DWORD }
    options:
      - label: "Off"
        values: { tailored_user: 0, tailored_policy: 1 }

  - id: disable_location_tracking
    name: "Turn off location tracking"
    description: "Turn off the Windows location platform and deny app location access."
    info: |
      **Turns off location for the whole PC, so neither Windows nor any app can find where you are, and locks the Location page in Settings.**

      ## Drawbacks
      - Automatic time zone stops working, so the clock can be wrong after you travel.
      - Find My Device can no longer locate the PC.
      - Weather, Maps and other location apps need you to enter a place by hand.

      ## Notes
      - Takes effect immediately; reopen Settings to see the change.

      ## Related
      - **Turn off Find My Device** has nothing left to do while this is applied.
      - **Disable Geolocation Service (lfsvc)** (Services) stops the service behind location.

      ## Recommendation
      Suits a desktop that never needs its location. Skip it on a laptop you travel with.

      ## Sources
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
      - [Policy CSP - Privacy](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-privacy)
    risk_level: medium
    elevation: admin
    reversible: true
    effects:
      - id: location_policy
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\LocationAndSensors', name: DisableLocation, type: REG_DWORD }
      - id: location_apps_policy
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy', name: LetAppsAccessLocation, type: REG_DWORD }
      - id: location_consent
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\location', name: Value, type: REG_SZ }
    options:
      - label: "Off"
        values: { location_policy: 1, location_apps_policy: 2, location_consent: "Deny" } # 2 = Force Deny

  - id: disable_app_diagnostics
    name: "Block app diagnostic access"
    description: "Block Store apps from reading diagnostic info about other running apps."
    info: |
      **Blocks Store apps from reading information about the other apps running on your PC, including your account name.**

      ## Drawbacks
      - Store monitoring or accessibility apps that need this lose their data.

      ## Caveats
      - Only Store (packaged) apps are blocked; regular desktop programs such as Task Manager still see everything.

      ## Notes
      - Applies to apps started after the change; restart apps that are already open.

      ## Sources
      - [Policy CSP - Privacy](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-privacy)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: appdiag_policy
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy', name: LetAppsGetDiagnosticInfo, type: REG_DWORD }
      - id: appdiag_consent
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\appDiagnostics', name: Value, type: REG_SZ }
    options:
      - label: "Denied"
        values: { appdiag_policy: 2, appdiag_consent: "Deny" } # 2 = Force Deny

  - id: disable_find_my_device
    name: "Turn off Find My Device"
    description: "Turn off the periodic location reporting used to locate a lost device."
    info: |
      **Stops Windows regularly reporting this PC's location to your Microsoft account, for every account.**

      ## Drawbacks
      - You can no longer locate or remotely lock this PC from your Microsoft account if it is lost or stolen.

      ## Notes
      - Takes effect immediately; the Settings switch is locked while this is applied.

      ## Recommendation
      Fine for a desktop that never leaves home. Skip it on a laptop or tablet.

      ## Sources
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
      - [Policy CSP - Experience](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-experience)
    risk_level: medium
    elevation: admin
    reversible: true
    effects:
      - id: fmd
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\FindMyDevice', name: AllowFindMyDevice, type: REG_DWORD }
    options:
      - label: "Off"
        values: { fmd: 0 }
      - label: "On"
        values: { fmd: absent }

  - id: disable_settings_sync
    name: "Disable settings sync"
    description: "Stop Windows syncing settings and saved passwords to your Microsoft account."
    info: |
      **Stops your settings, themes, language preferences and saved passwords syncing to your Microsoft account, for every account, and locks the sync switch in Settings.**

      ## Drawbacks
      - Another Windows device signed into your account no longer picks up your setup.

      ## Notes
      - Microsoft documents no restart for this; the app asks for one to be safe.

      ## Related
      - **Disable Windows Backup and cloud restore** covers the Windows 11 backup feature, which overlaps with sync but is separate.

      ## Sources
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
    risk_level: low
    elevation: admin
    reversible: true
    requires_reboot: true
    effects:
      - id: disable_sync
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\SettingSync', name: DisableSettingSync, type: REG_DWORD }
      - id: disable_sync_override
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\SettingSync', name: DisableSettingSyncUserOverride, type: REG_DWORD }
    options:
      - label: "Disabled"
        values: { disable_sync: 2, disable_sync_override: 1 } # DisableSettingSync 2 = disabled, not user-overridable
      - label: "Enabled"
        values: { disable_sync: absent, disable_sync_override: absent }

  - id: disable_error_reporting
    name: "Disable Windows Error Reporting"
    description: "Stop crash and error reports being generated and sent to Microsoft."
    info: |
      **Stops Windows creating crash and error reports and sending them to Microsoft.**

      ## Drawbacks
      - Local crash records go too: the report queue, app crash dumps and Reliability Monitor entries, which support usually asks for first.
      - Some third-party crash handlers behave differently.

      ## Notes
      - Full system crash dumps (MEMORY.DMP) are not affected.
      - At the Required diagnostic data level, crash dumps are not sent anyway, so the privacy gain is smaller than it looks.

      ## Related
      - **Disable the Windows Error Reporting service** stops the service itself.

      ## Recommendation
      Use it on a stable PC. Leave it off while you are chasing crashes.

      ## Sources
      - [WER settings (Microsoft)](https://learn.microsoft.com/en-us/windows/win32/wer/wer-settings)
      - [Configure Windows diagnostic data in your organization](https://learn.microsoft.com/en-us/windows/privacy/configure-windows-diagnostic-data-in-your-organization)
    risk_level: medium
    elevation: admin
    reversible: true
    effects:
      - id: wer_disabled
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting', name: Disabled, type: REG_DWORD }
      - id: wer_policy
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting', name: Disabled, type: REG_DWORD }
    options:
      - label: "Disabled"
        values: { wer_disabled: 1, wer_policy: 1 }
      - label: "Enabled"
        values: { wer_disabled: absent, wer_policy: absent }

  - id: disable_suggested_content_settings
    name: "Turn off suggested content in Settings"
    description: "Remove the promotional suggested-content cards shown inside the Settings app."
    info: |
      **Removes the promotional suggestion cards Microsoft shows inside the Settings app, for your account.**

      ## Caveats
      - Major Windows updates are widely reported to turn the cards back on.

      ## Notes
      - Microsoft does not document these values; they rest on several independent community sources.
      - Takes effect immediately; reopen Settings to see it.

      ## Sources
      - [Enable or Disable Suggested Content in Settings in Windows 11](https://www.elevenforum.com/t/enable-or-disable-suggested-content-in-settings-in-windows-11.3791/)
      - [privacy.sexy](https://github.com/undergroundwires/privacy.sexy)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: content_338393
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', name: SubscribedContent-338393Enabled, type: REG_DWORD }
      - id: content_353694
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', name: SubscribedContent-353694Enabled, type: REG_DWORD }
      - id: content_353696
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', name: SubscribedContent-353696Enabled, type: REG_DWORD }
      - id: content_353698
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', name: SubscribedContent-353698Enabled, type: REG_DWORD }
    options:
      - label: "Off"
        values: { content_338393: 0, content_353694: 0, content_353696: 0, content_353698: 0 }
      # No SubscribedContent-* value exists in the shipped Default user hive, so the stock state is deletion.
      - label: "On"
        values: { content_338393: absent, content_353694: absent, content_353696: absent, content_353698: absent }

  - id: disable_start_app_suggestions
    name: "Turn off Start menu app suggestions"
    description: "Stop promoted apps appearing among your Start menu entries."
    info: |
      **Stops promoted Store apps appearing in your Start menu's app list, for your account.**

      ## Notes
      - It does not clear the Windows 11 Recommended section, which has its own tweaks.
      - Major Windows updates are widely reported to turn suggestions back on.
      - Takes effect immediately in most cases; signing out makes sure.

      ## Related
      - **Turn off Start menu app promotions** (Debloat) covers the other half of the same Start suggestion slot; apply both.
      - **Turn off promoted recommendations in Start** and **Hide the Recommended section in Start** (Interface) cover the Recommended section.

      ## Sources
      - [Turn On or Off App Suggestions in Start](https://www.tenforums.com/tutorials/24117-turn-off-app-suggestions-start-windows-10-a.html)
      - [Win11Debloat](https://github.com/Raphire/Win11Debloat)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: pane_suggestions
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager', name: SystemPaneSuggestionsEnabled, type: REG_DWORD }
    options:
      - label: "Off"
        values: { pane_suggestions: 0 }
      # Genuinely seeded: present with data 1 in the shipped Default user hive on 26100.
      - label: "On"
        values: { pane_suggestions: 1 }

  - id: disable_app_launch_tracking
    name: "Turn off app launch tracking"
    description: "Stop Windows recording which apps you launch to rank Start and search results."
    info: |
      **Stops Windows counting which apps you open, the data behind the Most used list in Start and part of search ranking.**

      ## Drawbacks
      - The Most used list stops updating, and search ranks results less by your habits.

      ## Notes
      - This data never leaves your PC, so turning it off only guards against someone looking at this PC.
      - Only your account changes. Takes effect immediately.

      ## Sources
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
