    options:
      - label: "Disabled"
        values: { consumer_features_policy: 1 }
      - label: "Enabled"
        values: { consumer_features_policy: absent }

  - id: disable_edge_telemetry
    name: "Turn off Microsoft Edge telemetry"
    description: "Stop Edge using your browsing for personalization and reporting third-party searches."
    info: |
      **Stops Microsoft Edge using your browsing history, favourites and usage to personalise ads, search and news, and stops it capturing searches you make on Google or other search engines.**

      ## Notes
      - Not a full Edge telemetry switch: Edge's diagnostic data follows the Windows diagnostic data setting.
      - Does nothing on a PC without Edge. The search part applies at once; restart Edge for the rest.
      - Edge shows "managed by your organization" in its settings while any Edge policy is set.

      ## Related
      - **Limit diagnostic data to the Required level** also lowers Edge's diagnostic data.

      ## Sources
