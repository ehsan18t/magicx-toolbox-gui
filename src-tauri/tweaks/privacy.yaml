    options:
      - label: "Off"
        values: { soft_landing_policy: 1, soft_landing_pref: 0, content_338389: 0 }

  - id: disable_consumer_features
    name: "Disable Windows consumer features"
    description: "Turn off Microsoft consumer experiences by policy (honored on Enterprise, Education, and IoT only)."
    info: |
      **Turns off Microsoft's consumer extras by policy: apps installed automatically after setup, promoted Start tiles and membership notifications.**

      ## Requirements
      - Works only on Enterprise, Education and IoT Enterprise (including LTSC). On Home and Pro it does nothing at all.

      ## Related
      - **Turn off auto-installed sponsored apps** (Debloat) is the way to stop sponsored installs on Home and Pro.

      ## Sources
