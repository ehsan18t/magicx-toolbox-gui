  - id: disable_windows_backup
    name: "Disable Windows Backup and cloud restore"
    description: "Lock periodic Windows Backup and cloud restore off by policy."
    info: |
      **Locks periodic Windows Backup off by policy, so setup screens, Settings prompts or updates cannot switch it on later.**

      ## Drawbacks
      - You give up automatic cloud restore of your setup on a new PC or after a reinstall.

      ## Notes
      - Per Microsoft, periodic backup does not run while this policy is unset either, so there may be no visible change today.
      - You can still run the Windows Backup app by hand.
      - The Enabled option removes the policy; it does not turn backup on.

      ## Related
      - **Disable settings sync** covers the older settings roaming, a separate feature.

      ## Sources
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
