    name: "Disable cloud content in search"
    description: "Stop taskbar search querying your OneDrive, SharePoint, and Outlook content."
    info: |
      **Stops Windows search sending what you type to Microsoft to look through your OneDrive, SharePoint and Outlook content, for personal and work accounts. Search then shows local results only.**

