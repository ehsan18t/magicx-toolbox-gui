    options:
      - label: "Off"
        values: { rotating_lock: 0, content_338387: 0 }
      # Split default: the overlay value is seeded with 1 in the Default user hive, the subscription value is not.
      - label: "On"
        values: { rotating_lock: 1, content_338387: absent }

  - id: disable_tips_and_suggestions
    name: "Turn off Windows tips and suggestions"
    description: "Stop the tip, trick, and suggestion notifications Windows pops while you work."
    info: |
      **Stops the "tips, tricks and suggestions" notifications Windows shows while you use it.**

      ## Caveats
      - The machine-wide policy part works only on Enterprise, Education and IoT editions. On Home and Pro only your own account's setting changes, which still stops the tips for you.
      - Major Windows updates are widely reported to turn the per-account setting back on.

      ## Notes
      - Takes effect immediately.

      ## Related
      - **Disable Settings app online tips** stops a different kind of tip: help content that Settings downloads.

      ## Sources
