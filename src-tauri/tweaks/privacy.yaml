      - label: "Allowed"
        values: { lang_optout: absent }

  - id: disable_explorer_cloud_recommendations
    name: "Disable File Explorer cloud recommendations"
    description: "Stop File Explorer calling Microsoft's cloud for file recommendations."
    info: |
      **Stops File Explorer asking Microsoft's cloud for file suggestions based on your account activity, such as recent OneDrive and SharePoint files, for every account.**

      ## Drawbacks
      - Shortcuts to recently used cloud files disappear from Home, and the Details pane stops showing activity for cloud files.

      ## Notes
      - Your local recent files are a separate setting and are not affected.
      - Takes effect immediately; restart File Explorer to refresh Home.

      ## Related
      - **Hide recent files and folders in Explorer** (Interface) hides the local recent list.

      ## Sources
      - [Manage connections from Windows to Microsoft services](https://learn.microsoft.com/en-us/windows/privacy/manage-connections-from-windows-operating-system-components-to-microsoft-services)
    risk_level: low
    elevation: admin
    reversible: true
    windows: { build: ">=22621" }
    effects:
      - id: graph_recent_items
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer', name: DisableGraphRecentItems, type: REG_DWORD }
    options:
      - label: "Disabled"
        values: { graph_recent_items: 1 }
      - label: "Enabled"
        values: { graph_recent_items: absent }

  - id: disable_app_device_inventory
    name: "Disable app and device inventory collectors"
    description: "Turn off the four app and device inventory collectors added in Windows 11 24H2."
    info: |
      **Turns off four background collectors added in Windows 11 24H2: install tracing, API sampling, app file and registry sampling, and the compatibility scan for apps restored from backup.**

      ## Drawbacks
      - Restoring your apps from Windows Backup on a new PC loses its compatibility scan.
      - Microsoft has less to go on if you hit an app compatibility problem.

      ## Related
      - **Disable Compatibility Appraiser tasks** covers the older inventory collectors.

      ## Recommendation
      Skip it if you plan to restore your apps from Windows Backup on a new PC.

      ## Sources
      - [Configure Windows diagnostic data in your organization](https://learn.microsoft.com/en-us/windows/privacy/configure-windows-diagnostic-data-in-your-organization)
    risk_level: low
    elevation: admin
    reversible: true
    windows: { build: ">=26100" }
    effects:
      - id: install_tracing
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', name: DisableInstallTracing, type: REG_DWORD }
      # "Samping" is Microsoft's own misspelling in AppDeviceInventory.admx. Do not correct it.
      - id: api_sampling
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', name: DisableAPISamping, type: REG_DWORD }
      - id: application_footprint
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', name: DisableApplicationFootprint, type: REG_DWORD }
      - id: win32_app_backup
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppCompat', name: DisableWin32AppBackup, type: REG_DWORD }
    options:
      - label: "Disabled"
        values: { install_tracing: 1, api_sampling: 1, application_footprint: 1, win32_app_backup: 1 }
      - label: "Enabled"
        values: { install_tracing: absent, api_sampling: absent, application_footprint: absent, win32_app_backup: absent }

  - id: disable_search_history
    name: "Turn off device search history"
    description: "Stop Windows keeping a history of what you have searched for on this device."
    info: |
      **Stops Windows saving what you search for on this device for your account, so recent searches no longer appear when you open search.**

      ## Notes
      - This history stays on your PC, so turning it off only guards against someone using this PC.
      - Microsoft does not document this value; the search app itself and independent tools confirm it.
      - Takes effect immediately.

      ## Sources
      - [privacy.sexy](https://github.com/undergroundwires/privacy.sexy)
