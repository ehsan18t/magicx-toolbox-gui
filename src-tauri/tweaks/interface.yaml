      - Affects every app that puts its tabs in Alt+Tab, not only one browser.
      - Applies to your account only.
      - Windows decides removes this policy, so the Alt+Tab choice in Settings > System > Multitasking applies again.
      - Takes effect after Explorer restarts or a sign-out.

      ## Recommendation
      Pick Open windows only if you keep many tabs open and Alt+Tab has become hard to use. Skip it if you jump to single tabs with Alt+Tab.

      ## Sources
      - [Configure the inclusion of app tabs into Alt+Tab (policy reference)](https://admx.help/?Category=Windows_11_2022&Policy=Microsoft.Policies.Multitasking::BrowserAltTabBlowout)
