    description: "Add \"End task\" to the taskbar right-click menu so you can kill a hung app in one click."
    info: |
      **Adds End task to the right-click menu of every taskbar button, so you can close a frozen app without opening Task Manager.**

      ## Caveats
      - End task closes the app and its child processes at once, with no prompt to save, so unsaved work is lost.

