  - id: explorer_expand_to_current_folder
    name: "Expand the tree to the open folder"
    description: "The Explorer sidebar tree opens and highlights whatever folder you are currently viewing."
    info: |
      **Makes the File Explorer sidebar expand to, and highlight, the folder you are viewing.**

