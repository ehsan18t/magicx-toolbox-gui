  # The policy key's enum is 1-based (4 = open windows only). The identically named value under
  # Explorer\Advanced uses a 0-based enum where 3 means the same thing. Never reuse a number
  # across the two keys: writing 3 here means "windows plus 3 recent tabs", the opposite intent.
  - id: alt_tab_hide_browser_tabs
    name: "Alt+Tab shows windows only"
    description: "Alt+Tab lists your open windows again instead of filling up with browser tabs."
    info: |
      **Makes Alt+Tab list only your open windows, or windows plus a few recent tabs, instead of filling up with browser tabs.**

