      - The same as the Expand to open folder option in Folder Options. Takes effect after Explorer restarts.

      ## Sources
      - [Expand Folder in the Navigation Pane in Windows 11](https://www.elevenforum.com/t/turn-on-or-off-expand-folder-in-navigation-pane-of-file-explorer-in-windows-11.2544/)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: expand_to_folder
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: NavPaneExpandToCurrentFolder, type: REG_DWORD }
    options:
      - label: "Expand"
        values: { expand_to_folder: 1 }
      - label: "Do not expand"
        values: { expand_to_folder: absent }

  - id: explorer_restore_folders_at_logon
    name: "Restore Explorer windows at sign-in"
    description: "Reopen the File Explorer windows you had open when you last signed out."
    info: |
      **Reopens the File Explorer windows you had open when you last signed out.**

      ## Drawbacks
      - Sign-in takes a little longer while the windows open, and your folder names show on screen at sign-in.
      - Folders on disconnected drives or network shares fail to reopen.

      ## Notes
      - Starts working from your next sign-out and sign-in.

      ## Sources
      - [Restore previous folder windows at logon in Windows 11](https://www.elevenforum.com/t/turn-on-or-off-restore-previous-folder-windows-at-logon-in-windows-11.5177/)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: persist_browsers
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: PersistBrowsers, type: REG_DWORD }
    options:
      - label: "Restore"
        values: { persist_browsers: 1 }
      - label: "Do not restore"
        values: { persist_browsers: absent }

  - id: taskbar_full_date_time
    name: "Show the full date and time in the tray"
    description: "Show the full date with the year and an AM/PM marker in the taskbar clock."
    info: |
      **Shows the full date with the year, and the AM/PM marker, in the taskbar clock.**

      ## Drawbacks
      - The clock takes noticeably more taskbar space.

      ## Notes
      - Applies to your account only.
      - Nothing changes until you restart, and reverting also needs a restart.

      ## Related
      - **Show seconds in the tray clock** adds seconds; the two combine.

      ## Sources
      - [Show shortened time and date on the taskbar in Windows 11](https://www.elevenforum.com/t/enable-or-disable-show-shortened-time-and-date-on-taskbar-in-windows-11.26235/)
      - [Show the full date in the Windows 11 taskbar](https://winaero.com/taskbar-full-date-time/)
    risk_level: low
    elevation: admin
    reversible: true
    requires_reboot: true
    windows: { build: ">=22621" }
    effects:
      - id: full_date_time
        registry: { key: 'HKCU\SOFTWARE\Policies\Microsoft\Windows\Explorer', name: TurnOffAbbreviatedDateTimeFormat, type: REG_DWORD }
    options:
      - label: "Full format"
        values: { full_date_time: 1 }
      - label: "Abbreviated"
        values: { full_date_time: absent }

  - id: hide_recently_added_apps
    name: "Hide recently added apps in Start"
    description: "Remove the \"Recently added\" list of newly installed apps from the Start menu."
    info: |
      **Removes the Recently added list of newly installed apps from the Start menu.**

      ## Requirements
      - Home edition is not in Microsoft's supported list for this policy.

      ## Notes
      - Applies to your account only.
      - The matching switch in Settings is greyed out while this is on.
      - Takes effect after a restart; reverting also needs one.

      ## Sources
      - [Policy CSP - Start](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-start)
    risk_level: low
    elevation: admin
    reversible: true
    requires_reboot: true
    effects:
      - id: hide_recently_added
        registry: { key: 'HKCU\SOFTWARE\Policies\Microsoft\Windows\Explorer', name: HideRecentlyAddedApps, type: REG_DWORD }
    options:
      - label: "Hidden"
        values: { hide_recently_added: 1 }
      - label: "Shown"
        values: { hide_recently_added: absent }

  - id: taskbar_last_active_click
    name: "Focus the last active window on click"
    description: "Clicking a grouped taskbar button jumps straight to the window you used last."
    info: |
      **When an app's windows share one taskbar button, clicking it goes straight to the window you used last instead of showing thumbnails to pick from.**

      ## Notes
      - Hover the button to see the thumbnails and pick a different window.
      - Only matters while taskbar buttons are combined.
      - Takes effect after Explorer restarts.

      ## Sources
      - [Always Use Last Active Click on Taskbar in Windows 11](https://www.elevenforum.com/t/enable-or-disable-always-use-last-active-click-on-taskbar-in-windows-11.6360/)
    risk_level: low
    elevation: user
    reversible: true
    windows: { products: [11] }
    effects:
      - id: last_active_click
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: LastActiveClick, type: REG_DWORD }
    options:
      - label: "Focus the last active window"
        values: { last_active_click: 1 }
      - label: "Show the thumbnail chooser"
        values: { last_active_click: absent }

  - id: disable_notification_center
    name: "Remove the Notification Center"
    description: "Remove the Notification Center panel and its taskbar entry point entirely."
    info: |
      **Removes the Notification Center panel and its taskbar button for every account. Pop-up notifications still appear, but anything you miss cannot be reviewed later.**

      ## Caveats
      - On Windows 11 the calendar shares this panel and is likely to disappear too; Microsoft does not document this either way.

      ## Notes
      - Takes effect after a restart; reverting also needs one.

      ## Related
      - **Turn off toast notifications** silences the pop-ups instead.

      ## Recommendation
      Suited to kiosks and locked-down PCs. On a normal desktop, use Do Not Disturb when you want quiet.

      ## Sources
      - [Policy CSP - ADMX Taskbar](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-admx-taskbar)
      - [Remove Notifications and Action Center (policy reference)](https://admx.help/?Category=Windows_10_2016&Policy=Microsoft.Policies.TaskBar2::DisableNotificationCenter)
    risk_level: medium
    elevation: admin
    reversible: true
    requires_reboot: true
    effects:
      - id: notification_center
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer', name: DisableNotificationCenter, type: REG_DWORD }
    options:
      - label: "Removed"
        values: { notification_center: 1 }
      - label: "Shown"
        values: { notification_center: absent }
