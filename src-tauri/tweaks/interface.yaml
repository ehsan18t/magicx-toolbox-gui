category:
  id: interface
  name: "Interface & Explorer"
  icon: "mdi:monitor"
  description: "Desktop, taskbar, and File Explorer appearance and behavior. Per-user (HKCU) preferences, safe and reversible."

tweaks:
  - id: enable_dark_mode
    name: "Turn on dark mode"
    description: "Switch Windows, the shell and your apps to the dark color theme."
    info: |
      **Switches both Windows and your apps to the dark theme in one step: taskbar, Start, File Explorer and every app that follows the system theme.**

      ## Drawbacks
      - Some older dialogs, MMC consoles and Control Panel pages stay light.
      - A few apps that are already open switch only after you restart them.

      ## Notes
      - Takes effect immediately, and the Settings page keeps working as usual.
      - Both parts are set together; a mix of dark apps and a light Windows (or the reverse) shows as System Default.

      ## Sources
      - [Choose Dark or Light Mode for Colors in Windows 11](https://www.elevenforum.com/t/choose-dark-or-light-mode-for-colors-in-windows-11.555/)
      - [Enable Dark mode on Windows](https://pureinfotech.com/enable-dark-mode-windows-10/)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: apps_theme
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize', name: AppsUseLightTheme, type: REG_DWORD }
      - id: system_theme
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize', name: SystemUsesLightTheme, type: REG_DWORD }
    options:
      - label: "Dark"
        values: { apps_theme: 0, system_theme: 0 }
      - label: "Light"
        values: { apps_theme: 1, system_theme: 1 }

  - id: disable_transparency
    name: "Turn off transparency effects"
    description: "Make the taskbar, Start menu and flyouts solid instead of translucent."
    info: |
      **Makes the taskbar, Start menu, Settings and flyouts solid instead of see-through, so their text stands out from the wallpaper.**

      ## Notes
      - A look-and-readability change: on any modern graphics card it does not make Windows faster.
      - Battery saver and reduced visual effects can switch transparency off on their own, whatever this is set to.
      - Takes effect within a second or two.

      ## Sources
      - [Enable or Disable Transparency in Windows 11](https://winaero.com/how-to-enable-or-disable-transparency-in-windows-11/)
      - [Enable or Disable Transparency Effects in Windows 11](https://www.ninjaone.com/blog/enable-or-disable-transparency-effects-in-windows-11/)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: transparency
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize', name: EnableTransparency, type: REG_DWORD }
    options:
      - label: "Off"
        values: { transparency: 0 }
      - label: "On"
        values: { transparency: 1 }

  - id: disable_ui_animations
    name: "Turn off window animations"
    description: "Remove the slide and fade animations when windows open, close, minimise and maximise."
    info: |
      **Removes the slide and fade animations when windows open, close, minimise and maximise, plus the taskbar and Start animations.**

      ## Drawbacks
      - Without the motion it is harder to see where a minimised window went.

      ## Notes
      - The taskbar part applies after Explorer restarts; the window part only after you sign out and back in. The app does not prompt for the sign-out.
      - Switching Settings > Accessibility > Visual effects > Animation effects later overwrites this.

      ## Related
      - **Set visual effects to best performance** (Performance) applies the rest of the best-performance visual profile and leaves these two animations to this tweak.

      ## Recommendation
      Worth it on low-end hardware or over Remote Desktop, where the delay is noticeable. Skip it if you rely on the motion to follow your windows.

      ## Sources
      - [Animate windows when minimizing and maximizing](https://www.tenforums.com/tutorials/126788-enable-disable-animate-windows-when-minimizing-maximizing.html)
      - [Enable or Disable Animations in the Taskbar](https://www.tenforums.com/tutorials/126795-enable-disable-animations-taskbar-windows-10-a.html)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: taskbar_anim
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: TaskbarAnimations, type: REG_DWORD }
      - id: min_animate
        registry: { key: 'HKCU\Control Panel\Desktop\WindowMetrics', name: MinAnimate, type: REG_SZ }
    options:
      - label: "Off"
        values: { taskbar_anim: 0, min_animate: "0" }
      - label: "On"
        values: { taskbar_anim: 1, min_animate: "1" }

  # Polarity note: `DisallowShaking = 0` turns the gesture ON. Windows 11 ships it off, so that
  # option is an opt-in, not a restore.
  - id: disable_aero_shake
    name: "Disable Aero Shake"
    description: "Stop windows minimising when you grab a title bar and shake it."
    info: |
      **Stops windows from minimising when you grab a title bar and shake it.**

      ## Notes
      - Windows 11 and Windows 10 LTSC 2021 already ship with shaking off, so applying may change nothing you can see, and an untouched PC may show System Default.
      - Enabled switches the gesture on; it is not the Windows default.
      - Takes effect after Explorer restarts. The Settings toggle (System > Multitasking > Title bar window shake) keeps working.

      ## Sources
      - [Enable or Disable Title Bar Window Shake in Windows 11](https://www.elevenforum.com/t/enable-or-disable-title-bar-window-shake-in-windows-11.2078/)
      - [Enable or Disable Aero Shake in Windows 10](https://www.tenforums.com/tutorials/4417-how-enable-disable-aero-shake-windows-10-a.html)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: shaking
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: DisallowShaking, type: REG_DWORD }
    options:
      - label: "Disabled"
        values: { shaking: 1 }
      - label: "Enabled"
        values: { shaking: 0 }

  - id: show_file_extensions
    name: "Show file name extensions"
    description: "Show the real file extension on every file, so a disguised executable cannot hide."
    info: |
      **Shows the extension on every file name (such as .pdf or .exe), so a file like `invoice.pdf.exe` cannot pass itself off as a PDF.**

      ## Drawbacks
      - File names get longer, and renaming a file can change its extension by mistake (Explorer warns you first).

      ## Notes
      - Only your account changes. Takes effect after Explorer restarts, or press F5 in an open window.

      ## Recommendation
      Worth applying on almost any PC. The only reason to skip it is a shared PC where someone is likely to break files while renaming them.

      ## Sources
      - [Show or Hide File Name Extensions in Windows 11](https://www.elevenforum.com/t/show-or-hide-file-name-extensions-for-known-file-types-in-windows-11.898/)
      - [Explorer Advanced registry reference](https://renenyffenegger.ch/notes/Windows/registry/tree/HKEY_CURRENT_USER/Software/Microsoft/Windows/CurrentVersion/Explorer/Advanced/index)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: hide_ext
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: HideFileExt, type: REG_DWORD }
    options:
      - label: "Show"
        values: { hide_ext: 0 }
      - label: "Hide"
        values: { hide_ext: 1 }

  - id: show_hidden_files
    name: "Show hidden files and folders"
    description: "Reveal hidden files and folders in File Explorer, without exposing protected system files."
    info: |
      **Shows hidden files and folders in File Explorer, such as AppData. Protected system files such as `pagefile.sys` stay hidden.**

      ## Drawbacks
      - Folders show extra clutter such as `desktop.ini`.

      ## Caveats
      - Hidden app data folders become easy to delete by mistake.
      - Security monitoring tools on work PCs may flag this change, because malware also makes it.

      ## Notes
      - Takes effect after Explorer restarts, or press F5 in an open window.

      ## Sources
      - [Explorer Advanced registry reference](https://renenyffenegger.ch/notes/Windows/registry/tree/HKEY_CURRENT_USER/Software/Microsoft/Windows/CurrentVersion/Explorer/Advanced/index)
      - [What does the SuperHidden registry value control?](https://fleexlab.blogspot.com/2017/08/what-does-superhidden-registry-value.html)
      - [Sigma rule for this change](https://detection.fyi/sigmahq/sigma/windows/registry/registry_set/registry_set_hide_file/)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: hidden
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: Hidden, type: REG_DWORD }
    options:
      - label: "Show"
        values: { hidden: 1 }
      - label: "Hide"
        values: { hidden: 2 }

  - id: open_explorer_to_this_pc
    name: "Open File Explorer to This PC"
    description: "File Explorer opens on your drives instead of a feed of recent files."
    info: |
      **File Explorer opens on This PC (your drives) instead of the Home page with its recent files and pinned folders.**

      ## Drawbacks
      - Pinned folders and recent files are one click further away.

      ## Notes
      - Applies to new Explorer windows after Explorer restarts.

      ## Related
      - **Hide Home in Explorer**: apply this tweak first or together with it, so Explorer does not open to a page you hid.

      ## Sources
      - [Change the startup page of File Explorer on Windows 11](https://pureinfotech.com/open-file-explorer-this-pc-instead-quick-access-windows-11/)
      - [Open File Explorer to This PC by default](https://memstechtips.com/set-file-explorer-launch-this-pc-regedit/)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: launch_to
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: LaunchTo, type: REG_DWORD }
    options:
      - label: "This PC"
        values: { launch_to: 1 }
      - label: "Home / Quick Access"
        values: { launch_to: 2 }

  - id: explorer_full_path_title
    name: "Show the full path in the Explorer title"
    description: "Put the full folder path in the Explorer window title instead of just the folder name."
    info: |
      **Uses the full folder path (such as `C:\Users\You\Projects`) as the Explorer window title instead of just the folder name.**

      ## Notes
      - On Windows 11 the title bar holds tabs, so you mostly see the path in Alt+Tab and taskbar previews. On Windows 10 it shows in the title bar.
      - The address bar does not change.
      - Takes effect after Explorer restarts.

      ## Sources
      - [Display Full Path in Title Bar of File Explorer in Windows 11](https://www.elevenforum.com/t/turn-on-or-off-display-full-path-in-title-bar-of-file-explorer-in-windows-11.3585/)
      - [Display Full Path in Title Bar of File Explorer in Windows 10](https://www.tenforums.com/tutorials/3430-display-full-path-title-bar-file-explorer-windows-10-a.html)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: full_path
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\CabinetState', name: FullPath, type: REG_DWORD }
    options:
      - label: "On"
        values: { full_path: 1 }
      - label: "Off"
        values: { full_path: 0 }

  - id: disable_recent_files
    name: "Hide recent files and folders in Explorer"
    description: "Empty the recent files and frequent folders lists from the File Explorer Home page."
    info: |
      **Hides the recent files and frequent folders lists on the File Explorer Home page. Pinned folders stay.**

      ## Caveats
      - On recent Windows 11 builds, turning this off may clear the saved recent list instead of hiding it, so old entries may not come back when you revert.
      - Windows keeps recording what you open; this only hides the lists.

      ## Notes
      - Takes effect after Explorer restarts.

      ## Related
      - **Turn off recent items tracking** stops the recording itself. With both applied, reverting only one leaves Recent empty.
      - **Disable File Explorer cloud recommendations** (Privacy) removes the cloud file suggestions, which this tweak does not touch.

      ## Sources
      - [Disable recent files and frequent folders in Explorer](https://matthewhill.uk/windows/group-policy-disable-recent-files-frequent-folder-explorer/)
      - [How to Remove Recent Files in File Explorer](https://www.ninjaone.com/blog/how-to-remove-recent-files-in-file-explorer/)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: show_recent
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer', name: ShowRecent, type: REG_DWORD }
      - id: show_frequent
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer', name: ShowFrequent, type: REG_DWORD }
    options:
      - label: "Off"
        values: { show_recent: 0, show_frequent: 0 }
      - label: "On"
        values: { show_recent: 1, show_frequent: 1 }

  - id: disable_start_recent_items
    name: "Turn off recent items tracking"
    description: "Stop Windows recording what you opened, across Start, jump lists and File Explorer at once."
    info: |
      **Stops Windows tracking the files you open, so they no longer appear in Start, taskbar jump lists or File Explorer's Recent section.**

      ## Drawbacks
      - Right-clicking a taskbar app no longer lists your recent documents.

      ## Notes
      - The same switch as Settings > Personalization > Start > Show recently opened items.
      - Takes effect after Explorer restarts.

      ## Related
      - **Hide recent files and folders in Explorer** also empties Explorer's Recent list; with both applied, reverting only one leaves it empty.
      - **Hide the Recommended section in Start** removes the whole Start section these files appear in.

      ## Recommendation
      Use it on a shared PC or if you do not want your documents on show. Skip it if you reopen work from jump lists.

      ## Sources
      - [Recommended files in Start, recent files in Explorer and jump lists](https://www.elevenforum.com/t/enable-or-disable-recommended-files-in-start-recent-files-in-file-explorer-and-items-in-jump-lists-in-windows-11.1161/)
      - [Recently opened files: how to hide or show them](https://www.majorgeeks.com/content/page/recently_opened_files_how_to_hide_or_show_them_in_jump_listsfile_explorerand_start_menu.html)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: track_docs
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: Start_TrackDocs, type: REG_DWORD }
    options:
      - label: "Off"
        values: { track_docs: 0 }
      - label: "On"
        values: { track_docs: absent }

  - id: disable_task_view_button
    name: "Hide the Task View button"
    description: "Remove the Task View icon from the taskbar without disabling virtual desktops."
    info: |
      **Removes the Task View button from the taskbar. Virtual desktops and Win+Tab keep working.**

      ## Notes
      - Takes effect immediately on Windows 11, after Explorer restarts on Windows 10.

      ## Recommendation
      Hide it if you use Win+Tab or no virtual desktops. Keep it on a touch device, where the button is the easy way in.

      ## Sources
      - [Add or Remove Task View Button on Taskbar in Windows 11](https://www.elevenforum.com/t/add-or-remove-task-view-button-on-taskbar-in-windows-11.1037/)
      - [Add or remove the Task View button](https://www.ninjaone.com/blog/add-or-remove-the-task-view-button-on-the-taskbar-in-windows-11/)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: task_view
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: ShowTaskViewButton, type: REG_DWORD }
    options:
      - label: "Hidden"
        values: { task_view: 0 }
      - label: "Shown"
        values: { task_view: 1 }

  - id: seconds_in_tray_clock
    name: "Show seconds in the tray clock"
    description: "The taskbar clock ticks in seconds instead of only showing hours and minutes."
    info: |
      **Makes the taskbar clock show seconds.**

      ## Drawbacks
      - Redrawing the clock every second uses a little more power, which Microsoft's own Settings text warns about. It matters on battery.

      ## Notes
      - Takes effect after Explorer restarts.

      ## Related
      - **Show the full date and time in the tray** adds the year and AM/PM; the two combine.

      ## Sources
      - [Show Seconds in System Tray Clock in Windows 11](https://www.elevenforum.com/t/turn-on-or-off-show-seconds-in-system-tray-clock-in-windows-11.10591/)
      - [Enable seconds for the taskbar clock in Windows 11](https://winaero.com/how-to-enable-seconds-for-the-taskbar-clock-in-windows-11/)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: clock_seconds
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: ShowSecondsInSystemClock, type: REG_DWORD }
    options:
      - label: "Shown"
        values: { clock_seconds: 1 }
      - label: "Hidden"
        values: { clock_seconds: 0 }

  # Ships the per-user preference only. The durable HKLM policy companion (EnableDynamicContentInWSB)
  # is deliberately omitted so this stays a user-level tweak; the info block documents it instead.
  - id: disable_search_highlights
    name: "Turn off search highlights"
    description: "Remove the rotating artwork and trending topics from the Windows search box."
    info: |
      **Removes the artwork and trending topics Microsoft shows in the Windows search box and search panel.**

      ## Notes
      - It does not change how search finds your apps and files.
      - A Settings change or a feature update can turn highlights back on.
      - Takes effect after Explorer restarts or the next time search opens.

      ## Related
      - **Turn off web results in Start search** (Debloat) removes Bing results, a separate feature.

      ## Sources
      - [Enable or Disable Search Highlights in Windows 11](https://www.elevenforum.com/t/enable-or-disable-search-highlights-in-windows-11.5735/)
      - [Enable or Disable Search Highlights in Windows 10](https://www.tenforums.com/tutorials/194711-enable-disable-search-highlights-windows-10-a.html)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: search_highlights
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings', name: IsDynamicSearchBoxEnabled, type: REG_DWORD }
    options:
      - label: "Off"
        values: { search_highlights: 0 }
      - label: "On"
        values: { search_highlights: 1 }

  - id: taskbar_search_mode
    name: "Taskbar search style"
    description: "Shrink or remove the taskbar search box, the widest element on a stock Windows 11 taskbar."
    info: |
      **Chooses how search appears on the taskbar: hidden, an icon, an icon with a label, or the full search box (the Windows 11 default).**

      ## Requirements
      - Icon and label needs Windows 11. Windows 10 does not support it, and the app does not stop you picking it there.

      ## Notes
      - Hiding it does not turn search off: press the Windows key and type.
      - Takes effect immediately.

      ## Recommendation
      Icon only frees the space and keeps a mouse route. Pick Hidden only if you always search from the keyboard.

      ## Sources
      - [Customizing search on the Windows 11 taskbar](https://techcommunity.microsoft.com/blog/windows-itpro-blog/customizing-search-on-the-windows-11-taskbar/3730314)
      - [Disabling the Windows 11 taskbar search box for all users](https://awakecoding.com/posts/disabling-the-windows-11-taskbar-search-box-for-all-users/)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: search_mode
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Search', name: SearchboxTaskbarMode, type: REG_DWORD }
      # Windows reads a missing cache value as "no preference recorded" and re-migrates the mode back
      # to 2, so every non-stock option pins it. The stock option leaves it absent: re-migration to 2
      # is a no-op there, and writing 1 would leave an artefact on an otherwise pristine profile.
      - id: search_mode_cache
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Search', name: SearchboxTaskbarModeCache, type: REG_DWORD }
    options:
      - label: "Hidden"
        values: { search_mode: 0, search_mode_cache: 1 }
      - label: "Icon only"
        values: { search_mode: 1, search_mode_cache: 1 }
      - label: "Search box"
        values: { search_mode: 2, search_mode_cache: absent }
      - label: "Icon and label"
        values: { search_mode: 3, search_mode_cache: 1 }

  - id: taskbar_ungroup_labels
    name: "Ungroup taskbar buttons"
    description: "Give every window its own labelled taskbar button instead of stacking them under one icon."
    info: |
      **Gives each window its own labelled taskbar button instead of stacking an app's windows under one icon.**

      ## Notes
      - Combine when the taskbar is full keeps labels until space runs out. Always combine, hide labels is the Windows default.
      - Applies to the taskbar on every display; the main and extra monitors cannot be set differently here.
      - Takes effect immediately.

      ## Related
      - **Focus the last active window on click** only matters while buttons are combined.

      ## Recommendation
      Never combine suits a wide monitor with a handful of windows open. On a laptop screen, pick Combine when the taskbar is full or keep the default.

      ## Sources
      - [Enable taskbar labels and never combine on Windows 11](https://pureinfotech.com/show-taskbar-labels-never-combine-windows-11/)
      - [Always or Never Combine Taskbar Buttons in Windows 11](https://www.elevenforum.com/t/always-or-never-combine-taskbar-buttons-and-hide-labels-in-windows-11.15135/)
      - [Never combine taskbar buttons in Windows 11 25H2](https://www.tech2geek.net/how-to-enable-never-combine-taskbar-buttons-in-windows-11-25h2/)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: glom_level
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: TaskbarGlomLevel, type: REG_DWORD }
      - id: mm_glom_level
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: MMTaskbarGlomLevel, type: REG_DWORD }
    options:
      - label: "Never combine"
        values: { glom_level: 2, mm_glom_level: 2 }
      - label: "Combine when the taskbar is full"
        values: { glom_level: 1, mm_glom_level: 1 }
      - label: "Always combine, hide labels"
        values: { glom_level: 0, mm_glom_level: 0 }

  - id: taskbar_hover_time
    name: "Show taskbar thumbnails instantly"
    description: "Taskbar thumbnail previews appear the moment you hover instead of after a pause."
    warning: "Widely reported to have stopped working on Windows 11 24H2 and newer. The value name still exists in the shipping taskbar, but the redesigned taskbar appears not to read it, so applying this may change nothing you can see."
    info: |
      **Makes taskbar thumbnail previews appear as soon as you hover a button, instead of after a 400 ms pause.**

      ## Drawbacks
      - Previews pop up whenever the cursor crosses the taskbar.

      ## Notes
      - Works on Windows 10 and on Windows 11 up to 23H2.
      - Takes effect after you sign out or restart Explorer.

      ## Recommendation
      Worth applying on Windows 10. On 24H2 and newer, expect no change and do not spend time troubleshooting it.

      ## Sources
      - [Change hover time for taskbar thumbnail previews in Windows 11](https://www.elevenforum.com/t/change-hover-time-to-show-taskbar-thumbnail-previews-in-windows-11.6366/)
      - [ExtendedUIHoverTime is not working anymore (Microsoft Q&A)](https://learn.microsoft.com/en-us/answers/questions/2263244/extendeduihovertime-is-not-working-anymore)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: hover_time
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: ExtendedUIHoverTime, type: REG_DWORD }
    options:
      - label: "Instant"
        values: { hover_time: 1 }
      - label: "400 ms"
        values: { hover_time: absent }

  - id: taskbar_alignment_left
    name: "Left-align the taskbar"
    description: "Move Start and the pinned icons back to the left corner of the taskbar."
    info: |
      **Moves Start and your taskbar icons to the left corner, as in Windows 10, instead of the centre.**

      ## Benefits
      - Start stays in one place instead of shifting as apps open and close.

      ## Notes
      - Takes effect immediately.

      ## Sources
      - [Change Taskbar Alignment in Windows 11](https://www.elevenforum.com/t/change-taskbar-alignment-in-windows-11.12/)
      - [Left-align the taskbar on Windows 11](https://pureinfotech.com/align-taskbar-icons-left-windows-11/)
    risk_level: low
    elevation: user
    reversible: true
    windows: { products: [11] }
    effects:
      - id: taskbar_align
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: TaskbarAl, type: REG_DWORD }
    options:
      - label: "Left"
        values: { taskbar_align: 0 }
      - label: "Center"
        values: { taskbar_align: 1 }

  - id: disable_snap_flyout
    name: "Turn off the snap layouts hover flyout"
    description: "Stop the snap layout grid popping out when the cursor passes a window's maximise button."
    info: |
      **Stops the snap layout grid popping up when your cursor rests on a window's maximise button.**

      ## Notes
      - Snapping still works: drag a window to a screen edge or use Win+Arrow. Win+Z still opens the layout grid.
      - The layout bar that drops down when you drag a window to the top of the screen stays on.
      - Takes effect after Explorer restarts or a sign-out.

      ## Related
      - **Turn off the Snap Assist suggestion picker** turns off the suggestions shown after you snap a window.

      ## Sources
      - [Disable the snap layouts flyout on the maximize button](https://www.askvg.com/how-to-disable-snap-layouts-flyout-on-maximize-button-in-windows-11/)
      - [Enable or disable Snap Layouts on hover](https://www.thewindowsclub.com/enable-snap-layouts-on-windows-11)
    risk_level: low
    elevation: user
    reversible: true
    windows: { products: [11] }
    effects:
      - id: snap_flyout
        registry: { key: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', name: EnableSnapAssistFlyout, type: REG_DWORD }
    options:
      - label: "Off"
        values: { snap_flyout: 0 }
      - label: "On"
        values: { snap_flyout: absent }

