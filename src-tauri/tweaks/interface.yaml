  - id: disable_toast_notifications
    name: "Turn off toast notifications"
    description: "Silence every pop-up notification on the machine, from every app and from Windows itself."
    info: |
      **Stops every pop-up notification for your account, from all apps and from Windows itself.**

      ## Caveats
      - Security warnings (Windows Security, BitLocker), backup failures and low-battery warnings are hidden too.

      ## Notes
      - Takes effect after you sign out and back in; the app does not prompt for it. Reverting also needs a sign-out.
      - The Settings switch may show the old state until you sign in again.

      ## Related
      - **Silence suggested and backup reminder toasts** (Debloat) silences only two Windows nag notifications.
      - **Remove the Notification Center** removes the history panel; pop-ups still appear.

      ## Recommendation
      Use it for a demo, a recording or a kiosk. For everyday quiet, turn on Do Not Disturb instead: it hides pop-ups but keeps what you missed.

      ## Sources
      - [How to disable notifications in Windows 11](https://winaero.com/how-to-disable-notifications-in-windows-11/)
      - [Turn On or Off Notifications in Windows 11](https://www.elevenforum.com/t/turn-on-or-off-notifications-in-windows-11.821/)
    risk_level: medium
    elevation: user
    reversible: true
    effects:
      - id: toast_enabled
