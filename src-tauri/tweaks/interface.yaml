    options:
      - label: "Classic"
        values: { context_menu: "" }
      - label: "Modern"
        values: { context_menu: absent }

  - id: numlock_on_startup
    name: "Turn NumLock on at startup"
    description: "Turn NumLock on automatically for your sessions, so the numeric keypad works right away."
    info: |
      **Turns NumLock on when you sign in, so the number keypad works right away.**

      ## Drawbacks
      - On laptops whose letter keys double as a number pad, NumLock on turns those letters into digits.

      ## Caveats
      - Windows saves the live NumLock state at every sign-out, so if you switch NumLock off during a session it stays off next time, and the switch may then show System Default.
      - The sign-in screen uses its own setting, which this does not change.
      - Fast Startup can bring back the old keyboard state and override this.

      ## Notes
      - Takes effect after you sign out and back in; the app does not prompt for it.

      ## Related
      - **Disable Fast Startup (hiberboot)** (Performance) removes the Fast Startup override.

      ## Sources
      - [InitialKeyboardIndicators (Microsoft reference)](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-2000-server/cc978657%28v=technet.10%29)
      - [Enable NumLock on the sign-in screen](https://winaero.com/enable-numlock-logon-screen-windows-10/)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: numlock
        registry: { key: 'HKCU\Control Panel\Keyboard', name: InitialKeyboardIndicators, type: REG_SZ }
    options:
      - label: "NumLock on"
        values: { numlock: "2147483650" }
      - label: "NumLock off"
        values: { numlock: "0" }

