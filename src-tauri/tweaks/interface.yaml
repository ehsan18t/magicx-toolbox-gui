  # Polarity note: `DisableStartupSound = 0` turns the chime ON. It is an opt-in, not a restore.
  - id: disable_startup_sound
    name: "Silence the startup sound"
    description: "Silence the Windows startup chime played when the sign-in screen appears, or switch it back on."
    info: |
      **Silences the Windows startup sound that plays when the sign-in screen appears, for every account. The other option switches it on.**

      ## Caveats
      - The Sound control panel has its own Windows Startup sound setting, which can still turn the sound on or off independently.
      - A leftover value from an older, retired policy can override this setting.

      ## Notes
      - Takes effect at the next startup.
      - Play the startup sound turns the sound on explicitly; to get back exactly what this PC had before, choose System Default.

      ## Sources
      - [DisableStartupSound (Microsoft unattend reference)](https://learn.microsoft.com/en-us/windows-hardware/customize/desktop/unattend/microsoft-windows-authentication-authui-disablestartupsound)
      - [Enable or Disable Startup Sound in Windows 11](https://www.elevenforum.com/t/enable-or-disable-startup-sound-in-windows-11.85/)
      - [Disable the Windows 11 startup sound](https://winaero.com/disable-windows-11-startup-sound-using-these-three-methods/)
    risk_level: low
    elevation: admin
    reversible: true
    requires_reboot: true
    effects:
      - id: startup_sound
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Authentication\LogonUI\BootAnimation', name: DisableStartupSound, type: REG_DWORD }
    options:
      - label: "Silent"
        values: { startup_sound: 1 }
      - label: "Play the startup sound"
        values: { startup_sound: 0 }

  # One authored option only. `Flags` is a live bitmask of every sub-option for each accessibility
  # feature, so a hardcoded "restore" constant would clobber unrelated sub-settings. Revert therefore
  # goes through the snapshot, which carries the machine's own pre-apply values.
  - id: disable_accessibility_key_prompts
    name: "Turn off accessibility shortcut prompts"
    description: "Stop the Sticky Keys, Filter Keys and Toggle Keys popups that fire from stray key presses."
    info: |
      **Stops the Sticky Keys, Filter Keys and Toggle Keys pop-ups that appear when you press Shift five times, hold Shift or hold NumLock.**

      ## Caveats
      - It writes fixed values: if Sticky Keys, Filter Keys or Toggle Keys is switched on, applying switches it off, and custom options for all three are reset until you revert.
      - Anyone who uses these keyboard shortcuts to turn the features on loses them.

      ## Notes
      - Takes effect after you sign out and back in; the app does not prompt for it. Reverting restores your own previous values and also needs a sign-out.
      - The features stay available in Settings > Accessibility > Keyboard.

      ## Recommendation
      Use it if the prompts interrupt games or fast typing. Skip it on an account where someone relies on these features.

      ## Sources
      - [STICKYKEYS structure (Microsoft)](https://learn.microsoft.com/en-us/windows/win32/api/winuser/ns-winuser-stickykeys)
      - [Turn On or Off Sticky Keys in Windows 11](https://www.elevenforum.com/t/turn-on-or-off-sticky-keys-in-windows-11.8889/)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      - id: sticky_keys
        registry: { key: 'HKCU\Control Panel\Accessibility\StickyKeys', name: Flags, type: REG_SZ }
      - id: filter_keys
        registry: { key: 'HKCU\Control Panel\Accessibility\Keyboard Response', name: Flags, type: REG_SZ }
      - id: toggle_keys
        registry: { key: 'HKCU\Control Panel\Accessibility\ToggleKeys', name: Flags, type: REG_SZ }
    options:
      - label: "Prompts off"
        values: { sticky_keys: "506", filter_keys: "122", toggle_keys: "58" }

  - id: classic_context_menu_win11
    name: "Restore the classic context menu"
    description: "Bring back the full Windows 10 right-click menu, so shell extensions appear on the first click."
    info: |
      **Brings back the full Windows 10 right-click menu, so entries from apps like 7-Zip or Git appear without clicking Show more options.**

      ## Drawbacks
      - You lose the Windows 11 menu, including its icon row for cut, copy, rename and delete.
      - Apps that add entries only to the new menu may lose them.

      ## Caveats
      - An undocumented method: it works on 24H2 and 25H2, but a future update could stop honouring it.

      ## Notes
      - Takes effect after Explorer restarts.

      ## Sources
      - [Restore the old right-click context menu in Windows 11 (Microsoft Q&A)](https://learn.microsoft.com/en-us/answers/questions/2287432/article-restore-old-right-click-context-menu-in-wi)
      - [Unable to change the Windows 11 context menu with the registry (Microsoft Q&A)](https://learn.microsoft.com/en-us/answers/questions/4045956/unable-to-change-win11-context-menu-with-registry)
    risk_level: low
