    options:
      - label: "Off"
        values: { toast_enabled: 0 }
      - label: "On"
        values: { toast_enabled: 1 }

  - id: verbose_logon_messages
    name: "Show verbose logon messages"
    description: "Replace the sign-in spinner with step-by-step text so you can see what Windows is doing."
    info: |
      **Shows what Windows is doing during startup, sign-in, sign-out and shutdown (such as "Applying computer settings") instead of a plain spinner.**

      ## Drawbacks
      - The extra text can look like an error to other users, and it can show policy or server names on a shared screen.

      ## Notes
      - Applies to every account on the PC.
      - Has no effect while the policy that removes these status messages is on.

      ## Recommendation
      Useful while tracking down a slow sign-in or shutdown. Turn it off on a shared or public PC.

      ## Sources
      - [Display highly detailed status messages (policy reference)](https://admx.help/?Category=Windows_10_2016&Policy=Microsoft.Policies.WindowsLogon::VerboseStatus)
      - [Enable detailed status messages](https://www.tenforums.com/tutorials/100262-enable-detailed-status-messages-shut-down-sign-out-sign.html)
    risk_level: low
    elevation: admin
    reversible: true
    requires_reboot: true
