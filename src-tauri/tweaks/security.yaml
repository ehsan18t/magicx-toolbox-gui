category:
  id: security
  name: "Security Hardening"
  icon: "mdi:shield-check"
  description: "Curated Windows security hardening: credential protection, network and remote-access lockdown, Defender defenses, and attack-surface reduction. Reversible from snapshots."

# The ADMX parent value that makes the ASR\Rules subkey read as Configured. Four separate ASR tweaks
# need it set, and they must agree, so it is a corpus-level shared setting rather than four owners.
shared:
  - id: defender_asr_policy_enabled
    registry:
      { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR', name: ExploitGuard_ASR_Rules, type: REG_DWORD }
    value: 1

tweaks:
  - id: disable_remote_registry
    name: "Disable the Remote Registry service"
    description: "Disable the Remote Registry service so this PC's registry cannot be edited from the network."
    info: |
      **Disables the Remote Registry service, so no one can read or edit this PC's registry over the network, whatever credentials they hold.**

      ## Drawbacks
      - Remote management agents, inventory tools and some backup checks that read the registry from another PC stop working.

      ## Notes
      - Windows already ships this service Disabled, so on most PCs the tweak shows as applied and nothing changes.
      - The app does not stop a running instance; if something had started it, it stops at the next restart.
      - Reverting restores the start type recorded before you applied.

      ## Related
      - **Restrict remote SAM calls to administrators**, **Disable administrative shares** and **Disable WinRM remoting** close other remote channels.

      ## Recommendation
      Apply it on any home or standalone PC. Skip it only if software manages this PC's registry from another computer.

      ## Sources
      - [Remote Registry service defaults in Windows 11 (revertservice)](https://revertservice.com/11/remoteregistry/)
      - [Remote Registry, Windows 11 service (batcmd)](https://batcmd.com/windows/11/services/remoteregistry/)
    risk_level: low
    elevation: admin
    reversible: true
    requires_reboot: true
    effects:
      # One authored option: the shipped start type is Disabled too, so a second "stock" option would
      # be byte-identical. The Default position restores the captured start type from the snapshot.
      - id: remote_registry
        service: { name: RemoteRegistry }
    options:
      - label: "Disabled"
        values: { remote_registry: disabled }

  - id: disable_remote_desktop
    name: "Disable Remote Desktop (RDP)"
    description: "Turn off inbound Remote Desktop connections to shrink the remote-attack surface."
    info: |
      **Turns off incoming Remote Desktop connections, so nothing listens on port 3389 for attackers to target. Connecting from this PC to other machines still works.**

      ## Caveats
      - Allowed actively opens Remote Desktop to incoming connections; it is not a revert. To go back to what you had, pick System Default.
      - On a managed PC, a Group Policy "Allow users to connect remotely" setting overrides this.

      ## Requirements
      - Only Pro, Enterprise and Education can host Remote Desktop; on Home this changes nothing.

      ## Notes
      - Windows ships with remote connections off, so on a clean install this confirms the current state.

      ## Related
      - **Harden RDP (NLA + TLS)** and **Harden the RDP session** are the alternative if you need Remote Desktop: keep it on and harden it.

      ## Recommendation
      Apply it unless you connect into this PC with Remote Desktop. If you do, choose Allowed and apply the two hardening tweaks instead.

      ## Sources
      - [Enable Remote Desktop on your PC](https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/remotepc/remote-desktop-allow-access)
      - [RemoteDesktopServices Policy CSP](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-remotedesktopservices)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: deny_ts
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server', name: fDenyTSConnections, type: REG_DWORD }
    options:
      - label: "Disabled"
        values: { deny_ts: 1 }
      # Polarity note: `fDenyTSConnections = 0` allows connections, so this option opens RDP.
      - label: "Allowed"
        values: { deny_ts: 0 }

  - id: remove_smbv1
    name: "Remove SMBv1 protocol"
    description: "Remove the legacy SMBv1 file-sharing protocol exploited by WannaCry and EternalBlue."
    info: |
      **Removes SMBv1, the obsolete file-sharing protocol behind the WannaCry and EternalBlue attacks. Modern file sharing (SMB 2 and 3) is unaffected.**

      ## Mechanism
      - Disables the `SMB1Protocol` Windows feature, which removes both the SMBv1 client and server.
      - Also sets the server switch `SMB1 = 0`, so the SMBv1 server stays off even if the feature comes back.

      ## Notes
      - Removing or reinstalling the feature can take several minutes and finishes at the next restart.
      - Where the feature is already off (most Windows 11 PCs), applying only sets the server switch and never touches the feature, so reverting cannot install SMBv1.

      ## Related
      - **Require SMB signing**, **Disable SMB insecure guest logons** and **Block NTLM on the SMB client** cause the same kind of old-NAS breakage; apply them together and test old storage once.

      ## Recommendation
      Apply it; SMBv1 has no place on today's networks. Hold off only if you still use hardware that speaks nothing newer, and plan to replace it.

      ## Sources
      - [Detect, enable, and disable SMBv1, SMBv2, and SMBv3](https://learn.microsoft.com/en-us/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3)
      - [SMBv1 is not installed by default](https://learn.microsoft.com/en-us/windows-server/storage/file-server/troubleshoot/smbv1-not-installed-by-default-in-windows)
    risk_level: low
    elevation: admin
    reversible: true
    requires_reboot: true
    warning: "Very old SMB1-only NAS boxes, USB-router shares, and Windows XP or 2003 hosts become unreachable. SMBv1 is not installed by default on Windows 11, nor on Windows 10 except the Home and Pro editions."
    effects:
      - id: smb1_server
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters', name: SMB1, type: REG_DWORD }
      - id: smb1_feature
        action:
          apply: |
            Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart -ErrorAction Stop | Out-Null
          undo: |
            Enable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart -All -ErrorAction Stop | Out-Null
          probe: |
            $s = (Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -ErrorAction Stop).State
            if ($s -in 'Disabled', 'DisablePending', 'DisabledWithPayloadRemoved') { exit 0 } else { exit 1 }
          shell: powershell
          timeout: 900
    options:
      - label: "Removed"
        values: { smb1_server: 0, smb1_feature: run }
      # Omitting the action drives it back to absent, which runs the undo and reinstalls the feature.
      - label: "Installed"
        values: { smb1_server: absent }

  - id: disable_wdigest
    name: "Disable WDigest credential caching"
    description: "Pin UseLogonCredential to 0 so plaintext passwords are never kept in LSASS memory."
    info: |
      **Pins WDigest password caching off, so Windows never keeps a copy of your password in memory that tools like Mimikatz can read as plain text.**

      ## Mechanism
      - Sets `UseLogonCredential = 0`. Caching has been off by default since Windows 8.1; the explicit 0 means an attacker has to visibly change it back first.

      ## Notes
      - Nothing visibly changes on a modern PC. Takes effect at the next sign-in.
      - Not configured deletes the value, which leaves Windows' default in force: caching stays off.

      ## Related
      - **Enable LSA protection** and **Enable Credential Guard** stop credentials being read from memory; this stops the plaintext copy existing.

      ## Recommendation
      Apply it. There is no practical downside.

      ## Sources
      - [Microsoft Security Advisory KB2871997](https://support.microsoft.com/en-us/topic/microsoft-security-advisory-update-to-improve-credentials-protection-and-management-may-13-2014-93434251-04ac-b7f3-52aa-9f951c14b649)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: use_logon_credential
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest', name: UseLogonCredential, type: REG_DWORD }
    options:
      - label: "Disabled"
        values: { use_logon_credential: 0 }
      - label: "Not configured"
        values: { use_logon_credential: absent }

  - id: enable_lsa_protection
    name: "Enable LSA protection (RunAsPPL)"
    description: "Run LSASS as a protected process to block credential-dumping tools like Mimikatz."
    info: |
      **Runs LSASS, the process that holds your sign-in secrets, as a protected process, so tools like Mimikatz cannot read credentials out of its memory.**

      ## Mechanism
      - Sets `RunAsPPL = 2`: protection without the firmware (UEFI) lock that value 1 creates, so it can be undone.
      - Once on, every sign-in plug-in loaded into LSASS must be signed by Microsoft.

      ## Caveats
      - If something earlier set `RunAsPPL = 1` on a Secure Boot PC, the setting also lives in firmware; neither Off nor a revert can clear it (Microsoft's opt-out tool can).
      - Windows turns this on by default on clean, enterprise-joined PCs with memory integrity support; whether Off really turns it off there is unverified.

      ## Notes
      - Microsoft suggests an audit run first: CodeIntegrity events 3065 and 3066 name the plug-ins that would be blocked.

      ## Related
      - **Block LSASS credential theft (ASR rule)** adds no protection once this is on, according to Microsoft.
      - **Enable Credential Guard** and **Disable WDigest credential caching** are complementary layers.

      ## Recommendation
      Strongly worth it unless something you rely on loads unsigned sign-in add-ins. Test smart card, VPN and security software after the reboot.

      ## Sources
      - [Configure added LSA protection](https://learn.microsoft.com/en-us/windows-server/security/credentials-protection-and-management/configuring-additional-lsa-protection)
      - [LocalSecurityAuthority Policy CSP](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-lsa)
    risk_level: medium
    elevation: admin
    reversible: true
    requires_reboot: true
    # Value 2 (no UEFI variable) is only enforced from Windows 11 22H2. Value 1 would write a
    # firmware variable no snapshot revert can clear, so the tweak is gated rather than downgraded.
    windows: { build: ">=22621" }
    warning: "Can block unsigned LSA and authentication plug-ins, including some smart card middleware, VPN credential providers and security agents. Test those first, and enable Secure Boot so the protection resists bypass."
    effects:
      - id: run_as_ppl
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', name: RunAsPPL, type: REG_DWORD }
    options:
      - label: "Enabled"
        values: { run_as_ppl: 2 }
      - label: "Off"
        values: { run_as_ppl: absent }

  - id: enforce_ntlmv2
    name: "Enforce NTLMv2 only"
    description: "Send and accept NTLMv2 only and refuse weak LM and NTLMv1 authentication."
    info: |
      **Makes this PC send only NTLMv2 when signing in to other machines, and refuse the easily cracked LM and NTLMv1 responses when they sign in to it.**

      ## Mechanism
      - Sets the "LAN Manager authentication level" security option to 5, the strictest level Microsoft defines.

      ## Caveats
      - On a domain, Group Policy usually sets this level and overwrites it at the next refresh. Check with whoever runs the domain first: devices that cannot do NTLMv2 lose access to domain resources.
      - Not configured deletes the value ("Not defined"). Microsoft does not document what current Windows then sends or accepts.

      ## Notes
      - Microsoft documents no restart requirement; the app asks for one as a precaution.

      ## Related
      - **Block NTLM on the SMB client** stops SMB offering NTLM at all.
      - **Restrict outgoing NTLM** and **Prevent LM hash storage** complete the legacy sign-in lockdown.

      ## Recommendation
      Apply it on modern networks. Hold off only if you still sign in to old appliances that cannot do NTLMv2.

      ## Sources
      - [Network security: LAN Manager authentication level](https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/network-security-lan-manager-authentication-level)
    risk_level: medium
    elevation: admin
    reversible: true
    requires_reboot: true
    warning: "Very old devices or appliances that only speak LM or NTLMv1 can no longer authenticate to or from this PC."
    effects:
      - id: lm_compat_level
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', name: LmCompatibilityLevel, type: REG_DWORD }
    options:
      - label: "NTLMv2 only"
        values: { lm_compat_level: 5 }
      - label: "Not configured"
        values: { lm_compat_level: absent }

  - id: require_smb_signing
    name: "Require SMB signing"
    description: "Require SMB client and server signing to defeat SMB relay and man-in-the-middle attacks."
    info: |
      **Requires every SMB file-sharing session, in and out, to be cryptographically signed, so an attacker in the middle cannot tamper with or relay it.**

      ## Benefits
      - Defeats SMB relay, one of the most reliable ways attackers move between Windows PCs.
      - Also blocks guest access to shares, since a guest session cannot sign.

      ## Caveats
      - Not configured deletes both values and leaves Windows' own default in force. On Windows 11 24H2 Pro, Enterprise and Education that default still requires signing; Home and Windows 10 require none.

      ## Notes
      - On 24H2 Pro and above this confirms what Windows already does; the real change is on Home and Windows 10.
      - A server that cannot sign fails with an invalid-signature error; Microsoft's advice is to fix or replace it, not to turn signing off.

      ## Related
      - **Disable SMB insecure guest logons**, **Block NTLM on the SMB client** and **Remove SMBv1 protocol** cause the same kind of old-NAS breakage; test old storage once.

      ## Recommendation
      Apply it on modern networks. Skip it only if you depend on network storage that cannot sign, and replace that device when you can.

      ## Sources
      - [Overview of SMB signing](https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-signing-overview)
      - [Control SMB signing behavior](https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-signing)
    risk_level: medium
    elevation: admin
    reversible: true
    requires_reboot: true
    warning: "Old NAS boxes and USB-router shares that cannot sign will fail to connect. Windows 11 24H2 Pro, Enterprise and Education already require signing in both directions."
    effects:
      - id: workstation_signing
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters', name: RequireSecuritySignature, type: REG_DWORD }
      - id: server_signing
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters', name: RequireSecuritySignature, type: REG_DWORD }
    options:
      - label: "Required"
        values: { workstation_signing: 1, server_signing: 1 }
      # Must delete, never write 0: 24H2 Pro/Enterprise/Education require signing by default, so a
      # literal 0 would leave the machine weaker than never applying the tweak.
      - label: "Not configured"
        values: { workstation_signing: absent, server_signing: absent }

  - id: rdp_security_hardening
    name: "Harden RDP (NLA + TLS)"
    description: "Require Network Level Authentication and TLS for RDP to block pre-auth and downgrade attacks."
    info: |
      **Requires Network Level Authentication over TLS for incoming Remote Desktop, so a caller must sign in before Windows creates a session and the encryption cannot be downgraded.**

      ## Mechanism
      - `UserAuthentication = 1` turns on NLA, Microsoft's named mitigation for pre-sign-in bugs like BlueKeep.
      - `SecurityLayer = 2` requires TLS instead of negotiating, which could fall back to older RDP encryption.

      ## Drawbacks
      - Old Remote Desktop clients without NLA support are refused.

      ## Caveats
      - Does nothing while Remote Desktop is off, and on Home, which cannot host it.
      - Group Policy Remote Desktop settings override these values on managed PCs.

      ## Notes
      - Windows already ships with NLA required, so often only the TLS part changes. Reverting restores the recorded values; it never turns NLA off.

      ## Related
      - **Disable Remote Desktop (RDP)** is the alternative if you do not use Remote Desktop at all.
      - **Harden the RDP session** and **Force updated CredSSP clients** add further protection.

      ## Recommendation
      If you use Remote Desktop, apply it. If you do not, use Disable Remote Desktop (RDP) instead.

      ## Sources
      - [SecurityLayer (unattend reference)](https://learn.microsoft.com/en-us/windows-hardware/customize/desktop/unattend/microsoft-windows-terminalservices-rdp-winstationextensions-securitylayer)
      - [UserAuthentication (unattend reference)](https://learn.microsoft.com/en-us/windows-hardware/customize/desktop/unattend/microsoft-windows-terminalservices-rdp-winstationextensions-userauthentication)
      - [Enable Remote Desktop on your PC](https://learn.microsoft.com/en-us/windows-server/remote/remote-desktop-services/remotepc/remote-desktop-allow-access)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      # One authored option: Windows ships NLA required, so an authored "stock" option writing
      # UserAuthentication = 0 would turn NLA off rather than restore it. The Default position
      # restores the captured pre-apply values from the snapshot.
      - id: rdp_nla
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp', name: UserAuthentication, type: REG_DWORD }
      - id: rdp_security_layer
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp', name: SecurityLayer, type: REG_DWORD }
    options:
      - label: "NLA + TLS required"
        values: { rdp_nla: 1, rdp_security_layer: 2 }

  - id: disable_admin_shares
    name: "Disable administrative shares (C$, ADMIN$)"
    description: "Stop auto-creation of the hidden administrative shares to hamper lateral movement."
    info: |
      **Stops Windows recreating the hidden `C$`, `D$` and `ADMIN$` shares that remote tools and attackers with stolen admin passwords use to copy files onto a PC.**

      ## Mechanism
      - Sets `AutoShareWks = 0`, so the Server service skips creating the shares when it starts. `IPC$` and shares you created are untouched.

      ## Caveats
      - Unverified on Windows 11 24H2: the registry value may no longer be honoured there. After the reboot, run `net share` to confirm the shares are gone.
      - Microsoft advises against removing these shares because it can break many things.

      ## Related
      - **Filter the remote local-admin token** already blocks most use of these shares by local accounts.
      - **Restrict remote SAM calls to administrators** is another lateral-movement control.

      ## Recommendation
      Fine on a standalone personal PC that never uses these shares. Avoid it if you rely on remote admin tools, network backup agents or PsExec-style management.

      ## Sources
      - [Remove administrative shares](https://learn.microsoft.com/en-us/troubleshoot/windows-server/networking/remove-administrative-shares)
    risk_level: medium
    elevation: admin
    reversible: true
    requires_reboot: true
    warning: "Breaks remote admin tools, some backup software, and PsExec or remote-WMI workflows that rely on C$ and ADMIN$. An administrator can recreate the shares, so this is friction rather than a boundary."
    effects:
      - id: auto_share_wks
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters', name: AutoShareWks, type: REG_DWORD }
    options:
      - label: "Disabled"
        values: { auto_share_wks: 0 }
      - label: "Enabled"
        values: { auto_share_wks: absent }

  - id: disable_lmhash_storage
    name: "Prevent LM hash storage"
    description: "Set NoLMHash so weak LAN Manager password hashes are never stored on disk."
    info: |
      **Stops Windows storing the ancient LM hash of your password, a format that cracks almost instantly, on disk.**

      ## Notes
      - Already Windows' default since Vista, so nothing visibly changes; this pins the safe value so a misconfiguration cannot quietly bring LM hashes back.
      - Applies from each account's next password change. An LM hash already stored stays until that password changes.

      ## Related
      - **Enforce NTLMv2 only** stops LM responses going over the network; this stops the hash being stored.

      ## Recommendation
      Apply it; it costs nothing on current Windows. If you suspect an old LM hash is stored, change the password afterwards.

      ## Sources
      - [Do not store LAN Manager hash value on next password change](https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/network-security-do-not-store-lan-manager-hash-value-on-next-password-change)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      # One authored option: Microsoft's client effective default is Enabled (1), the same value this
      # writes, and a 0 option would be a security downgrade. Default reverts from the snapshot.
      - id: no_lm_hash
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', name: NoLMHash, type: REG_DWORD }
    options:
      - label: "Prevented"
        values: { no_lm_hash: 1 }

  - id: restrict_anonymous_enum
    name: "Restrict anonymous enumeration"
    description: "Block anonymous listing of SAM accounts and shares to blunt reconnaissance."
    info: |
      **Stops anonymous network callers listing this PC's shared folders, on top of the account list Windows already hides from them.**

      ## Mechanism
      - Sets `RestrictAnonymous = 1`, the only one of the three values that differs from Windows' defaults.
      - Uses 1, not the legacy value 2, which is known to break networking and domain trusts.

      ## Caveats
      - On a domain or Intune-managed PC, a policy refresh resets the value, and the tweak then shows System Default.

      ## Notes
      - Standard restrictions writes back Windows' own shipped values exactly.
      - Microsoft documents no restart requirement; the app asks for one as a precaution.

      ## Related
      - **Restrict remote SAM calls to administrators** covers signed-in callers; this one covers anonymous ones.

      ## Recommendation
      Apply it on standalone and home networks. Be careful in older domain environments that rely on anonymous access.

      ## Sources
      - [Do not allow anonymous enumeration of SAM accounts and shares](https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/network-access-do-not-allow-anonymous-enumeration-of-sam-accounts-and-shares)
      - [Do not allow anonymous enumeration of SAM accounts](https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/network-access-do-not-allow-anonymous-enumeration-of-sam-accounts)
      - [Let Everyone permissions apply to anonymous users](https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/network-access-let-everyone-permissions-apply-to-anonymous-users)
    risk_level: medium
    elevation: admin
    reversible: true
    requires_reboot: true
    warning: "Some old cross-domain or appliance scenarios that rely on anonymous access may break."
    effects:
      - id: restrict_anonymous_sam
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', name: RestrictAnonymousSAM, type: REG_DWORD }
      - id: restrict_anonymous
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', name: RestrictAnonymous, type: REG_DWORD }
      - id: everyone_includes_anonymous
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', name: EveryoneIncludesAnonymous, type: REG_DWORD }
    options:
      - label: "Restricted"
        values: { restrict_anonymous_sam: 1, restrict_anonymous: 1, everyone_includes_anonymous: 0 }
      # Literals, not absent: all three ship seeded from defltbase.inf as 1 / 0 / 0.
      - label: "Standard restrictions"
        values: { restrict_anonymous_sam: 1, restrict_anonymous: 0, everyone_includes_anonymous: 0 }

  - id: reduce_credential_caching
    name: "Reduce cached domain logons"
    description: "Lower the cached logon count to limit offline credential-cracking exposure."
    info: |
      **Lowers how many domain sign-ins Windows caches for offline use from 10 to 4, so a stolen PC holds fewer password hashes an attacker could crack.**

      ## Mechanism
      - Each cached sign-in is a hash that can be cracked offline if the attacker copies the registry; the count caps how many users' hashes are kept.
      - Written as text (REG_SZ), the type Windows reads; a number-type value would be silently ignored.

      ## Notes
      - Cache 10 logons writes Windows' own default. Microsoft suggests 2 for end-user PCs.

      ## Related
      - **Enable Credential Guard** protects domain secrets in memory; this limits the cached copies on disk.

      ## Recommendation
      Useful on domain-joined or Entra-joined laptops, especially shared ones. On a home PC it changes nothing, so skip it.

      ## Sources
      - [Number of previous logons to cache](https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/interactive-logon-number-of-previous-logons-to-cache-in-case-domain-controller-is-not-available)
      - [Cached domain logon information](https://github.com/MicrosoftDocs/SupportArticles-docs/blob/main/support/windows-server/user-profiles-and-logon/cached-domain-logon-information.md)
    risk_level: medium
    elevation: admin
    reversible: true
    warning: "Setting this too low can lock out offline domain laptops when no domain controller is reachable. Irrelevant to non-domain home PCs."
    effects:
      - id: cached_logons_count
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon', name: CachedLogonsCount, type: REG_SZ }
    options:
      - label: "Limit to 4"
        values: { cached_logons_count: "4" }
      - label: "Cache 10 logons"
        values: { cached_logons_count: "10" }

  - id: block_vulnerable_drivers
    name: "Enable the Microsoft vulnerable-driver blocklist"
    description: "Turn on the Microsoft vulnerable-driver blocklist to stop bring-your-own-vulnerable-driver attacks."
    info: |
      **Makes Windows refuse to load kernel drivers on Microsoft's list of known-vulnerable drivers, which attackers bring along to switch off security software.**

      ## Caveats
      - Microsoft documents the feature but not this registry value; it rests on community sources, so a future build could stop honouring it.
      - A blocked legitimate driver can make a device or tool malfunction, and in rare cases cause a blue screen.
      - While memory integrity, Smart App Control or S mode is on, the blocklist is forced on and this value has no say.

      ## Notes
      - On by default since Windows 11 22H2, so this usually pins the current state.
      - Not configured deletes the value and hands control back to the Windows Security toggle (Device security > Core isolation), which is on by default.

      ## Related
      - **Disable VBS and Memory Integrity (HVCI)** (Performance): once memory integrity is off, this value is what keeps the blocklist on. The two combine well.

      ## Recommendation
      Apply it. If a device stops working after the reboot, check whether its driver is on the list before reverting.

      ## Sources
      - [Microsoft recommended driver block rules](https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/design/microsoft-recommended-driver-block-rules)
      - [Enable or disable the vulnerable driver blocklist (Eleven Forum)](https://www.elevenforum.com/t/enable-or-disable-microsoft-vulnerable-driver-blocklist-in-windows-11.10031/)
    risk_level: low
    elevation: admin
    reversible: true
    requires_reboot: true
    effects:
      - id: vuln_driver_blocklist
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\CI\Config', name: VulnerableDriverBlocklistEnable, type: REG_DWORD }
    options:
      - label: "Enabled"
        values: { vuln_driver_blocklist: 1 }
      - label: "Not configured"
        values: { vuln_driver_blocklist: absent }

  - id: disable_wpbt
    name: "Disable WPBT vendor binary execution"
    description: "Block firmware-provided WPBT binaries from auto-running to stop OEM and rootkit persistence."
    info: |
      **Stops Windows running the program a PC's firmware can hand it at every boot (WPBT), which some manufacturers use to reinstall their software even after a clean install.**

      ## Mechanism
      - Sets `DisableWpbtExecution = 1`, read by the boot component that extracts and runs the firmware's `wpbbin.exe`.

      ## Caveats
      - Not documented by Microsoft. The value name is confirmed inside Windows' own boot component and used by community tools, but that it actually stops `wpbbin.exe` is untested.
      - Software a firmware binary already installed stays installed.

      ## Notes
      - Does nothing on most self-built desktops, whose firmware publishes no WPBT table.

      ## Recommendation
      Good for a clean, self-managed install where you do not want manufacturer software coming back. Skip it if you rely on a vendor anti-theft agent or a firmware-delivered driver.

      ## Sources
      - [Everyone Gets a Rootkit (Eclypsium)](https://eclypsium.com/blog/everyone-gets-a-rootkit/)
      - [dropWPBT](https://github.com/Jamesits/dropWPBT)
      - [Windows Platform Binary Table (persistence-info)](https://persistence-info.github.io/Data/wpbbin.html)
    risk_level: medium
    elevation: admin
    reversible: true
    requires_reboot: true
    warning: "Some OEMs use WPBT for legitimate driver or anti-theft delivery; disabling it can stop those from reinstalling after a wipe."
    effects:
      - id: disable_wpbt_execution
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager', name: DisableWpbtExecution, type: REG_DWORD }
    options:
      - label: "Disabled"
        values: { disable_wpbt_execution: 1 }
      - label: "Enabled"
        values: { disable_wpbt_execution: absent }

  - id: require_ctrlaltdel
    name: "Require Ctrl+Alt+Del at sign-in"
    description: "Force the secure attention sequence to defeat credential-harvesting fake login screens."
    info: |
      **Makes you press Ctrl+Alt+Del before signing in. Only Windows itself can catch that key combination, so a fake sign-in screen cannot collect your password.**

      ## Mechanism
      - Writes `DisableCAD = 0` in both places Windows reads it; the Winlogon copy is the one that actually hides the prompt on Windows 11 24H2.

      ## Drawbacks
      - One extra key press at every sign-in and unlock.
      - Awkward on touch-only tablets and keyboard-less kiosks.

      ## Caveats
      - On a domain or MDM-managed PC, a security policy refresh can overwrite the setting.

      ## Notes
      - Takes effect at the next sign-in or lock.

      ## Related
      - **Hide last signed-in username** also hardens the sign-in screen.

      ## Recommendation
      Worth it on desktops and laptops. Skip it on touch-only devices.

      ## Sources
      - [Interactive logon: Do not require CTRL+ALT+DEL](https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/interactive-logon-do-not-require-ctrl-alt-del)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: policy_disable_cad
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', name: DisableCAD, type: REG_DWORD }
      # The Winlogon copy is the store authui.dll actually reads to skip the secure attention screen.
      - id: winlogon_disable_cad
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon', name: DisableCAD, type: REG_DWORD }
    options:
      - label: "Required"
        values: { policy_disable_cad: 0, winlogon_disable_cad: 0 }
      - label: "Not required"
        values: { policy_disable_cad: absent, winlogon_disable_cad: 1 }

  - id: disable_autorun
    name: "Disable AutoRun/AutoPlay on all drives"
    description: "Block automatic execution from USB and optical media to stop autorun-worm infection."
    info: |
      **Stops Windows automatically running, or offering to run, anything from USB drives, discs and other drives when you connect them.**

      ## Mechanism
      - `NoDriveTypeAutoRun = 255` turns off AutoPlay for every drive type, and `NoAutorun = 1` makes Windows ignore `autorun.inf` commands.

      ## Drawbacks
      - Camera-import and disc prompts no longer appear; you open drives in File Explorer yourself.

      ## Notes
      - Running `autorun.inf` from USB drives has been off by default since Windows 7, so the main gain is removing AutoPlay prompts you could misclick.
      - Takes effect after sign-out or an Explorer restart.

      ## Related
      - **Disallow AutoPlay for non-volume devices** covers phones and cameras, which this misses. Apply both.

      ## Recommendation
      Apply it, together with the non-volume tweak.

      ## Sources
      - [Autoplay Policy CSP](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-autoplay)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: no_drive_type_autorun
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer', name: NoDriveTypeAutoRun, type: REG_DWORD }
      - id: no_autorun
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer', name: NoAutorun, type: REG_DWORD }
    options:
      - label: "Disabled"
        values: { no_drive_type_autorun: 255, no_autorun: 1 }
      - label: "Enabled"
        values: { no_drive_type_autorun: absent, no_autorun: absent }

  - id: powershell_scriptblock_logging
    name: "Enable PowerShell script-block logging"
    description: "Log deobfuscated PowerShell to the event log for malware forensics and detection."
    info: |
      **Records the decoded text of every PowerShell script that runs, in both Windows PowerShell 5.1 and PowerShell 7, so malicious PowerShell leaves readable evidence.**

      ## Mechanism
      - Logs event 4104 after PowerShell decodes the code, so Base64 and other obfuscation is stripped.
      - Writes both policy keys, since Windows PowerShell and PowerShell 7 each read their own. The PowerShell 7 key is harmless if PowerShell 7 is not installed.

      ## Caveats
      - An attacker who can start the old PowerShell 2.0 engine bypasses this log.

      ## Notes
      - Applies to new PowerShell sessions; sessions already open keep the old setting.
      - PowerShell 7 writes its events to its own log channel.
      - Protected Event Logging, which would encrypt the logged content, is not configured.

      ## Related
      - **Remove PowerShell 2.0 engine** closes the bypass.
      - **PowerShell module logging and transcription** adds more detail.

      ## Recommendation
      Enable it if you care about detecting or investigating attacks; it costs nothing measurable.

      ## Sources
      - [About Logging (Windows PowerShell 5.1)](https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging?view=powershell-5.1)
      - [About Logging Windows (PowerShell 7)](https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging_windows)
    risk_level: low
    elevation: admin
    reversible: true
    warning: "Generates event-log volume, and scripts that embed secrets in plaintext may write them to Event Viewer, so protect the PowerShell operational log."
    effects:
      - id: enable_scriptblock_logging
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging', name: EnableScriptBlockLogging, type: REG_DWORD }
      # PowerShell 7 (pwsh.exe) reads its own PowerShellCore policy key.
      - id: enable_pwsh7_scriptblock_logging
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\PowerShellCore\ScriptBlockLogging', name: EnableScriptBlockLogging, type: REG_DWORD }
    options:
      - label: "Enabled"
        values: { enable_scriptblock_logging: 1, enable_pwsh7_scriptblock_logging: 1 }
      - label: "Off"
        values: { enable_scriptblock_logging: absent, enable_pwsh7_scriptblock_logging: absent }

  - id: uac_max
    name: "Raise UAC to always notify"
    description: "Set UAC to always prompt on the secure desktop for the strongest elevation control."
    info: |
      **Makes every elevation ask for confirmation on the dimmed secure desktop, including Windows' own tools that normally elevate silently.**

      ## Mechanism
      - Sets the admin prompt to "consent on the secure desktop" (2). Windows' default (5) lets auto-elevating Windows programs skip the prompt, which many UAC bypasses abuse.
      - Also writes `EnableLUA = 1`, which turns UAC back on if another tool switched it off; that is the part needing the restart.

      ## Drawbacks
      - Task Manager, Registry Editor and other built-in tools now prompt every time.

      ## Caveats
      - With Administrator Protection turned on (Windows 11 24H2 and newer), a different setting governs elevation prompts and this one no longer decides.
      - A domain or Intune security baseline re-applies its own values at the next refresh.
      - Notify on app changes writes Windows' default. On a PC already hardened to CIS or STIG, pick System Default instead to keep the stricter setting.

      ## Related
      - **Apply UAC to built-in Administrator** needs this tweak; apply both.

      ## Recommendation
      Recommended if you can live with a few extra prompts. If they are too much, stay at Notify on app changes rather than lowering UAC.

      ## Sources
      - [Behavior of the elevation prompt for administrators](https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/user-account-control-behavior-of-the-elevation-prompt-for-administrators-in-admin-approval-mode)
      - [Run all administrators in Admin Approval Mode](https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/security-policy-settings/user-account-control-run-all-administrators-in-admin-approval-mode)
    risk_level: low
    elevation: admin
    reversible: true
    # Both options write EnableLUA, which Microsoft documents as needing a restart.
    requires_reboot: true
    effects:
      - id: consent_prompt_admin
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', name: ConsentPromptBehaviorAdmin, type: REG_DWORD }
      - id: prompt_secure_desktop
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', name: PromptOnSecureDesktop, type: REG_DWORD }
      - id: enable_lua
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', name: EnableLUA, type: REG_DWORD }
    options:
      - label: "Always notify"
        values: { consent_prompt_admin: 2, prompt_secure_desktop: 1, enable_lua: 1 }
      - label: "Notify on app changes"
        values: { consent_prompt_admin: 5, prompt_secure_desktop: 1, enable_lua: 1 }

  - id: filter_admin_token
    name: "Apply UAC to built-in Administrator"
    description: "Enable Admin Approval Mode for the built-in Administrator so even it receives UAC prompts."
    info: |
      **Makes the built-in Administrator account go through UAC like every other admin, instead of running every program with full rights and no prompt.**

      ## Drawbacks
      - Scripts or scheduled jobs that run as the built-in Administrator and cannot answer a prompt stop working.

      ## Notes
      - The built-in Administrator is disabled by default, so on most PCs nothing changes. It matters where the account was enabled: OEM and deployment images, recovery setups, PCs upgraded from old Windows.
      - Takes effect the next time that account signs in.

      ## Related
      - **Raise UAC to always notify** must be applied alongside.
      - **Filter the remote local-admin token** has a similar name but covers network sign-ins by local admins.

      ## Recommendation
      Apply it as defence in depth, together with Raise UAC to always notify. Skip it if the built-in Administrator runs unattended jobs.

      ## Sources
      - [Admin Approval Mode for the Built-in Administrator account](https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/user-account-control-admin-approval-mode-for-the-built-in-administrator-account)
    risk_level: low
    elevation: admin
    reversible: true
    warning: "Microsoft requires ConsentPromptBehaviorAdmin = 2 alongside this setting. Apply the \"Raise UAC to always notify\" tweak as well, or the built-in Administrator can end up unable to elevate at all."
    effects:
      - id: filter_admin_token
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', name: FilterAdministratorToken, type: REG_DWORD }
    options:
      - label: "Applied"
        values: { filter_admin_token: 1 }
      - label: "Not applied"
        values: { filter_admin_token: absent }

  - id: hide_last_user
    name: "Hide last signed-in username"
    description: "Stop the sign-in screen from displaying the last username to limit account disclosure."
    info: |
      **Leaves the sign-in screen's username blank instead of showing who signed in last, so onlookers learn no account names.**

      ## Drawbacks
      - You type your username at every sign-in; on Microsoft-account and Entra PCs that is your full email address.

      ## Notes
      - Takes effect the next time the sign-in screen appears.
      - Your name still shows on the lock screen when unlocking; that is a separate setting.
      - Shown writes back 0, the value Windows setup puts there.

      ## Related
      - **Hide admin accounts on the UAC prompt** stops elevation prompts listing admin accounts.

      ## Recommendation
      Worth it on shared or publicly visible PCs. On a private single-user PC the extra typing outweighs the gain.

      ## Sources
      - [Interactive logon: Don't display last signed-in](https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/interactive-logon-do-not-display-last-user-name)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: dont_display_last_user
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', name: DontDisplayLastUserName, type: REG_DWORD }
    options:
      - label: "Hidden"
        values: { dont_display_last_user: 1 }
      # Windows setup seeds this value as 0, so the revert writes 0 rather than deleting it.
      - label: "Shown"
        values: { dont_display_last_user: 0 }

  - id: printnightmare_point_and_print
    name: "Restrict printer-driver install to admins"
    description: "Require admin rights to install print drivers, closing the PrintNightmare (CVE-2021-34527) path."
    info: |
      **Lets only administrators install printer drivers. This is Microsoft's fix for PrintNightmare (CVE-2021-34527), where a standard user gets a malicious driver loaded with full system rights.**

      ## Notes
      - Since the August 2021 updates, a missing value already means admins only, so on a patched PC this pins the default rather than changing behaviour.
      - Not configured deletes the value, which leaves that patched default in force: installs stay restricted to admins. Only an explicit 0 loosens it, and this tweak never writes 0.

      ## Related
      - **Turn off the spooler's remote RPC endpoint** keeps local printing but stops remote connections to the spooler.
      - **Disable Print Spooler (Spooler)** (Services) removes the attack surface along with all printing.

      ## Recommendation
      Apply it on every PC; it costs nothing on a patched system.

      ## Sources
      - [KB5005010: Restricting installation of new printer drivers](https://support.microsoft.com/en-us/topic/kb5005010-restricting-installation-of-new-printer-drivers-after-applying-the-july-6-2021-updates-31b91c02-05bc-4ada-a7ea-183b129578a7)
    risk_level: medium
    elevation: admin
    reversible: true
    warning: "Standard users can no longer add printers that need a new driver; an administrator must install it."
    effects:
      - id: restrict_driver_install
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers\PointAndPrint', name: RestrictDriverInstallationToAdministrators, type: REG_DWORD }
    options:
      - label: "Admins only"
        values: { restrict_driver_install: 1 }
      - label: "Not configured"
        values: { restrict_driver_install: absent }

  - id: disable_remote_assistance
    name: "Disable Remote Assistance"
    description: "Turn off inbound Remote Assistance invitations to reduce remote-help attack surface."
    info: |
      **Turns off classic Remote Assistance invitations, so nobody can be invited to view or control this desktop, a favourite tool of tech-support scams.**

      ## Caveats
      - Unsolicited "Offer Remote Assistance" sessions are governed by a separate policy this does not set.
      - A Group Policy Remote Assistance setting overrides this on managed PCs.

      ## Notes
      - Microsoft documents invitations as off by default, so this often confirms the current state.
      - Not configured deletes the value, which leaves Windows' default in force (invitations off). To allow them, tick the box in System Properties > Remote.
      - Quick Assist is a separate app and keeps working.

      ## Related
      - **Disable Remote Desktop (RDP)** closes the other built-in remote-control channel.

      ## Recommendation
      Apply it unless you rely on invitation-based Remote Assistance; use Quick Assist for remote help.

      ## Sources
      - [Remote Assistance fAllowToGetHelp (unattend reference)](https://learn.microsoft.com/en-us/windows-hardware/customize/desktop/unattend/microsoft-windows-remoteassistance-exe-fallowtogethelp)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: allow_get_help
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Remote Assistance', name: fAllowToGetHelp, type: REG_DWORD }
    options:
      - label: "Disabled"
        values: { allow_get_help: 0 }
      # Must delete, never write 1: Microsoft documents the shipped default as "cannot request
      # assistance", so a literal 1 would open a channel that was closed.
      - label: "Not configured"
        values: { allow_get_help: absent }

  - id: disable_windows_script_host
    name: "Disable Windows Script Host"
    description: "Block .vbs, .js and .wsf execution to shut down a common script-malware vector."
    info: |
      **Blocks Windows Script Host, so `.vbs`, `.js`, `.wsf` and similar script files no longer run when opened, closing a common malware delivery route.**

      ## Mechanism
      - Sets `Enabled = 0` in both the 64-bit and 32-bit registry views, so the 32-bit script host cannot be used as a bypass.
      - JavaScript in browsers, Node.js and PowerShell are unaffected.

      ## Caveats
      - A user can re-enable scripts for their own account through a per-user setting, which this does not lock.
      - A failing installer may give no hint that blocked scripts are the cause; check this tweak first.

      ## Related
      - **ASR rules: block Office/script malware vectors** blocks malicious scripts through Defender instead.

      ## Recommendation
      High value on home and office PCs that never run legitimate scripts. Avoid it if logon scripts or software deployment use VBScript or JScript.

      ## Sources
      - [Registry Redirector](https://learn.microsoft.com/en-us/windows/win32/winprog64/registry-redirector)
    risk_level: medium
    elevation: admin
    reversible: true
    warning: "Breaks legitimate .vbs and .js scripts, some installers, and logon scripts. Test first if you rely on scripting."
    effects:
      - id: wsh_enabled
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows Script Host\Settings', name: Enabled, type: REG_DWORD }
      # The WOW64 view is a physically separate key; 32-bit SysWOW64\wscript.exe reads only this one.
      - id: wsh_enabled_wow64
        registry: { key: 'HKLM\SOFTWARE\Wow6432Node\Microsoft\Windows Script Host\Settings', name: Enabled, type: REG_DWORD }
    options:
      - label: "Disabled"
        values: { wsh_enabled: 0, wsh_enabled_wow64: 0 }
      - label: "Enabled"
        values: { wsh_enabled: absent, wsh_enabled_wow64: absent }

  - id: enable_controlled_folder_access
    name: "Controlled Folder Access (ransomware shield)"
    description: "Turn on Defender Controlled Folder Access to block unauthorized apps writing to protected folders."
    info: |
      **Blocks unrecognised apps from changing files in Documents, Pictures, Desktop and your other protected folders: Windows' built-in ransomware shield.**

      ## Mechanism
      - Defender checks every change to a file in a protected folder against its list of trusted apps; untrusted apps are refused and you get a notification.
      - Audit only logs what would have been blocked, without blocking anything.

      ## Caveats
      - The app confirms the policy was set, not that the feature engaged; `Get-MpPreference` shows the effective setting.
      - On Intune or Configuration Manager PCs, their policies overwrite this.

      ## Requirements
      - Microsoft Defender must be the active antivirus; with a third-party antivirus this does nothing.

      ## Notes
      - Allow a blocked app, or add folders, in Windows Security > Virus & threat protection > Ransomware protection.

      ## Related
      - **Enforce SmartScreen (apps and Edge)** and **Enable PUA/PUP protection** together with this make a noticeably stricter PC.

      ## Recommendation
      Worth it if you want ransomware protection and are willing to allow apps when something is blocked. Start with Audit only for a week, check what it caught, then switch to Block.

      ## Sources
      - [Configure controlled folder access](https://learn.microsoft.com/en-us/defender-endpoint/controlled-folder-access-configure)
      - [Protect security settings with tamper protection](https://learn.microsoft.com/en-us/defender-endpoint/prevent-changes-to-security-settings-with-tamper-protection)
    risk_level: medium
    elevation: admin
    reversible: true
    warning: "Produces false positives: legitimate games, editors and backup tools may be blocked from writing to Documents or Pictures until you allow-list them."
    effects:
      - id: cfa_enable
        registry:
          { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Controlled Folder Access', name: EnableControlledFolderAccess, type: REG_DWORD }
    options:
      - label: "Block"
        values: { cfa_enable: 1 }
      - label: "Audit only"
        values: { cfa_enable: 2 }
      - label: "Off"
        values: { cfa_enable: absent }

  - id: enable_network_protection
    name: "Defender Network Protection"
    description: "Block outbound connections to malicious domains and IPs at OS level via Defender Network Protection."
    info: |
      **Blocks connections from any app on this PC, not just the browser, to sites and IP addresses Microsoft knows are malicious: phishing, malware hosting and attacker command servers.**

      ## Mechanism
      - Checks each outgoing destination against Microsoft's SmartScreen reputation service. Audit only logs matches instead of blocking them.

      ## Drawbacks
      - Destinations are looked up with Microsoft's cloud service.
      - Niche or newly registered sites are occasionally blocked.

      ## Caveats
      - Turning off Defender's cloud-delivered protection, a common privacy tweak, silently switches this off too.

      ## Related
      - **Defender cloud protection and MAPS** turns on the cloud protection this needs.
      - **Enforce SmartScreen (apps and Edge)** uses the same reputation service for downloads and Edge.

      ## Recommendation
      Recommended when Defender is your active antivirus on Pro or better. Skip it on Home, with a third-party antivirus, or with cloud protection off: it does nothing there.

      ## Sources
      - [Use network protection](https://learn.microsoft.com/en-us/defender-endpoint/network-protection)
      - [Turn on network protection](https://learn.microsoft.com/en-us/defender-endpoint/enable-network-protection)
    risk_level: low
    elevation: admin
    reversible: true
    warning: "Supported on Pro, Enterprise and Education only, and requires Defender in active mode with real-time protection, behavior monitoring and cloud-delivered protection all on. Anywhere else the write succeeds and nothing happens."
    effects:
      - id: network_protection
        registry:
          { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\Network Protection', name: EnableNetworkProtection, type: REG_DWORD }
    options:
      - label: "Block"
        values: { network_protection: 1 }
      - label: "Audit only"
        values: { network_protection: 2 }
      - label: "Off"
        values: { network_protection: absent }

  - id: enable_pua_protection
    name: "Enable PUA/PUP protection"
    description: "Turn on Defender potentially-unwanted-app blocking to stop bundleware and adware."
    info: |
      **Makes Defender block and quarantine potentially unwanted apps (bundleware, adware, bundled crypto miners) instead of only logging them.**

      ## Drawbacks
      - Some system utilities and "optimizer" tools count as unwanted and get quarantined, and a tool that works today can be caught after a signature update. You may need exclusions.

      ## Caveats
      - Microsoft does not document this registry value by name. Check that `PUAProtection` reads 1 in `Get-MpPreference` after applying.
      - Needs Defender as the active antivirus.

      ## Notes
      - Current Defender already audits these apps by default, so this switches logging to blocking.
      - Not configured deletes the value, which leaves Defender's own default in force: audit (log only), not off.
      - Edge has its own, separate blocking of unwanted downloads.

      ## Recommendation
      Enable it for most people. If you run niche utilities Defender dislikes, be ready to add exclusions.

      ## Sources
      - [Block potentially unwanted applications](https://learn.microsoft.com/en-us/defender-endpoint/detect-block-potentially-unwanted-apps-microsoft-defender-antivirus)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: pua_protection
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender', name: PUAProtection, type: REG_DWORD }
    options:
      - label: "Block"
        values: { pua_protection: 1 }
      - label: "Not configured"
        values: { pua_protection: absent }

  - id: asr_block_lsass_theft
    name: "Block LSASS credential theft (ASR rule)"
    description: "Enable the Defender ASR rule that blocks credential theft from LSASS (Mimikatz-class)."
    info: |
      **Turns on the Defender attack surface reduction (ASR) rule that stops Mimikatz-style tools reading passwords out of LSASS memory.**

      ## Mechanism
      - Sets this rule to Block and switches on the parent "Configure ASR rules" policy, which the four ASR tweaks share.
      - It blocks memory reads of LSASS, not programs running, so blocked entries for system processes in the log are usually harmless.

      ## Drawbacks
      - Defender's normal file and folder exclusions do not apply to this rule; only ASR exclusions do.
      - It logs many harmless blocks.

      ## Requirements
      - Enforcement on Windows Home is unconfirmed.

      ## Notes
      - Off deletes the rule. The shared parent policy stays on while another ASR tweak uses it, and returns to its original state only when the last one is turned off.

      ## Related
      - **ASR standard protection rules** holds Microsoft's other two rules that are safe to block straight away.

      ## Recommendation
      A good extra layer on Defender PCs where LSA protection is not on. Microsoft rates this rule safe to block without an audit period.

      ## Sources
      - [ASR rules overview](https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-overview)
      - [ASR rules reference](https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference)
    risk_level: medium
    elevation: admin
    reversible: true
    warning: "Can block legitimate IT or security tools that read LSASS, and needs Defender real-time protection. Redundant if LSA protection or Credential Guard is already on."
    effects:
      # Value name ends e4b2. The e4b0 form seen in older material maps to no rule at all, and
      # Defender ignores an unrecognised GUID silently.
      - id: asr_lsass
        registry:
          { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules', name: 9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2, type: REG_SZ }
      - id: asr_policy
        shared: defender_asr_policy_enabled
    options:
      - label: "Block"
        values: { asr_lsass: "1", asr_policy: claim }
      - label: "Off"
        values: { asr_lsass: absent, asr_policy: unclaimed }

  - id: asr_block_office_script_vectors
    name: "ASR rules: block Office/script malware vectors"
    description: "Enable Defender ASR rules blocking macro child-processes, obfuscated scripts, and email executables."
    info: |
      **Turns on four Defender ASR rules against the tricks behind most phishing attacks: Office macros starting programs or dropping executables, disguised scripts, and executables opened from email.**

      ## Mechanism
      - Office: Word, Excel, PowerPoint and the other Office apps cannot start other programs or write executable files.
      - Scripts: PowerShell, JavaScript or VBScript whose content looks deliberately disguised is stopped.
      - Email: executables and scripts arriving through Outlook or webmail, including inside `.zip` files, cannot be launched.

      ## Caveats
      - The two Office rules only cover Office installed under Program Files; portable installs are not protected.
      - The executable-content rule ignores Defender's normal file and folder exclusions.

      ## Requirements
      - Enforcement on Windows Home is unconfirmed.

      ## Notes
      - Microsoft advises Audit only first; audit events go to the Defender operational event log.
      - Off deletes the four rules. The shared parent ASR policy stays on while another ASR tweak uses it, and returns to its original state only when the last one is turned off.

      ## Related
      - **Defender cloud protection and MAPS** provides the cloud protection the script rule needs.
      - **Disable Windows Script Host** removes the script host entirely.

      ## Recommendation
      High value on home and office PCs. If your work depends on Office macros or scripts, run Audit only first, review the events, then switch to Block.

      ## Sources
      - [ASR rules overview](https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-overview)
      - [ASR rules reference](https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference)
      - [Enable attack surface reduction rules](https://learn.microsoft.com/en-us/defender-endpoint/enable-attack-surface-reduction)
    risk_level: medium
    elevation: admin
    reversible: true
    warning: "Can block legitimate macro-heavy business documents and admin scripts. All four rules need Defender real-time protection, and the obfuscated-scripts rule also needs cloud-delivered protection and AMSI, so it is silently inert if cloud protection is off."
    effects:
      - id: asr_office_child
        registry:
          { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules', name: d4f940ab-401b-4efc-aadc-ad5f3c50688a, type: REG_SZ }
      - id: asr_office_exe_content
        registry:
          { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules', name: 3b576869-a4ec-4529-8536-b80a7769e899, type: REG_SZ }
      - id: asr_obfuscated_scripts
        registry:
          { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules', name: 5beb7efe-fd9a-4556-801d-275e5ffc04cc, type: REG_SZ }
      - id: asr_email_exe
        registry:
          { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules', name: be9ba2d9-53ea-4cdc-84e5-9b1eeee46550, type: REG_SZ }
      - id: asr_policy
        shared: defender_asr_policy_enabled
    options:
      - label: "Block"
        values:
          asr_office_child: "1"
          asr_office_exe_content: "1"
          asr_obfuscated_scripts: "1"
          asr_email_exe: "1"
          asr_policy: claim
      - label: "Audit only"
        values:
          asr_office_child: "2"
          asr_office_exe_content: "2"
          asr_obfuscated_scripts: "2"
          asr_email_exe: "2"
          asr_policy: claim
      - label: "Off"
        values:
          asr_office_child: absent
          asr_office_exe_content: absent
          asr_obfuscated_scripts: absent
          asr_email_exe: absent
          asr_policy: unclaimed

  - id: enforce_smartscreen
    name: "Enforce SmartScreen (apps and Edge)"
    description: "Set SmartScreen to block, not just warn, for downloaded apps and Edge browsing."
    info: |
      **Forces SmartScreen on for downloaded apps and in Edge, and replaces the "Run anyway" button on Windows' warning with a hard block.**

      ## Mechanism
      - Windows: SmartScreen is set to Block instead of Warn, so an unrecognised download cannot be run past the "Windows protected your PC" dialog.
      - Edge: SmartScreen is forced on, but you can still click past Edge's own warnings; separate Edge policies control that.

      ## Drawbacks
      - In-house tools, niche utilities, new releases and self-built programs have no reputation, and are blocked with no way past it for the user. An administrator has to lift the policy.

      ## Requirements
      - Microsoft documents the Windows part for Pro and above; the Edge part needs Microsoft Edge.

      ## Notes
      - User's choice deletes the three values: SmartScreen stays on in Warn mode, under your control.

      ## Related
      - **Defender Network Protection** extends the same reputation checks to every app.
      - **Enhanced Phishing Protection** covers SmartScreen's password warnings.

      ## Recommendation
      Recommended for most people. Skip it if you often run unsigned or rare software.

      ## Sources
      - [SmartScreen Policy CSP](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-smartscreen)
      - [Microsoft Edge policy: SmartScreenEnabled](https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies#smartscreenenabled)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: enable_smartscreen
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System', name: EnableSmartScreen, type: REG_DWORD }
      - id: smartscreen_level
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System', name: ShellSmartScreenLevel, type: REG_SZ }
      - id: edge_smartscreen
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Edge', name: SmartScreenEnabled, type: REG_DWORD }
    options:
      - label: "Enforced (block)"
        values: { enable_smartscreen: 1, smartscreen_level: "Block", edge_smartscreen: 1 }
      - label: "User's choice"
        values: { enable_smartscreen: absent, smartscreen_level: absent, edge_smartscreen: absent }

  - id: disable_tls_legacy
    name: "Disable legacy TLS 1.0/1.1 (Schannel)"
    description: "Disable weak TLS 1.0 and 1.1 system-wide so apps negotiate TLS 1.2 or 1.3."
    info: |
      **Turns off the old TLS 1.0 and 1.1 protocols in Windows' own encryption stack (Schannel), for connections both from and to this PC, so apps that use it negotiate TLS 1.2 or 1.3.**

      ## Mechanism
      - Covers Edge, Windows services, .NET Framework apps, Remote Desktop and most apps that use Windows' TLS. Firefox, Java and other apps with their own TLS are not affected.

      ## Caveats
      - An old app that can only use TLS 1.0 or 1.1 fails outright instead of falling back.
      - Old clients that only speak TLS 1.0 or 1.1 can no longer connect to services hosted on this PC.

      ## Notes
      - Windows 11 already has TLS 1.0 and 1.1 off by default, so there this mostly pins the state. On Windows 10, including LTSC 2021, it is a real change.
      - Running apps and services keep their old settings until restarted; the reboot covers them all.

      ## Related
      - **Force .NET strong crypto (TLS 1.2+)** keeps older .NET apps working once these protocols are gone.

      ## Recommendation
      Apply it on modern systems. Hold off if you must reach old internal servers, appliances or printer web pages stuck on TLS 1.0 or 1.1.

      ## Sources
      - [TLS registry settings](https://learn.microsoft.com/en-us/windows-server/security/tls/tls-registry-settings)
    risk_level: medium
    elevation: admin
    reversible: true
    requires_reboot: true
    warning: "Very old servers or appliances offering only TLS 1.0 or 1.1 become unreachable from every Schannel client on this PC."
    effects:
      - id: tls10_client_enabled
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Client', name: Enabled, type: REG_DWORD }
      - id: tls10_client_disabled_by_default
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Client', name: DisabledByDefault, type: REG_DWORD }
      - id: tls10_server_enabled
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Server', name: Enabled, type: REG_DWORD }
      - id: tls10_server_disabled_by_default
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Server', name: DisabledByDefault, type: REG_DWORD }
      - id: tls11_client_enabled
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Client', name: Enabled, type: REG_DWORD }
      - id: tls11_client_disabled_by_default
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Client', name: DisabledByDefault, type: REG_DWORD }
      - id: tls11_server_enabled
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Server', name: Enabled, type: REG_DWORD }
      - id: tls11_server_disabled_by_default
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\Server', name: DisabledByDefault, type: REG_DWORD }
    options:
      - label: "Disabled"
        values:
          tls10_client_enabled: 0
          tls10_client_disabled_by_default: 1
          tls10_server_enabled: 0
          tls10_server_disabled_by_default: 1
          tls11_client_enabled: 0
          tls11_client_disabled_by_default: 1
          tls11_server_enabled: 0
          tls11_server_disabled_by_default: 1
      - label: "Enabled"
        values:
          tls10_client_enabled: absent
          tls10_client_disabled_by_default: absent
          tls10_server_enabled: absent
          tls10_server_disabled_by_default: absent
          tls11_client_enabled: absent
          tls11_client_disabled_by_default: absent
          tls11_server_enabled: absent
          tls11_server_disabled_by_default: absent

  - id: dotnet_strong_crypto
    name: "Force .NET strong crypto (TLS 1.2+)"
    description: "Push legacy .NET Framework applications onto TLS 1.2 and later instead of SSL 3.0 or TLS 1.0."
    info: |
      **Makes older .NET Framework apps use strong encryption and the TLS versions Windows chooses (1.2 and newer) instead of SSL 3.0 or TLS 1.0. This often fixes old apps that fail to connect to modern servers.**

      ## Mechanism
      - Sets `SchUseStrongCrypto` and `SystemDefaultTlsVersions` to 1 in both the 64-bit and 32-bit registry views.

      ## Drawbacks
      - An old app that must reach a server supporting only weak encryption can stop connecting.

      ## Notes
      - On Windows 11 24H2, apps built for .NET Framework 4.6 or 4.7 and newer already behave this way; only apps targeting 4.5.2 or older change.
      - Applies to apps started after the change.
      - .NET Framework 3.5 apps and modern .NET (5 and newer) are not affected.

      ## Related
      - **Disable legacy TLS 1.0/1.1 (Schannel)**: with this applied, older .NET apps follow the protocol set that tweak defines.

      ## Recommendation
      Apply it; it improves both security and compatibility at negligible cost.

      ## Sources
      - [TLS best practices with .NET Framework](https://learn.microsoft.com/en-us/dotnet/framework/network-programming/tls)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: strong_crypto_64
        registry: { key: 'HKLM\SOFTWARE\Microsoft\.NETFramework\v4.0.30319', name: SchUseStrongCrypto, type: REG_DWORD }
      - id: strong_crypto_32
        registry: { key: 'HKLM\SOFTWARE\Wow6432Node\Microsoft\.NETFramework\v4.0.30319', name: SchUseStrongCrypto, type: REG_DWORD }
      - id: default_tls_versions_64
        registry: { key: 'HKLM\SOFTWARE\Microsoft\.NETFramework\v4.0.30319', name: SystemDefaultTlsVersions, type: REG_DWORD }
      - id: default_tls_versions_32
        registry: { key: 'HKLM\SOFTWARE\Wow6432Node\Microsoft\.NETFramework\v4.0.30319', name: SystemDefaultTlsVersions, type: REG_DWORD }
    options:
      - label: "Strong crypto"
        values: { strong_crypto_64: 1, strong_crypto_32: 1, default_tls_versions_64: 1, default_tls_versions_32: 1 }
      - label: "Legacy crypto allowed"
        values: { strong_crypto_64: absent, strong_crypto_32: absent, default_tls_versions_64: absent, default_tls_versions_32: absent }

  - id: disable_smb_guest
    name: "Disable SMB insecure guest logons"
    description: "Stop the SMB client falling back to unauthenticated guest access on file shares."
    info: |
      **Stops this PC connecting to shared folders as an anonymous guest. Guest sessions cannot be signed or encrypted, so a fake file server can use them to intercept your traffic.**

      ## Notes
      - Many editions already refuse guest sign-ins: Windows 10 Enterprise and Education, Windows 11 Pro from build 25267, and Windows 11 24H2 with SMB signing required. There this pins the state; Windows 10 Home and Pro see a real change.
      - Allowed deletes the policy, which leaves the edition's own default in force; editions that refuse guests keep refusing them.

      ## Related
      - **Require SMB signing** already blocks guest access, and **Block NTLM on the SMB client** tightens the same client; all three break the same old NAS devices.

      ## Recommendation
      Apply it and give your shares proper accounts. Keep Allowed only for a device that can offer nothing but guest access.

      ## Sources
      - [Enable insecure guest logons in SMB2 and SMB3](https://learn.microsoft.com/en-us/windows-server/storage/file-server/enable-insecure-guest-logons-smb2-and-smb3)
      - [LanmanWorkstation Policy CSP](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-lanmanworkstation)
    risk_level: low
    elevation: admin
    reversible: true
    warning: "Cheap home NAS boxes and router USB shares that only offer guest access stop working until you configure a real account on them."
    effects:
      - id: allow_insecure_guest
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation', name: AllowInsecureGuestAuth, type: REG_DWORD }
    options:
      - label: "Refused"
        values: { allow_insecure_guest: 0 }
      - label: "Allowed"
        values: { allow_insecure_guest: absent }

  - id: remove_powershell_v2
    name: "Remove PowerShell 2.0 engine"
    description: "Remove the obsolete PowerShell 2.0 engine that malware uses to dodge logging and AMSI."
    info: |
      **Removes the obsolete PowerShell 2.0 engine, which attackers start with `-Version 2` to run scripts that Defender cannot scan and PowerShell logging never records.**

      ## Mechanism
      - Disables the "Windows PowerShell 2.0" feature and its engine. Detected from both features, so a PC where it is already gone shows as Removed.

      ## Caveats
      - On newer builds where Microsoft has already removed PowerShell 2.0, applying fails with an error instead of changing anything.

      ## Notes
      - The feature change can take several minutes and completes at the next restart. Reverting reinstalls the feature and needs another restart.
      - CIS and DISA STIG baselines both require it.

      ## Related
      - **Enable PowerShell script-block logging** and **PowerShell module logging and transcription** can no longer be bypassed once this engine is gone.

      ## Recommendation
      Apply it on almost every PC. Skip it only if software you use forces PowerShell 2.0.

      ## Sources
      - [Disable-WindowsOptionalFeature](https://learn.microsoft.com/en-us/powershell/module/dism/disable-windowsoptionalfeature)
      - [DISA STIG V-253285: PowerShell 2.0 must be disabled](https://www.stigviewer.com/stigs/microsoft_windows_11/2025-05-15/finding/V-253285)
    risk_level: low
    elevation: admin
    reversible: true
    requires_reboot: true
    effects:
      - id: ps2_feature
        action:
          apply: |
            Disable-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2Root -NoRestart -ErrorAction Stop | Out-Null
          undo: |
            Enable-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2Root -NoRestart -All -ErrorAction Stop | Out-Null
          probe: |
            $off = 'Disabled', 'DisablePending', 'DisabledWithPayloadRemoved'
            $root = (Get-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2Root -ErrorAction Stop).State
            $engine = (Get-WindowsOptionalFeature -Online -FeatureName MicrosoftWindowsPowerShellV2 -ErrorAction Stop).State
            if ($root -in $off -and $engine -in $off) { exit 0 } else { exit 1 }
          shell: powershell
          timeout: 900
    options:
      - label: "Removed"
        values: { ps2_feature: run }

  - id: firewall_all_profiles
    name: "Enforce the firewall on all profiles"
    description: "Force the Windows firewall on for Domain, Private and Public networks with inbound blocked."
    info: |
      **Forces Windows Defender Firewall on for Domain, Private and Public networks, with unsolicited incoming connections blocked, and stops anyone switching it off.**

      ## Mechanism
      - Writes the firewall policy for all three profiles. Allow rules, including the ones apps create, keep working.

      ## Drawbacks
      - The firewall toggles in Windows Security are greyed out as managed by your administrator, so you cannot switch it off for troubleshooting until you revert.
      - Apps that expect open incoming ports need explicit allow rules.

      ## Caveats
      - A third-party firewall that manages Windows Defender Firewall will conflict with this.

      ## Notes
      - The firewall is already on with incoming blocked by default, so this mostly locks that in.
      - User's choice deletes the policy and hands control back to the Windows Security toggles.

      ## Related
      - **Firewall logging and local policy merge** (Network) adds logging in the same policy keys.

      ## Recommendation
      Apply it. Skip it if a third-party firewall manages this PC.

      ## Sources
      - [Firewall CSP](https://learn.microsoft.com/en-us/windows/client-management/mdm/firewall-csp)
      - [DISA Firewall STIG V-241990](https://www.stigviewer.com/stigs/microsoft_windows_defender_firewall_with_advanced_security/2023-08-23/finding/V-241990)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: domain_firewall
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile', name: EnableFirewall, type: REG_DWORD }
      - id: domain_inbound
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile', name: DefaultInboundAction, type: REG_DWORD }
      # PrivateProfile, not StandardProfile: the latter is the subkey name under the non-policy
      # SharedAccess\Parameters\FirewallPolicy path and nothing reads it here.
      - id: private_firewall
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile', name: EnableFirewall, type: REG_DWORD }
      - id: private_inbound
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PrivateProfile', name: DefaultInboundAction, type: REG_DWORD }
      - id: public_firewall
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile', name: EnableFirewall, type: REG_DWORD }
      - id: public_inbound
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\WindowsFirewall\PublicProfile', name: DefaultInboundAction, type: REG_DWORD }
    options:
      - label: "Enforced on all profiles"
        values:
          domain_firewall: 1
          domain_inbound: 1
          private_firewall: 1
          private_inbound: 1
          public_firewall: 1
          public_inbound: 1
      - label: "User's choice"
        values:
          domain_firewall: absent
          domain_inbound: absent
          private_firewall: absent
          private_inbound: absent
          public_firewall: absent
          public_inbound: absent

  - id: audit_logon_events
    name: "Enable logon/credential auditing"
    description: "Audit successful and failed sign-ins so intrusion attempts leave a trail in the Security log."
    info: |
      **Records every successful and failed sign-in in the Security event log, so password guessing and intrusions leave a trail.**

      ## Mechanism
      - Sets the Logon audit subcategory (events 4624 and 4625, among others) to Success and Failure. It is addressed by ID, so it works in any display language.

      ## Caveats
      - On a managed PC, an audit Group Policy overwrites it at the next refresh.
      - The older category-level audit policy can override it unless "Force audit policy subcategory settings" is enabled.

      ## Notes
      - Windows clients are documented to audit this already; such a PC shows as applied and nothing changes.
      - Reverting restores the exact setting recorded before you applied.

      ## Related
      - **Event log retention size** enlarges the Security log so these events are not overwritten.

      ## Recommendation
      Enable it if you want a record of access attempts, ideally with a larger Security log. The cost is close to zero.

      ## Sources
      - [Audit Logon](https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/audit-logon)
      - [auditpol set](https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/auditpol-set)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      # The apply stashes the pre-apply setting so the undo can restore it instead of hardcoding
      # Success-only. Settings are read as the numeric Setting Value (1 success, 2 failure) from
      # `auditpol /backup`: the /get text ("Success and Failure") is translated.
      - id: audit_logon
        action:
          apply: |
            $ErrorActionPreference = 'Stop'
            $sub = '{0CCE9215-69AE-11D9-BED3-505054503030}'
            $store = 'HKLM:\SOFTWARE\MagicXToolbox\State'
            $f = Join-Path $env:TEMP ('mxt-audit-' + [guid]::NewGuid() + '.csv')
            auditpol /backup /file:$f | Out-Null
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $v = $null
            foreach ($l in Get-Content -LiteralPath $f) { if ($l -match ([regex]::Escape($sub) + '.*,(\d+)\s*$')) { $v = [int]$Matches[1] } }
            Remove-Item -LiteralPath $f -Force
            if ($null -eq $v) { exit 1 }
            # New-Item -Force on an existing key deletes its values.
            if (-not (Test-Path $store)) { New-Item -Path $store -Force | Out-Null }
            # Keep the first stash: a re-apply must not replace the pre-tweak setting with this tweak's own.
            if ($null -eq (Get-ItemProperty -Path $store -Name AuditLogonPriorSetting -ErrorAction SilentlyContinue)) {
              New-ItemProperty -Path $store -Name AuditLogonPriorSetting -Value $v -PropertyType DWord -Force | Out-Null
            }
            auditpol /set /subcategory:"$sub" /success:enable /failure:enable
            exit $LASTEXITCODE
          undo: |
            $sub = '{0CCE9215-69AE-11D9-BED3-505054503030}'
            $store = 'HKLM:\SOFTWARE\MagicXToolbox\State'
            $p = (Get-ItemProperty -Path $store -Name AuditLogonPriorSetting -ErrorAction SilentlyContinue).AuditLogonPriorSetting
            # Without a stash, the Windows client default: Success and Failure.
            $v = if ($null -eq $p) { 3 } else { [int]$p }
            auditpol /set /subcategory:"$sub" /success:$(if ($v -band 1) { 'enable' } else { 'disable' }) /failure:$(if ($v -band 2) { 'enable' } else { 'disable' })
            $code = $LASTEXITCODE
            if ($code -eq 0) { Remove-ItemProperty -Path $store -Name AuditLogonPriorSetting -Force -ErrorAction SilentlyContinue }
            exit $code
          probe: |
            $sub = '{0CCE9215-69AE-11D9-BED3-505054503030}'
            $f = Join-Path $env:TEMP ('mxt-audit-' + [guid]::NewGuid() + '.csv')
            auditpol /backup /file:$f | Out-Null
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $v = $null
            foreach ($l in Get-Content -LiteralPath $f) { if ($l -match ([regex]::Escape($sub) + '.*,(\d+)\s*$')) { $v = [int]$Matches[1] } }
            Remove-Item -LiteralPath $f -Force -ErrorAction SilentlyContinue
            if ($v -eq 3) { exit 0 } else { exit 1 }
          shell: powershell
    options:
      # One authored option: Windows clients already audit Success and Failure here, so an authored
      # "stock" option would be undetectable. Default restores the captured setting from the snapshot.
      - label: "Success and failure"
        values: { audit_logon: run }

  - id: lock_on_inactivity
    name: "Lock the screen when idle"
    description: "Lock the session after ten idle minutes so a walk-away does not leave it open."
    info: |
      **Locks your session after ten idle minutes and asks for your password on return, so walking away does not leave the PC open.**

      ## Mechanism
      - Turns on a password-protected screen saver (the blank `scrnsave.scr`) with a 600-second timeout. Windows only starts the idle timer when a screen saver is selected, which is why one is set.

      ## Drawbacks
      - Can lock during a long read, a video or a presentation.
      - Replaces any screen saver you had chosen until you revert.

      ## Caveats
      - Applies only to your own account; other accounts on this PC are unaffected.
      - Unverified: whether Windows expands the `%SystemRoot%` path stored for the screen saver. If the PC never locks after applying, pick the screen saver in Settings yourself.

      ## Notes
      - Takes effect at the next sign-in. You can change the timeout later in Settings.
      - Reverting restores your previous screen saver settings exactly.

      ## Recommendation
      Apply it on laptops and PCs in shared spaces. On a physically secure home desktop the benefit is small.

      ## Sources
      - [Group Policy screen saver setting isn't working](https://learn.microsoft.com/en-us/troubleshoot/windows-client/group-policy/group-policy-screensaver-setting-not-work)
      - [Auto lock the screen after inactivity (Windows OS Hub)](https://woshub.com/windows-lock-screen-after-idle-via-gpo/)
    risk_level: low
    elevation: user
    reversible: true
    effects:
      # One authored option: none of these has a documented Windows default, so an authored "stock"
      # option would be inventing literals. Default restores the captured values from the snapshot.
      - id: screensaver_active
        registry: { key: 'HKCU\Control Panel\Desktop', name: ScreenSaveActive, type: REG_SZ }
      - id: screensaver_secure
        registry: { key: 'HKCU\Control Panel\Desktop', name: ScreenSaverIsSecure, type: REG_SZ }
      - id: screensaver_timeout
        registry: { key: 'HKCU\Control Panel\Desktop', name: ScreenSaveTimeOut, type: REG_SZ }
      # Without a screen saver executable selected Windows never starts the idle timer at all.
      - id: screensaver_exe
        registry: { key: 'HKCU\Control Panel\Desktop', name: SCRNSAVE.EXE, type: REG_SZ }
    options:
      - label: "Lock after 10 min"
        values:
          screensaver_active: "1"
          screensaver_secure: "1"
          screensaver_timeout: "600"
          screensaver_exe: '%SystemRoot%\System32\scrnsave.scr'

  - id: enable_credential_guard
    name: "Enable Credential Guard"
    description: "Isolate domain and NTLM secrets in a hypervisor-protected enclave, out of LSASS memory."
    info: |
      **Moves password hashes and Kerberos tickets out of LSASS into a separate process isolated by the hypervisor, where malware in Windows cannot read them, even with full admin rights.**

      ## Mechanism
      - Sets `LsaCfgFlags = 2`: on, without the firmware (UEFI) lock that value 1 creates, so it can be undone.
      - Relies on virtualization-based security (VBS) already being on; this tweak does not turn VBS on.

      ## Drawbacks
      - Uses some memory, and on older hardware some performance.

      ## Caveats
      - Off writes 0, which really switches it off, even where Windows had turned Credential Guard on by default. To go back to what Windows chose, pick System Default.

      ## Requirements
      - 64-bit Windows with Secure Boot, CPU virtualization support and VBS; Enterprise or Education (Pro under some licensing).

      ## Notes
      - Windows 11 22H2 and newer turns it on by default on eligible PCs, so it may already be running.

      ## Related
      - **Enable LSA protection (RunAsPPL)** and **Disable WDigest credential caching** are lighter LSASS protections without the compatibility cost.

      ## Recommendation
      For domain-joined or Entra-joined Enterprise or Education PCs that meet the hardware requirements. On a standalone home PC there are few domain secrets to protect, and the protocol restrictions cost more than they return.

      ## Sources
      - [Configure Credential Guard](https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/configure)
    risk_level: medium
    elevation: admin
    reversible: true
    requires_reboot: true
    warning: "Credential Guard is hosted by virtualization-based security, so it does nothing while VBS is off. Do not apply this alongside the Performance tweak that disables VBS and memory integrity. It also blocks unconstrained delegation, NTLMv1, Kerberos DES and RC4, and some VPN and credential plug-ins, and is not available on Windows Home."
    effects:
      # LsaCfgFlags lives under Control\Lsa. Control\DeviceGuard is an OS state mirror for this value,
      # not an input, so writing it there is a silent no-op.
      - id: lsa_cfg_flags
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', name: LsaCfgFlags, type: REG_DWORD }
      - id: platform_security_features
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard', name: RequirePlatformSecurityFeatures, type: REG_DWORD }
    options:
      # Value 2 is "enabled without UEFI lock"; value 1 writes a firmware variable that no registry
      # revert can clear.
      - label: "Enabled"
        values: { lsa_cfg_flags: 2, platform_security_features: 1 }
      # Must write 0, not delete: Microsoft states deleting the value may not disable Credential Guard.
      - label: "Off"
        values: { lsa_cfg_flags: 0, platform_security_features: absent }

  - id: defender_cloud_protection
    name: "Defender cloud protection and MAPS"
    description: "Raise Defender's cloud block level and enable Block at First Sight for brand-new malware."
    info: |
      **Raises Microsoft Defender's cloud protection to the High block level and turns on Block at First Sight, which holds brand-new files for up to 50 extra seconds until Microsoft's cloud returns a verdict.**

      ## Mechanism
      - The real changes are the High block level and the 50-second hold; cloud protection and Block at First Sight are usually on already.
      - Tamper Protection, on by default, ignores policy writes to the settings it guards, so some of these writes change nothing in practice.

      ## Drawbacks
      - Microsoft says the High level carries a greater chance of false positives.
      - Both options use Advanced MAPS, which sends more detail about detected threats to Microsoft.

      ## Notes
      - "Send safe samples" uploads suspicious files automatically, as Windows already does by default; "prompt" asks you first.
      - No option turns uploads off entirely: Microsoft states Never Send disables Block at First Sight.
      - The app confirms the policy values, not Defender's effective state; `Get-MpPreference` shows that.
      - User's choice deletes the values and hands control back to Windows Security. Files already uploaded are not recalled.

      ## Related
      - **Defender Network Protection** needs the cloud protection this keeps on.

      ## Recommendation
      Choose "High, send safe samples" for maximum detection if Defender is your antivirus. If automatic uploads bother you, choose "High, prompt before sending samples". Skip it if you use a third-party antivirus.

      ## Sources
      - [Turn on cloud protection](https://learn.microsoft.com/en-us/defender-endpoint/enable-cloud-protection-microsoft-defender-antivirus)
      - [Specify the cloud protection level](https://learn.microsoft.com/en-us/defender-endpoint/specify-cloud-protection-level-microsoft-defender-antivirus)
      - [Protect security settings with tamper protection](https://learn.microsoft.com/en-us/defender-endpoint/prevent-changes-to-security-settings-with-tamper-protection)
    risk_level: low
    elevation: admin
    reversible: true
    warning: "This is the opposite of a privacy posture: it opts into Advanced MAPS and uploads suspicious files to Microsoft. It is inert where a third-party antivirus has put Defender in passive mode, and Tamper Protection can absorb three of the five writes."
    effects:
      - id: spynet_reporting
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet', name: SpynetReporting, type: REG_DWORD }
      - id: submit_samples_consent
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet', name: SubmitSamplesConsent, type: REG_DWORD }
      - id: block_at_first_seen
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet', name: DisableBlockAtFirstSeen, type: REG_DWORD }
      - id: cloud_block_level
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine', name: MpCloudBlockLevel, type: REG_DWORD }
      - id: bafs_extended_timeout
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\MpEngine', name: MpBafsExtendedTimeout, type: REG_DWORD }
    options:
      - label: "High, send safe samples"
        values:
          spynet_reporting: 2
          submit_samples_consent: 1
          block_at_first_seen: 0
          cloud_block_level: 2
          bafs_extended_timeout: 50
      # Always Prompt rather than Never Send: Microsoft states Never Send disables Block at First
      # Sight outright, so the option would advertise and defeat the same feature.
      - label: "High, prompt before sending samples"
        values:
          spynet_reporting: 2
          submit_samples_consent: 0
          block_at_first_seen: 0
          cloud_block_level: 2
          bafs_extended_timeout: 50
      - label: "User's choice"
        values:
          spynet_reporting: absent
          submit_samples_consent: absent
          block_at_first_seen: absent
          cloud_block_level: absent
          bafs_extended_timeout: absent

  - id: smb_client_block_ntlm
    name: "Block NTLM on the SMB client"
    description: "Stop this PC ever sending an NTLM response to an SMB server, killing NTLM relay at the source."
    info: |
      **Stops this PC ever sending NTLM credentials to a file server, so an attacker who tricks it into connecting to a hostile server gets nothing to crack or relay.**

      ## Mechanism
      - The SMB client then signs in with Kerberos only, which needs a server name the domain can resolve. Shares reached by IP address, workgroup PCs and devices without Kerberos are refused.

      ## Notes
      - To keep one server working, add it to the "Block NTLM server exception list" policy yourself; this tweak never touches that list.
      - It only affects connections made from this PC, so it cannot lock you out.
      - Allowed deletes the value, which leaves Windows' default in force: NTLM is used when Kerberos is not available.

      ## Related
      - **Require SMB signing** and **Disable SMB insecure guest logons** break the same home NAS setups.
      - **Enforce NTLMv2 only** and **Restrict outgoing NTLM** are the Windows-wide NTLM controls.

      ## Recommendation
      Apply it if every file share you use is reached by name and supports Kerberos, which usually means a company domain. On a home network that maps shares by IP address, skip it.

      ## Sources
      - [Block NTLM connections on SMB](https://learn.microsoft.com/en-us/windows-server/storage/file-server/smb-ntlm-blocking)
      - [What's new in Windows 11, version 24H2](https://learn.microsoft.com/en-us/windows/whats-new/whats-new-windows-11-version-24h2)
    risk_level: medium
    elevation: admin
    reversible: true
    windows: { build: ">=26100" }
    warning: "Any SMB target that cannot do Kerberos stops working: NAS reached by IP address, workgroup shares, and older network printers with scan-to-folder. Home networks lean heavily on exactly those."
    effects:
      # The exception list is deliberately not an effect: it holds user-chosen server names, and a
      # coverage value for it would delete whatever the user configured.
      - id: block_ntlm
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\LanmanWorkstation', name: BlockNTLM, type: REG_DWORD }
    options:
      - label: "Blocked"
        values: { block_ntlm: 1 }
      # Delete, never 0: 0 is the policy explicitly saying "allow NTLM" rather than "unconfigured".
      - label: "Allowed"
        values: { block_ntlm: absent }

  - id: enhanced_phishing_protection
    name: "Enhanced Phishing Protection"
    description: "Warn when a work or school password is typed into a phishing site, reused, or saved unsafely."
    info: |
      **Warns you when your work or school password is typed into a phishing site, reused on a website, or typed into Notepad or Office where it would sit in plain text.**

      ## Drawbacks
      - The screenshot option sends a capture of the offending window to Microsoft: a privacy cost with no extra protection for you.
      - Applying locks the feature's toggle in Windows Security.

      ## Requirements
      - Protects Microsoft work or school account passwords only; with a local or personal Microsoft account it does nothing.
      - Microsoft documents it for Pro, Enterprise, Education and IoT editions.

      ## Notes
      - The real additions are the reuse and unsafe-app warnings; the service and the phishing-site warning are already on by default.
      - Not configured deletes the policy and leaves Windows' defaults in force: the feature stays on with phishing-site warnings, while reuse and unsafe-app warnings go off.

      ## Related
      - **Enforce SmartScreen (apps and Edge)** configures a different part of SmartScreen.

      ## Recommendation
      Choose "Warnings on, no screenshot upload" on a PC signed in with a work or school account. On a personal PC, skip it.

      ## Sources
      - [Enhanced Phishing Protection in Microsoft Defender SmartScreen](https://learn.microsoft.com/en-us/windows/security/operating-system-security/virus-and-threat-protection/microsoft-defender-smartscreen/enhanced-phishing-protection)
      - [Policy CSP - WebThreatDefense](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-webthreatdefense)
    risk_level: low
    elevation: admin
    reversible: true
    windows: { products: [11] }
    effects:
      - id: wtds_service_enabled
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WTDS\Components', name: ServiceEnabled, type: REG_DWORD }
      - id: wtds_notify_malicious
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WTDS\Components', name: NotifyMalicious, type: REG_DWORD }
      - id: wtds_notify_password_reuse
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WTDS\Components', name: NotifyPasswordReuse, type: REG_DWORD }
      - id: wtds_notify_unsafe_app
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WTDS\Components', name: NotifyUnsafeApp, type: REG_DWORD }
      - id: wtds_capture_threat_window
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WTDS\Components', name: CaptureThreatWindow, type: REG_DWORD }
    options:
      - label: "Warnings on, no screenshot upload"
        values:
          wtds_service_enabled: 1
          wtds_notify_malicious: 1
          wtds_notify_password_reuse: 1
          wtds_notify_unsafe_app: 1
          wtds_capture_threat_window: 0
      - label: "Warnings on, with screenshot upload"
        values:
          wtds_service_enabled: 1
          wtds_notify_malicious: 1
          wtds_notify_password_reuse: 1
          wtds_notify_unsafe_app: 1
          wtds_capture_threat_window: 1
      - label: "Not configured"
        values:
          wtds_service_enabled: absent
          wtds_notify_malicious: absent
          wtds_notify_password_reuse: absent
          wtds_notify_unsafe_app: absent
          wtds_capture_threat_window: absent

  - id: asr_standard_protection_rules
    name: "ASR standard protection rules"
    description: "Enable the two Defender ASR rules Microsoft designates for direct Block deployment."
    info: |
      **Turns on the two Defender ASR rules Microsoft says can go straight to Block: one stops apps saving known-vulnerable signed drivers, the other stops malware hiding in WMI event subscriptions that survive reboots.**

      ## Mechanism
      - Sets both rules and switches on the parent "Configure ASR rules" policy, which the four ASR tweaks share.
      - The driver rule stops the file being written, not drivers already on disk from loading; the vulnerable-driver blocklist handles loading.

      ## Caveats
      - The WMI rule has limited exclusion support, and Configuration Manager clients lean heavily on WMI. On such managed PCs, start with Audit only.

      ## Requirements
      - Microsoft Defender must be the active antivirus. Enforcement on Windows Home is unconfirmed.

      ## Notes
      - Off deletes both rules. The shared parent ASR policy stays on while another ASR tweak uses it, and returns to its original state only when the last one is turned off.

      ## Related
      - **Block LSASS credential theft (ASR rule)** is Microsoft's third standard rule.
      - **Enable the Microsoft vulnerable-driver blocklist** stops vulnerable drivers loading.

      ## Recommendation
      Choose Block on any PC where Defender is the active antivirus; breakage on a home PC is close to zero.

      ## Sources
      - [ASR rules reference](https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference)
      - [ASR rules overview](https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-overview)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: asr_vulnerable_drivers
        registry:
          { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules', name: 56a863a9-875e-4185-98a7-b882c64b5ce5, type: REG_SZ }
      - id: asr_wmi_persistence
        registry:
          { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules', name: e6db77e5-3df2-4cf1-b95a-636979351e5b, type: REG_SZ }
      - id: asr_policy
        shared: defender_asr_policy_enabled
    options:
      - label: "Block"
        values: { asr_vulnerable_drivers: "1", asr_wmi_persistence: "1", asr_policy: claim }
      - label: "Audit only"
        values: { asr_vulnerable_drivers: "2", asr_wmi_persistence: "2", asr_policy: claim }
      - label: "Off"
        values: { asr_vulnerable_drivers: absent, asr_wmi_persistence: absent, asr_policy: unclaimed }

  - id: disable_winrm_remoting
    name: "Disable WinRM remoting"
    description: "Shut down WinRM, the remote-execution channel PowerShell Remoting and attack tooling use."
    info: |
      **Disables WinRM, the service behind incoming PowerShell Remoting that attackers use to run commands after stealing a password. It also turns off weak WinRM sign-in methods in case the service comes back.**

      ## Mechanism
      - Sets the WinRM service to Disabled, and blocks Basic and Digest sign-in and unencrypted traffic for both the WinRM client and service (the DISA STIG set).

      ## Notes
      - A stock Windows client has no WinRM listener, so most PCs see no change; it matters where `winrm quickconfig` or `Enable-PSRemoting` was run.
      - The app does not stop a running WinRM service; a configured listener keeps working until the restart.
      - Connecting from this PC to others still works, as do Remote Desktop and PowerShell over SSH.
      - Reverting restores the service start type recorded before you applied.

      ## Related
      - **Disable Remote Desktop (RDP)** and **Disable the Remote Registry service** close other remote-access channels.

      ## Recommendation
      Apply it on a standalone or home PC that never accepts PowerShell Remoting. Leave it alone if you manage this PC remotely or use event forwarding.

      ## Sources
      - [Installation and configuration for Windows Remote Management](https://learn.microsoft.com/en-us/windows/win32/winrm/installation-and-configuration-for-windows-remote-management)
      - [DISA STIG for Windows 11](https://www.stigviewer.com/stigs/microsoft_windows_11)
    risk_level: medium
    elevation: admin
    reversible: true
    requires_reboot: true
    warning: "Inbound PowerShell Remoting, Windows Event Collector forwarding, Windows Admin Center and similar remote-management agents stop working. It cannot lock you out: WinRM is inbound only."
    effects:
      # One authored option: no tier A source pins the shipped WinRM start type, so an authored
      # "stock" option would have to invent one. Default restores it from the snapshot.
      - id: winrm_service
        service: { name: WinRM }
      - id: winrm_client_basic
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client', name: AllowBasic, type: REG_DWORD }
      - id: winrm_client_unencrypted
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client', name: AllowUnencryptedTraffic, type: REG_DWORD }
      - id: winrm_client_digest
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client', name: AllowDigest, type: REG_DWORD }
      - id: winrm_service_basic
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service', name: AllowBasic, type: REG_DWORD }
      - id: winrm_service_unencrypted
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service', name: AllowUnencryptedTraffic, type: REG_DWORD }
      - id: winrm_service_runas
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service', name: DisableRunAs, type: REG_DWORD }
    options:
      - label: "Disabled"
        values:
          winrm_service: disabled
          winrm_client_basic: 0
          winrm_client_unencrypted: 0
          winrm_client_digest: 0
          winrm_service_basic: 0
          winrm_service_unencrypted: 0
          winrm_service_runas: 1

  - id: powershell_module_transcript_logging
    name: "PowerShell module logging and transcription"
    description: "Record pipeline execution details and write a durable transcript of every PowerShell session."
    info: |
      **Logs the commands PowerShell runs to the event log and, with transcription, writes a text record of every PowerShell session to disk.**

      ## Mechanism
      - Module logging records each command and its parameters, for all modules, in the PowerShell operational log.
      - Transcription saves one text file per session, with a timestamp per command, in `C:\ProgramData\PowerShellTranscripts` instead of each user's Documents.

      ## Drawbacks
      - Transcript files pile up, one per session; nothing rotates or deletes them.
      - Module logging for every module fills the PowerShell log faster.

      ## Caveats
      - Covers Windows PowerShell 5.1. Whether PowerShell 7 honours these settings is not established.
      - Reverting leaves the transcripts already written, and a few empty policy keys that do nothing.

      ## Related
      - **Enable PowerShell script-block logging** records the script content itself; the two complement each other.
      - **Remove PowerShell 2.0 engine** closes the old-engine bypass.

      ## Recommendation
      Choose "Module logging and transcription" for a full audit trail, and on a shared PC restrict the transcripts folder to administrators. If transcript files on disk worry you, choose "Module logging only".

      ## Sources
      - [About Logging Windows](https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging_windows)
      - [PowerShell policy reader source (Utils.cs)](https://raw.githubusercontent.com/PowerShell/PowerShell/master/src/System.Management.Automation/engine/Utils.cs)
    risk_level: low
    elevation: admin
    reversible: true
    warning: "Transcripts capture anything typed or piped in plaintext, including secrets. They land in C:\\ProgramData\\PowerShellTranscripts, which inherits ProgramData's default permissions: every local user can read the files. Restrict the folder to administrators if other people use this PC."
    effects:
      - id: module_logging
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging', name: EnableModuleLogging, type: REG_DWORD }
      # PowerShell reads the value NAMES of the ModuleNames subkey and ignores the data, so the
      # wildcard has to be the name. A numbered entry would register a module called "1".
      - id: module_names_wildcard
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging\ModuleNames', name: "*", type: REG_SZ }
      - id: transcripting
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription', name: EnableTranscripting, type: REG_DWORD }
      - id: transcript_invocation_header
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription', name: EnableInvocationHeader, type: REG_DWORD }
      - id: transcript_output_dir
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription', name: OutputDirectory, type: REG_SZ }
    options:
      - label: "Module logging and transcription"
        values:
          module_logging: 1
          module_names_wildcard: "*"
          transcripting: 1
          transcript_invocation_header: 1
          transcript_output_dir: 'C:\ProgramData\PowerShellTranscripts'
      - label: "Module logging only"
        values:
          module_logging: 1
          module_names_wildcard: "*"
          transcripting: absent
          transcript_invocation_header: absent
          transcript_output_dir: absent
      - label: "Off"
        values:
          module_logging: absent
          module_names_wildcard: absent
          transcripting: absent
          transcript_invocation_header: absent
          transcript_output_dir: absent

  - id: restrict_remote_sam
    name: "Restrict remote SAM calls to administrators"
    description: "Limit who can enumerate this PC's local users and groups over the network to administrators."
    info: |
      **Makes sure only administrators can list this PC's local users and groups over the network, blocking reconnaissance tools like BloodHound run from ordinary accounts.**

      ## Mechanism
      - Writes the standard CIS and DISA STIG security descriptor to `RestrictRemoteSam`, as the text type Windows reads.

      ## Notes
      - Windows 10 1607 and newer already restrict this to administrators by default, so nothing visibly changes; this pins the state against later loosening.
      - Not configured deletes the value, which leaves that built-in default (administrators only) in force.

      ## Related
      - **Restrict anonymous enumeration** covers callers who are not signed in; this covers signed-in ones.

      ## Recommendation
      Apply Administrators only. Skip it only if a non-admin inventory agent needs to list local groups remotely.

      ## Sources
      - [Restrict clients allowed to make remote calls to SAM](https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/network-access-restrict-clients-allowed-to-make-remote-sam-calls)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      # REG_SZ, not REG_DWORD: the value holds an SDDL string and a DWORD write is silently ignored.
      - id: restrict_remote_sam
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa', name: RestrictRemoteSam, type: REG_SZ }
    options:
      - label: "Administrators only"
        values: { restrict_remote_sam: "O:BAG:BAD:(A;;RC;;;BA)" }
      - label: "Not configured"
        values: { restrict_remote_sam: absent }

  - id: block_always_install_elevated
    name: "Block AlwaysInstallElevated"
    description: "Pin off the Windows Installer setting that lets any user run an MSI as SYSTEM."
    info: |
      **Pins off the Windows Installer setting that would let any user run an MSI installer with full SYSTEM rights, a classic privilege-escalation trick.**

      ## Mechanism
      - The trick needs the setting on for both the machine and the user; writing 0 for the machine already defeats it. The per-user copy is also written, for your account only.

      ## Notes
      - Both values are absent on a clean PC, which is already safe; this pins that state against deployment scripts that turn it on.
      - Not configured deletes both values, returning to that safe default.

      ## Recommendation
      Apply Blocked on every PC. It costs nothing and cannot break a working installer.

      ## Sources
      - [Policy configuration service provider](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-configuration-service-provider)
      - [DISA STIG for Windows 11](https://www.stigviewer.com/stigs/microsoft_windows_11)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: always_install_elevated_machine
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Installer', name: AlwaysInstallElevated, type: REG_DWORD }
      # Class Both. HKLM = 0 alone already defeats the escalation; the HKCU twin is defence in depth
      # and only covers the hive of the signed-in user.
      - id: always_install_elevated_user
        registry: { key: 'HKCU\SOFTWARE\Policies\Microsoft\Windows\Installer', name: AlwaysInstallElevated, type: REG_DWORD }
    options:
      - label: "Blocked"
        values: { always_install_elevated_machine: 0, always_install_elevated_user: 0 }
      - label: "Not configured"
        values: { always_install_elevated_machine: absent, always_install_elevated_user: absent }

  - id: kernel_dma_protection
    name: "Kernel DMA protection policy"
    description: "Block external Thunderbolt and PCIe peripherals from touching memory before you sign in."
    info: |
      **Stops external Thunderbolt and PCIe devices reading your PC's memory before you sign in or while it is locked, closing drive-by attacks on an unattended laptop.**

      ## Mechanism
      - Block all: external devices whose drivers lack DMA remapping never start, even after sign-in.
      - Allow only after sign-in: Windows' own default for that part, pinned; the real change is blocking new Thunderbolt devices while the PC is locked.

      ## Caveats
      - The lock-screen part only works when BitLocker or device encryption is on.
      - The app cannot tell whether your hardware supports Kernel DMA Protection, so it can apply fine and do nothing. Check `msinfo32` for "Kernel DMA Protection: On" first.
      - Does not cover FireWire, PCMCIA or ExpressCard devices.

      ## Notes
      - Cannot lock you out: the internal keyboard, display, storage and normal USB devices are unaffected.
      - Not configured deletes both values, which leaves Windows' default in force: devices are allowed after sign-in.

      ## Related
      - **Prevent automatic device encryption** can leave the lock-screen part without the encryption it needs.

      ## Recommendation
      Choose Block all on a laptop you carry, after checking your docks still work. With an eGPU or capture card, choose Allow only after sign-in or leave it alone.

      ## Sources
      - [Kernel DMA Protection](https://learn.microsoft.com/en-us/windows/security/hardware-security/kernel-dma-protection-for-thunderbolt)
      - [Policy CSP - DmaGuard](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-dmaguard)
    risk_level: medium
    elevation: admin
    reversible: true
    requires_reboot: true
    windows: { build: ">=17763" }
    warning: "Pro and above only, and inert unless the platform shipped with firmware DMA remapping. Under \"Block all\", eGPU enclosures and some Thunderbolt docks refuse to start, which can cost you keyboard and display on a docked laptop."
    effects:
      - id: dma_device_enumeration
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Kernel DMA Protection', name: DeviceEnumerationPolicy, type: REG_DWORD }
      - id: dma_disable_under_lock
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\FVE', name: DisableExternalDMAUnderLock, type: REG_DWORD }
    options:
      - label: "Block all"
        values: { dma_device_enumeration: 0, dma_disable_under_lock: 1 }
      # Value 1 is the shipped behaviour ("Only while logged in"); this option pins it explicitly.
      - label: "Allow only after sign-in"
        values: { dma_device_enumeration: 1, dma_disable_under_lock: 1 }
      # Never writes 2 ("Allow all"): that would be less protective than the Windows default.
      - label: "Not configured"
        values: { dma_device_enumeration: absent, dma_disable_under_lock: absent }

  - id: asr_extended_rules
    name: "ASR extended rule set"
    description: "Enable six further Defender ASR rules covering scripts, macros, USB, ransomware and PsExec."
    info: |
      **Turns on six more Defender ASR rules covering scripts that launch downloads, Win32 calls from Office macros, unsigned programs run from USB, ransomware, PsExec and WMI process creation, and Office communication apps starting child processes.**

      ## Mechanism
      - All six are set to the same mode, together with the shared parent "Configure ASR rules" policy the four ASR tweaks use. There is no per-rule choice.

      ## Caveats
      - The Office communication rule only covers Office installed under Program Files, so Store and per-user Office installs are not protected.
      - The ransomware rule can flag brand-new or rarely seen programs.

      ## Requirements
      - Microsoft Defender as the active antivirus. Enforcement on Windows Home is unconfirmed.

      ## Notes
      - Off deletes the six rules. The shared parent ASR policy stays on while another ASR tweak uses it, and returns to its original state only when the last one is turned off.

      ## Related
      - **Defender cloud protection and MAPS** turns on the cloud protection the ransomware rule needs.

      ## Recommendation
      Worth it on a home PC, where these behaviours are almost always malicious. If you use PsExec, WMI automation or remote-management tools, start with Audit only and review Defender's events first.

      ## Sources
      - [ASR rules reference](https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference)
      - [ASR rules overview](https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-overview)
    risk_level: medium
    elevation: admin
    reversible: true
    warning: "The PsExec and WMI rule blocks processes spawned by legitimate management and automation tooling. Audit first if you use scripted automation, and note that the ransomware rule does nothing unless Defender cloud-delivered protection is on."
    effects:
      - id: asr_script_downloads
        registry:
          { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules', name: d3e037e1-3eb8-44c8-a917-57927947596d, type: REG_SZ }
      - id: asr_macro_win32_api
        registry:
          { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules', name: 92e97fa1-2edf-4476-bdd6-9dd0b4dddc7b, type: REG_SZ }
      - id: asr_usb_untrusted
        registry:
          { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules', name: b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4, type: REG_SZ }
      - id: asr_ransomware
        registry:
          { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules', name: c1db55ab-c21a-4637-bb3f-a12568109d35, type: REG_SZ }
      - id: asr_psexec_wmi
        registry:
          { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules', name: d1e49aac-8f56-4280-b9ba-993a6d77406c, type: REG_SZ }
      - id: asr_office_comm_child
        registry:
          { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Windows Defender Exploit Guard\ASR\Rules', name: 26190899-1602-49e8-8b27-eb1d0a1ce869, type: REG_SZ }
      - id: asr_policy
        shared: defender_asr_policy_enabled
    options:
      - label: "Block"
        values:
          asr_script_downloads: "1"
          asr_macro_win32_api: "1"
          asr_usb_untrusted: "1"
          asr_ransomware: "1"
          asr_psexec_wmi: "1"
          asr_office_comm_child: "1"
          asr_policy: claim
      - label: "Audit only"
        values:
          asr_script_downloads: "2"
          asr_macro_win32_api: "2"
          asr_usb_untrusted: "2"
          asr_ransomware: "2"
          asr_psexec_wmi: "2"
          asr_office_comm_child: "2"
          asr_policy: claim
      - label: "Off"
        values:
          asr_script_downloads: absent
          asr_macro_win32_api: absent
          asr_usb_untrusted: absent
          asr_ransomware: absent
          asr_psexec_wmi: absent
          asr_office_comm_child: absent
          asr_policy: unclaimed

  - id: ntlm_outgoing_restriction
    name: "Restrict outgoing NTLM"
    description: "Audit or refuse outgoing NTLM and require NTLMv2 session security on top of 128-bit encryption."
    info: |
      **Logs, or refuses, the NTLM sign-ins this PC sends to other servers, and requires NTLMv2 session security with 128-bit encryption for NTLM sessions in both directions.**

      ## Mechanism
      - Audit outgoing NTLM records every outgoing NTLM use but still allows it; Deny outgoing NTLM refuses it.
      - Both options add the NTLMv2 session-security requirement; Windows' default only requires 128-bit encryption.

      ## Caveats
      - Microsoft does not publish the two outgoing-NTLM registry names; they come from DISA STIG and CIS. That the audit value really produces events has not been checked on a machine.

      ## Notes
      - Allow all deletes the four values, which leaves Windows' defaults in force: NTLM allowed, 128-bit encryption required.
      - It cannot lock you out of this PC; it only affects network sign-ins.

      ## Related
      - **Block NTLM on the SMB client** blocks NTLM for file sharing only.
      - **Enforce NTLMv2 only** and **Prevent LM hash storage** harden the same sign-in system.

      ## Recommendation
      Start with Audit outgoing NTLM, which costs almost nothing. Move to Deny only if everything you connect to supports Kerberos; on a home network with a NAS, deny will break it.

      ## Sources
      - [Restrict NTLM: Outgoing NTLM traffic to remote servers](https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/network-security-restrict-ntlm-outgoing-ntlm-traffic-to-remote-servers)
      - [Policy CSP - LocalPoliciesSecurityOptions](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-localpoliciessecurityoptions)
    risk_level: medium
    elevation: admin
    reversible: true
    warning: "Deny mode stops this PC using NTLM for anything, which breaks most consumer NAS devices and workgroup shares. Start with the audit option and read the log before switching."
    effects:
      - id: audit_outgoing_ntlm
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0', name: AuditOutgoingNTLMTraffic, type: REG_DWORD }
      - id: restrict_sending_ntlm
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0', name: RestrictSendingNTLMTraffic, type: REG_DWORD }
      - id: ntlm_min_client_sec
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0', name: NtlmMinClientSec, type: REG_DWORD }
      - id: ntlm_min_server_sec
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0', name: NtlmMinServerSec, type: REG_DWORD }
    options:
      - label: "Audit outgoing NTLM"
        values:
          audit_outgoing_ntlm: 2
          restrict_sending_ntlm: absent
          ntlm_min_client_sec: 0x20080000
          ntlm_min_server_sec: 0x20080000
      - label: "Deny outgoing NTLM"
        values:
          audit_outgoing_ntlm: 2
          restrict_sending_ntlm: 2
          ntlm_min_client_sec: 0x20080000
          ntlm_min_server_sec: 0x20080000
      # 0x20000000 is an effective default, not a value the OS writes, so the revert must delete.
      - label: "Allow all"
        values:
          audit_outgoing_ntlm: absent
          restrict_sending_ntlm: absent
          ntlm_min_client_sec: absent
          ntlm_min_server_sec: absent

  - id: rdp_session_hardening
    name: "Harden the RDP session"
    description: "Tighten five Remote Desktop session settings beyond the NLA and TLS basics."
    info: |
      **Tightens five Remote Desktop session settings on top of NLA and TLS: high encryption, secure RPC, always asking for a password, no saved Remote Desktop passwords and, optionally, no drive redirection.**

      ## Mechanism
      - No drive redirection: drives on computers that connect to this PC are not mapped into their sessions here, so files cannot be copied through a redirected drive.
      - Always prompt: a password must be typed to open a session on this PC, even if the connecting client has one saved.
      - No saved passwords also applies to this PC's own Remote Desktop client: you cannot save passwords when connecting out.

      ## Caveats
      - The encryption level only governs the older RDP security layer; with TLS required by Harden RDP (NLA + TLS), it decides little.

      ## Notes
      - All five do nothing unless Remote Desktop is in use.
      - Not hardened deletes all five values, restoring Windows' defaults.

      ## Related
      - **Harden RDP (NLA + TLS)** covers the basics; apply it first.
      - **Disable Remote Desktop (RDP)** is the alternative if you do not use Remote Desktop.

      ## Recommendation
      Apply it if you use Remote Desktop. Choose "Hardened, keep drive redirection" if you copy files through it.

      ## Sources
      - [RemoteDesktopServices Policy CSP](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-remotedesktopservices)
      - [DISA STIG for Windows 11](https://www.stigviewer.com/stigs/microsoft_windows_11)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: rdp_min_encryption
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services', name: MinEncryptionLevel, type: REG_DWORD }
      - id: rdp_encrypt_rpc
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services', name: fEncryptRPCTraffic, type: REG_DWORD }
      - id: rdp_prompt_password
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services', name: fPromptForPassword, type: REG_DWORD }
      - id: rdp_disable_password_saving
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services', name: DisablePasswordSaving, type: REG_DWORD }
      - id: rdp_disable_drive_redirection
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services', name: fDisableCdm, type: REG_DWORD }
    options:
      - label: "Hardened"
        values:
          rdp_min_encryption: 3
          rdp_encrypt_rpc: 1
          rdp_prompt_password: 1
          rdp_disable_password_saving: 1
          rdp_disable_drive_redirection: 1
      - label: "Hardened, keep drive redirection"
        values:
          rdp_min_encryption: 3
          rdp_encrypt_rpc: 1
          rdp_prompt_password: 1
          rdp_disable_password_saving: 1
          rdp_disable_drive_redirection: absent
      - label: "Not hardened"
        values:
          rdp_min_encryption: absent
          rdp_encrypt_rpc: absent
          rdp_prompt_password: absent
          rdp_disable_password_saving: absent
          rdp_disable_drive_redirection: absent

  - id: disable_secondary_logon
    name: "Disable the Secondary Logon service"
    description: "Disable the service behind runas and \"Run as different user\"."
    info: |
      **Disables the Secondary Logon service, which lets a program run as a different user (`runas`). Attackers use it routinely to move between accounts.**

      ## Caveats
      - Some installers, deployment tools and scripts start processes as another user through this service and break.

      ## Notes
      - Normal "Run as administrator" prompts for your own account are unaffected, and no other service depends on this one.
      - The app does not stop a running instance; `runas` can keep working until the service stops or the PC restarts.
      - Reverting restores the start type recorded before you applied.

      ## Recommendation
      Apply it on a single-account home PC, where this service is essentially never used.

      ## Sources
      - [CreateProcessWithLogonW](https://learn.microsoft.com/en-us/windows/win32/api/winbase/nf-winbase-createprocesswithlogonw)
      - [DISA STIG for Windows 11](https://www.stigviewer.com/stigs/microsoft_windows_11)
    risk_level: medium
    elevation: admin
    reversible: true
    requires_reboot: true
    warning: "`runas`, the \"Run as different user\" menu entry and anything calling CreateProcessWithLogonW stop working. Skip it if you keep a separate administrator account."
    effects:
      # One authored option: no authoritative source pins the shipped start type, so an authored
      # "stock" option would have to invent one. Default restores it from the snapshot.
      - id: seclogon_service
        service: { name: seclogon }
    options:
      - label: "Disabled"
        values: { seclogon_service: disabled }

  - id: early_launch_antimalware_policy
    name: "Early Launch Antimalware driver policy"
    description: "Pin the boot-time driver policy so malware cannot loosen it to load an unsigned driver."
    info: |
      **Pins the rule that decides which boot drivers may load after your antimalware's early check, so malware cannot quietly switch it to "load everything" and slip in a bad boot driver.**

      ## Mechanism
      - Early Launch Antimalware sorts each boot driver into good, bad, bad but boot-critical, or unknown before it loads.
      - "Good, unknown and bad but critical" is what Windows already does; writing it makes any change to "no filtering" visible.
      - "Good and unknown" also refuses known-bad drivers that are boot-critical.

      ## Caveats
      - With "Good and unknown", a boot-critical driver classified as bad is refused, and the PC may fail to start.

      ## Notes
      - The riskier "Good only" and the unsafe "no filtering" levels are never offered.
      - Windows decides deletes the value, which leaves Windows' default in force: good, unknown and bad but critical.

      ## Related
      - **Enable the Microsoft vulnerable-driver blocklist** is a separate driver-loading control.

      ## Recommendation
      Choose "Good, unknown and bad but critical" on any PC; it costs one reboot. Choose "Good and unknown" only if you accept a small risk of a boot failure on unusual hardware.

      ## Sources
      - [Early Launch Antimalware](https://learn.microsoft.com/en-us/windows-hardware/drivers/install/early-launch-antimalware)
      - [DISA STIG for Windows 11](https://www.stigviewer.com/stigs/microsoft_windows_11)
    risk_level: medium
    elevation: admin
    reversible: true
    requires_reboot: true
    effects:
      # The enum is 8 / 1 / 3 / 7. Neither 8 ("Good only", can refuse to boot on unusual hardware)
      # nor 7 ("no filtering") is offered.
      - id: driver_load_policy
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Policies\EarlyLaunch', name: DriverLoadPolicy, type: REG_DWORD }
    options:
      - label: "Good, unknown and bad but critical"
        values: { driver_load_policy: 3 }
      - label: "Good and unknown"
        values: { driver_load_policy: 1 }
      - label: "Windows decides"
        values: { driver_load_policy: absent }

  - id: credssp_encryption_oracle
    name: "Force updated CredSSP clients"
    description: "Refuse CredSSP connections from clients that never got the 2018 encryption-oracle fix."
    info: |
      **Makes this PC refuse Remote Desktop and other CredSSP connections from clients that never received the 2018 fix for CVE-2018-0886.**

      ## Notes
      - Since May 2018 Windows already refuses the flawed behaviour when it connects out; this adds the other half, refusing unpatched clients that connect in.
      - Does nothing if nothing on this PC accepts CredSSP connections, for example with Remote Desktop off.
      - Mitigated deletes the value, which leaves Windows' default (Mitigated) in force. The Vulnerable level is never offered.

      ## Related
      - **Harden RDP (NLA + TLS)** requires NLA, which runs over CredSSP.

      ## Recommendation
      Apply it. Skip it only if a machine not updated since 2018 must connect to this PC by Remote Desktop.

      ## Sources
      - [CredSSP updates for CVE-2018-0886](https://support.microsoft.com/en-us/topic/credssp-updates-for-cve-2018-0886-5cbf9e5f-dc6d-744f-9e97-7ba400d6d3ea)
      - [CIS Microsoft Windows Desktop benchmarks](https://www.cisecurity.org/benchmark/microsoft_windows_desktop)
    risk_level: medium
    elevation: admin
    reversible: true
    effects:
      - id: allow_encryption_oracle
        registry:
          { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters', name: AllowEncryptionOracle, type: REG_DWORD }
    options:
      - label: "Force updated clients"
        values: { allow_encryption_oracle: 0 }
      # Never offers 2 ("Vulnerable"); the effective default has been 1 ("Mitigated") since May 2018.
      - label: "Mitigated"
        values: { allow_encryption_oracle: absent }

  - id: device_encryption_posture
    name: "Prevent automatic device encryption"
    description: "Stop Windows automatically encrypting your drive and escrowing the recovery key."
    info: |
      **Stops Windows turning on device encryption (BitLocker) automatically and saving the recovery key to your Microsoft account, so encryption becomes your decision. It lowers protection rather than adding any.**

      ## Mechanism
      - Sets Microsoft's documented `PreventDeviceEncryption = 1`. Windows 11 24H2 encrypts far more new PCs automatically, including on Home.

      ## Caveats
      - The tweak does not read or change the drive's encryption state. Check it yourself in Settings or with `manage-bde -status`.
      - Reverting does not re-encrypt anything; turn device encryption back on in Settings if you want it.

      ## Notes
      - The speed argument against encryption has shrunk: Windows 11 25H2 added hardware-accelerated BitLocker.

      ## Related
      - **Kernel DMA protection policy** needs encryption on for its lock-screen protection.

      ## Recommendation
      Use it only if you want to manage encryption and recovery keys yourself. Otherwise leave automatic encryption on.

      ## Sources
      - [BitLocker overview](https://learn.microsoft.com/en-us/windows/security/operating-system-security/data-protection/bitlocker/)
      - [Announcing hardware-accelerated BitLocker](https://techcommunity.microsoft.com/blog/windows-itpro-blog/announcing-hardware-accelerated-bitlocker/4474609)
    risk_level: medium
    elevation: admin
    reversible: true
    warning: "This one reduces protection rather than adding it: it stops Windows encrypting the drive at all. On a laptop that leaves the house, leave automatic device encryption alone. It also has no effect on a volume that is already encrypted."
    effects:
      - id: prevent_device_encryption
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\BitLocker', name: PreventDeviceEncryption, type: REG_DWORD }
    options:
      - label: "Prevent automatic encryption"
        values: { prevent_device_encryption: 1 }
      - label: "Automatic encryption allowed"
        values: { prevent_device_encryption: absent }

  - id: hide_admin_accounts_on_elevation
    name: "Hide admin accounts on the UAC prompt"
    description: "Stop the UAC prompt listing every administrator account, and remove the password-reveal eye."
    info: |
      **Stops the UAC prompt listing every administrator account for a standard user to pick from, and removes the eye button that reveals a typed password.**

      ## Drawbacks
      - You type the administrator name instead of clicking it.
      - Without the reveal button, a mistyped long password is harder to spot.

      ## Notes
      - It only protects against someone looking at the screen.
      - The per-user copy of the reveal setting goes to the account the app runs as; the machine copy covers everyone else.

      ## Related
      - **Hide last signed-in username** does the same job on the sign-in screen.

      ## Recommendation
      Worth it wherever others can see the screen; the cost is a little extra typing.

      ## Sources
      - [Policy CSP - CredentialsUI](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-credentialsui)
      - [DISA STIG for Windows 11](https://www.stigviewer.com/stigs/microsoft_windows_11)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      # EnumerateAdministrators enabled means "do enumerate", so the hardened value is 0.
      - id: enumerate_administrators
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CredUI', name: EnumerateAdministrators, type: REG_DWORD }
      - id: disable_password_reveal_machine
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\CredUI', name: DisablePasswordReveal, type: REG_DWORD }
      # Class Both, so the per-user twin is written and reverted alongside the machine copy.
      - id: disable_password_reveal_user
        registry: { key: 'HKCU\SOFTWARE\Policies\Microsoft\Windows\CredUI', name: DisablePasswordReveal, type: REG_DWORD }
    options:
      - label: "Hidden"
        values: { enumerate_administrators: 0, disable_password_reveal_machine: 1, disable_password_reveal_user: 1 }
      - label: "Shown"
        values: { enumerate_administrators: absent, disable_password_reveal_machine: absent, disable_password_reveal_user: absent }

  - id: event_log_retention
    name: "Event log retention size"
    description: "Make the Application, System and Security logs big enough that a busy day does not overwrite the evidence."
    info: |
      **Makes the Application, System and Security event logs bigger, so a busy day does not overwrite the evidence before anyone reads it.**

      ## Mechanism
      - Sets each log's maximum size by policy: Application and System 32 MB, Security 192 MB (Standard) or 1 GB (Large, STIG). A full log overwrites its oldest events.

      ## Drawbacks
      - Uses disk: the 1 GB Security log is a real allocation on a small SSD.

      ## Notes
      - The Setup log and the PowerShell log are not resized.
      - Windows decides deletes the values, so each log returns to its own default size.
      - On a managed PC, an event log Group Policy wins at the next refresh.

      ## Related
      - **Enable logon/credential auditing**, **Log command lines in process-creation events** and the PowerShell logging tweaks fill these logs.

      ## Recommendation
      Choose Standard if you turned on any auditing. Choose Large only if you actually review the Security log and have the space.

      ## Sources
      - [Policy CSP - EventLogService](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-eventlogservice)
      - [DISA STIG for Windows 11](https://www.stigviewer.com/stigs/microsoft_windows_11)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: application_log_max_size
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\EventLog\Application', name: MaxSize, type: REG_DWORD }
      - id: system_log_max_size
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\EventLog\System', name: MaxSize, type: REG_DWORD }
      - id: security_log_max_size
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\EventLog\Security', name: MaxSize, type: REG_DWORD }
    options:
      - label: "Standard (32 MB / 32 MB / 192 MB)"
        values: { application_log_max_size: 32768, system_log_max_size: 32768, security_log_max_size: 196608 }
      - label: "Large, STIG (32 MB / 32 MB / 1 GB)"
        values: { application_log_max_size: 32768, system_log_max_size: 32768, security_log_max_size: 1024000 }
      - label: "Windows decides"
        values: { application_log_max_size: absent, system_log_max_size: absent, security_log_max_size: absent }

  - id: audit_process_creation_cmdline
    name: "Log command lines in process-creation events"
    description: "Record the full command line of every process Windows starts, not just its name."
    info: |
      **Turns on process-creation auditing and records the full command line of every program Windows starts (event 4688), so the log shows what was run, not only that `powershell.exe` ran.**

      ## Mechanism
      - Two parts, both needed: the Process Creation audit subcategory produces the events, and the command-line policy adds the arguments to them.

      ## Drawbacks
      - The Security log fills faster; pair it with a larger log.

      ## Caveats
      - If the app's record of the previous audit setting is lost, reverting turns process-creation auditing off entirely.

      ## Notes
      - Off deletes the command-line value and restores the audit setting recorded before you applied.
      - If process-creation auditing was already on (for example by Group Policy), applying only adds the command lines and leaves the audit setting alone, and reverting leaves it on.

      ## Related
      - **Event log retention size** enlarges the Security log.
      - **Enable logon/credential auditing** uses a separate audit subcategory; the two combine.

      ## Recommendation
      Enable it if you care about forensic evidence, together with a larger Security log. Skip it if administrators on this PC should not see passwords that scripts pass as arguments.

      ## Sources
      - [Audit Process Creation](https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/audit-process-creation)
      - [auditpol set](https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/auditpol-set)
    risk_level: low
    elevation: admin
    reversible: true
    warning: "Command lines can contain secrets: a password passed as an argument lands in the Security log, readable by every administrator on the machine."
    effects:
      - id: include_cmdline
        registry:
          { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit', name: ProcessCreationIncludeCmdLine_Enabled, type: REG_DWORD }
      # auditpol state is not a registry value, so the apply stashes the prior setting and the undo
      # restores it. Settings are read as the numeric Setting Value (1 success, 2 failure) from
      # `auditpol /backup`: the /get text ("No Auditing") is translated.
      - id: audit_process_creation
        action:
          apply: |
            $ErrorActionPreference = 'Stop'
            $sub = '{0CCE922B-69AE-11D9-BED3-505054503030}'
            $store = 'HKLM:\SOFTWARE\MagicXToolbox\State'
            $f = Join-Path $env:TEMP ('mxt-audit-' + [guid]::NewGuid() + '.csv')
            auditpol /backup /file:$f | Out-Null
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $v = $null
            foreach ($l in Get-Content -LiteralPath $f) { if ($l -match ([regex]::Escape($sub) + '.*,(\d+)\s*$')) { $v = [int]$Matches[1] } }
            Remove-Item -LiteralPath $f -Force
            if ($null -eq $v) { exit 1 }
            # New-Item -Force on an existing key deletes its values.
            if (-not (Test-Path $store)) { New-Item -Path $store -Force | Out-Null }
            # Keep the first stash: a re-apply must not replace the pre-tweak setting with this tweak's own.
            if ($null -eq (Get-ItemProperty -Path $store -Name AuditProcessCreationPriorSetting -ErrorAction SilentlyContinue)) {
              New-ItemProperty -Path $store -Name AuditProcessCreationPriorSetting -Value $v -PropertyType DWord -Force | Out-Null
            }
            auditpol /set /subcategory:"$sub" /success:enable
            exit $LASTEXITCODE
          undo: |
            $sub = '{0CCE922B-69AE-11D9-BED3-505054503030}'
            $store = 'HKLM:\SOFTWARE\MagicXToolbox\State'
            $p = (Get-ItemProperty -Path $store -Name AuditProcessCreationPriorSetting -ErrorAction SilentlyContinue).AuditProcessCreationPriorSetting
            # Without a stash, the Windows default: No Auditing.
            $v = if ($null -eq $p) { 0 } else { [int]$p }
            auditpol /set /subcategory:"$sub" /success:$(if ($v -band 1) { 'enable' } else { 'disable' }) /failure:$(if ($v -band 2) { 'enable' } else { 'disable' })
            $code = $LASTEXITCODE
            if ($code -eq 0) { Remove-ItemProperty -Path $store -Name AuditProcessCreationPriorSetting -Force -ErrorAction SilentlyContinue }
            exit $code
          probe: |
            $sub = '{0CCE922B-69AE-11D9-BED3-505054503030}'
            $f = Join-Path $env:TEMP ('mxt-audit-' + [guid]::NewGuid() + '.csv')
            auditpol /backup /file:$f | Out-Null
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $v = $null
            foreach ($l in Get-Content -LiteralPath $f) { if ($l -match ([regex]::Escape($sub) + '.*,(\d+)\s*$')) { $v = [int]$Matches[1] } }
            Remove-Item -LiteralPath $f -Force -ErrorAction SilentlyContinue
            if ($v -band 1) { exit 0 } else { exit 1 }
          shell: powershell
    options:
      - label: "Enabled"
        values: { include_cmdline: 1, audit_process_creation: run }
      # Omitting the action drives its undo, which restores the captured subcategory setting.
      - label: "Off"
        values: { include_cmdline: absent }

  - id: spooler_remote_rpc_off
    name: "Turn off the spooler's remote RPC endpoint"
    description: "Stop the print spooler accepting connections from the network while local printing keeps working."
    info: |
      **Stops the Print Spooler accepting connections from other computers and requires encrypted print connections, while printing from this PC keeps working.**

      ## Mechanism
      - Closes the remote half of the PrintNightmare family of attacks; restricting driver installs covers the other half.

      ## Notes
      - Restart the Print Spooler service, or the PC, to make it take effect; the app does not do this for you.
      - Client connections allowed deletes both values, returning to Windows' default after the next spooler restart.

      ## Related
      - **Restrict printer-driver install to admins** covers the driver half of PrintNightmare.
      - **Disable Print Spooler (Spooler)** (Services) is stronger if you never print.

      ## Recommendation
      Apply it on a PC that prints but never shares a printer, which is nearly every home and office PC.

      ## Sources
      - [Manage Windows print spooler RPC connection settings](https://learn.microsoft.com/en-us/troubleshoot/windows-server/printing/manage-windows-printer-rpc-connection-settings)
      - [Policy CSP - Printers](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-printers)
    risk_level: medium
    elevation: admin
    reversible: true
    warning: "Remote printing to this PC and sharing printers from it stop working. Printers already shared continue to be shared, and the change is not live until the Print Spooler service restarts."
    effects:
      # The policy key, not Control\Print: written to Control\Print the value lands where the spooler
      # policy path never reads it and the tweak would report success while changing nothing.
      - id: spooler_remote_rpc
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Printers', name: RegisterSpoolerRemoteRpcEndPoint, type: REG_DWORD }
      - id: spooler_rpc_privacy
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Print', name: RpcAuthnLevelPrivacyEnabled, type: REG_DWORD }
    options:
      - label: "No client connections"
        values: { spooler_remote_rpc: 2, spooler_rpc_privacy: 1 }
      - label: "Client connections allowed"
        values: { spooler_remote_rpc: absent, spooler_rpc_privacy: absent }

  - id: remote_uac_token_filter
    name: "Filter the remote local-admin token"
    description: "Ensure a local admin connecting over the network gets a filtered token, not full rights."
    info: |
      **Makes sure a local administrator account signing in over the network gets limited rights, not full admin rights, so a stolen local admin password hash cannot take over the PC remotely.**

      ## Drawbacks
      - Remote `C$` access, remote WMI and remote management consoles using a local admin account stop working. Domain accounts are unaffected.

      ## Notes
      - This is Windows' default behaviour, but many "fix my network shares" guides and tweak scripts switch it off; this pins it.
      - A clean PC has no value set, so the tweak shows System Default until you apply, even though it already behaves as Filtered.
      - Not filtered gives remote local admins full rights, the state this tweak exists to undo. To go back to what you had, pick System Default.

      ## Related
      - **Apply UAC to built-in Administrator** has a similar name but covers the built-in account at the keyboard.
      - **Disable administrative shares (C$, ADMIN$)** removes the shares a remote local admin would use.

      ## Recommendation
      Choose Filtered on any PC not managed remotely with a local admin account, especially if you ever followed a guide to make network shares work.

      ## Sources
      - [User Account Control and remote restrictions](https://learn.microsoft.com/en-us/troubleshoot/windows-server/windows-security/user-account-control-and-remote-restriction)
      - [DISA STIG for Windows 11](https://www.stigviewer.com/stigs/microsoft_windows_11)
    risk_level: medium
    elevation: admin
    reversible: true
    effects:
      - id: local_account_token_filter
        registry: { key: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', name: LocalAccountTokenFilterPolicy, type: REG_DWORD }
    options:
      # "Not filtered" has to write 1. Absent behaves exactly as 0, so an `absent` option would have
      # been labelled for a state it cannot reach: both options would have left the token filtered.
      - label: "Filtered"
        values: { local_account_token_filter: 0 }
      - label: "Not filtered"
        values: { local_account_token_filter: 1 }

  - id: enable_sehop
    name: "Enable SEHOP"
    description: "Pin Structured Exception Handling Overwrite Protection on so it cannot be quietly turned off."
    info: |
      **Pins SEHOP, a defence against one kind of memory-corruption exploit, on with an explicit value so it cannot be quietly turned off.**

      ## Caveats
      - Rests on the DISA STIG check and community sources; Microsoft's original article is retired.

      ## Notes
      - No behaviour change: 64-bit programs do not use the mechanism SEHOP protects, and it is already on for 32-bit ones. The gain is a value a baseline check can see.
      - Not configured deletes the value, which leaves SEHOP on; no option turns it off.

      ## Recommendation
      Apply it if you want a PC that passes the STIG check. If you want a behaviour improvement, this is not one; skip it and save the reboot.

      ## Sources
      - [DISA STIG for Windows 11](https://www.stigviewer.com/stigs/microsoft_windows_11)
      - [privacy.sexy](https://privacy.sexy/)
    risk_level: low
    elevation: admin
    reversible: true
    requires_reboot: true
    effects:
      # Inverted name: 0 means SEHOP is enabled.
      - id: disable_exception_chain_validation
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\kernel', name: DisableExceptionChainValidation, type: REG_DWORD }
    options:
      - label: "Enabled"
        values: { disable_exception_chain_validation: 0 }
      - label: "Not configured"
        values: { disable_exception_chain_validation: absent }

  - id: disable_pku2u_online_id
    name: "Block PKU2U online identities"
    description: "Block peer-to-peer authentication that uses online identities instead of a real account."
    info: |
      **Refuses peer-to-peer sign-in requests that use online identities instead of an account on this PC. On a standalone PC they are allowed by default, so this really turns something off.**

      ## Mechanism
      - PKU2U lets two PCs without a shared domain authenticate each other using online identities. This sets `AllowOnlineID = 0`.

      ## Caveats
      - The registry location comes from DISA STIG and CIS; Microsoft documents only the policy.

      ## Notes
      - Allowed deletes the value, which leaves Windows' default in force: allowed on a standalone PC.
      - Domain-joined PCs already refuse these requests by default.

      ## Recommendation
      Apply it on a PC that never signs in peer-to-peer with another non-domain PC. If you share files or use device-to-device features across a workgroup, leave it alone.

      ## Sources
      - [Allow PKU2U authentication requests to use online identities](https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/network-security-allow-pku2u-authentication-requests-to-this-computer-to-use-online-identities)
      - [DISA STIG for Windows 11](https://www.stigviewer.com/stigs/microsoft_windows_11)
    risk_level: medium
    elevation: admin
    reversible: true
    warning: "The policy is enabled by default on a standalone client, so this really does turn something off. Workgroup peer-to-peer authentication and features such as Failover Clustering stop working."
    effects:
      - id: pku2u_allow_online_id
        registry: { key: 'HKLM\SYSTEM\CurrentControlSet\Control\Lsa\pku2u', name: AllowOnlineID, type: REG_DWORD }
    options:
      - label: "Blocked"
        values: { pku2u_allow_online_id: 0 }
      - label: "Allowed"
        values: { pku2u_allow_online_id: absent }

  - id: no_index_encrypted_files
    name: "Do not index encrypted files"
    description: "Keep the contents of EFS-encrypted files out of the unencrypted search index."
    info: |
      **Keeps the contents of EFS-encrypted files out of the Windows Search index, which is stored unencrypted.**

      ## Notes
      - Windows' Control Panel default already skips encrypted content; this enforces that by policy, so it cannot be turned on there.
      - Only per-file (EFS) encryption is involved; BitLocker is unrelated.
      - Not configured deletes the policy, which leaves the Control Panel setting in charge (not indexing encrypted files by default).

      ## Related
      - **Disable Windows Search indexing** (Performance) removes the index entirely; with it applied this does nothing.

      ## Recommendation
      Apply it if you use EFS. If you do not, skip it: the index rebuild costs more than it gains.

      ## Sources
      - [Policy CSP - Search](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-search)
      - [DISA STIG for Windows 11](https://www.stigviewer.com/stigs/microsoft_windows_11)
    risk_level: low
    elevation: admin
    reversible: true
    warning: "Changing this setting rebuilds the entire search index, which is a period of heavy disk and CPU activity. It does nothing at all if the Windows Search service is already disabled."
    effects:
      - id: allow_indexing_encrypted
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search', name: AllowIndexingEncryptedStoresOrItems, type: REG_DWORD }
    options:
      - label: "Not indexed"
        values: { allow_indexing_encrypted: 0 }
      - label: "Not configured"
        values: { allow_indexing_encrypted: absent }

  - id: autoplay_non_volume
    name: "Disallow AutoPlay for non-volume devices"
    description: "Stop AutoPlay acting on phones, cameras and other devices that get no drive letter."
    info: |
      **Stops AutoPlay reacting to phones, cameras and media players, which connect without a drive letter and so escape the drive-based AutoPlay settings.**

      ## Drawbacks
      - Plugging in a phone or camera no longer offers to import photos; open it in File Explorer instead.

      ## Notes
      - The security gain is small: such devices cannot auto-run code the way USB drives once could.
      - Writes both the machine policy and the per-user one that actually governs the shell; the per-user copy lands in the account the app runs as.
      - Takes effect after sign-out or an Explorer restart.

      ## Related
      - **Disable AutoRun/AutoPlay on all drives** covers drives; together they turn AutoPlay fully off.

      ## Recommendation
      Apply it together with the AutoRun tweak. Skip it if you want the photo-import prompt.

      ## Sources
      - [Autoplay Policy CSP](https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-autoplay)
      - [DISA STIG for Windows 11](https://www.stigviewer.com/stigs/microsoft_windows_11)
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      # Class Both, and the per-user policy is the one that governs the shell in practice.
      - id: no_autoplay_non_volume_machine
        registry: { key: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer', name: NoAutoplayfornonVolume, type: REG_DWORD }
      - id: no_autoplay_non_volume_user
        registry: { key: 'HKCU\SOFTWARE\Policies\Microsoft\Windows\Explorer', name: NoAutoplayfornonVolume, type: REG_DWORD }
    options:
      - label: "Disallowed"
        values: { no_autoplay_non_volume_machine: 1, no_autoplay_non_volume_user: 1 }
      - label: "Allowed"
        values: { no_autoplay_non_volume_machine: absent, no_autoplay_non_volume_user: absent }
