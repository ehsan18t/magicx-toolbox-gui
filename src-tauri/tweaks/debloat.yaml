  - id: remove_onedrive
    name: "Remove OneDrive"
    description: "Uninstall the OneDrive client, per-user and per-machine, without deleting local files."
    info: |
      **Uninstalls the OneDrive client, both per-user and per-machine installs, so it stops syncing and asking to back up your folders. Files already downloaded stay on disk.**

      ## Drawbacks
      - Office documents stop saving to the cloud automatically.

      ## Caveats
      - Cloud-only files that were never downloaded become unreachable on this PC; download them first.
      - If Desktop, Documents or Pictures were moved into OneDrive, they may end up somewhere unexpected.
      - Reverting reinstalls OneDrive with winget (needs internet) but does not re-link your account or restore folder redirection; if the reinstall fails, the tweak shows Needs Attention.
      - A feature update can reinstall it.

      ## Notes
      - LTSC images ship without OneDrive, so they already read as Removed.

      ## Related
      - **Turn off File Explorer sync-provider ads** removes the upsell banners without uninstalling anything.

      ## Recommendation
      Remove it if you never use OneDrive and have checked for cloud-only files and redirected folders. If you sync anything, leave it.

      ## Sources
      - [Turn off, disable, or uninstall OneDrive](https://support.microsoft.com/en-us/office/turn-off-disable-or-uninstall-onedrive-f32a17ce-3336-40fe-9c38-6efb09f944b0)
      - [Install OneDrive per machine](https://learn.microsoft.com/en-us/sharepoint/per-machine-installation)
    risk_level: medium
    elevation: admin
    reversible: true
    effects:
      - id: onedrive
        action:
          # Per-machine OneDrive (OneDriveSetup.exe /allusers, what Microsoft 365 and modern imaging
          # deploy) lives under Program Files and needs /uninstall /allusers. Finding no installer at
          # all is a failure, not a silent success, and the child's exit code is propagated.
          apply: |
            $ErrorActionPreference = 'Stop'
            $targets = @()
            foreach ($p in @("$env:SystemRoot\SysWOW64\OneDriveSetup.exe", "$env:SystemRoot\System32\OneDriveSetup.exe")) {
              if (Test-Path -LiteralPath $p) { $targets += ,@($p, @('/uninstall')) }
            }
            foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if (-not $root) { continue }
              $base = Join-Path $root 'Microsoft OneDrive'
              if (-not (Test-Path -LiteralPath $base)) { continue }
              foreach ($dir in (Get-ChildItem -LiteralPath $base -Directory)) {
                $exe = Join-Path $dir.FullName 'OneDriveSetup.exe'
                if (Test-Path -LiteralPath $exe) { $targets += ,@($exe, @('/uninstall', '/allusers')) }
              }
            }
            if ($targets.Count -eq 0) { exit 1 }
            foreach ($t in $targets) {
              $proc = Start-Process -FilePath $t[0] -ArgumentList $t[1] -Wait -PassThru
              if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
            }
            exit 0
          undo: |
            $ErrorActionPreference = 'Stop'
            # Skip an existing install (a rollback of a partial removal): winget's exit code for one is unverified.
            $paths = @("$env:LOCALAPPDATA\Microsoft\OneDrive\OneDrive.exe")
            foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              if ($root) { $paths += (Join-Path $root 'Microsoft OneDrive\OneDrive.exe') }
            }
            foreach ($p in $paths) { if (Test-Path -LiteralPath $p) { exit 0 } }
            winget install --id Microsoft.OneDrive -e --accept-source-agreements --accept-package-agreements
            exit $LASTEXITCODE
          probe: |
            $ErrorActionPreference = 'Stop'
            try {
              if (Get-Process -Name OneDrive -ErrorAction SilentlyContinue) { exit 1 }
              $paths = @("$env:LOCALAPPDATA\Microsoft\OneDrive\OneDrive.exe")
              foreach ($root in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
                if ($root) { $paths += (Join-Path $root 'Microsoft OneDrive\OneDrive.exe') }
              }
              foreach ($p in $paths) { if (Test-Path -LiteralPath $p) { exit 1 } }
            } catch { exit 1 }
            exit 0
          shell: powershell
          timeout: 600
    options:
      - label: "Removed"
        values: { onedrive: run }
