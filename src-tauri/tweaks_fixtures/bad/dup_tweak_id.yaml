category:
  id: dup_tweak_id
  name: "Fixture"
  icon: "mdi:alert"
  description: "Two tweaks share one id, so both would write the same snapshots/<id>/ folder."

tweaks:
  - id: same_tweak
    name: "First"
    description: "Owns the widget toggle."
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: widget
        registry: { key: 'HKLM\SOFTWARE\ExampleCo\Widget', name: Enabled, type: REG_DWORD }
    options:
      - label: "On"
        values:
          widget: 1

  - id: same_tweak
    name: "Second"
    description: "Reuses the first tweak's id; this is the violation."
    risk_level: low
    elevation: admin
    reversible: true
    effects:
      - id: gadget
        registry: { key: 'HKLM\SOFTWARE\ExampleCo\Gadget', name: Enabled, type: REG_DWORD }
    options:
      - label: "On"
        values:
          gadget: 1
